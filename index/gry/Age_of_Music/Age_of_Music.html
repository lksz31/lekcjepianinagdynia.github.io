<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Age of the Music</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;width:100%;overflow:hidden;background:#1a2a0e;font-family:'Cinzel',serif;}
#hud{position:fixed;top:0;left:0;right:0;height:52px;background:rgba(10,16,6,0.97);border-bottom:2px solid #3a5a1a;display:flex;align-items:center;gap:12px;padding:0 14px;z-index:100;}
.res{display:flex;align-items:center;gap:5px;font-size:11px;color:#c8b87a;letter-spacing:.05em;white-space:nowrap;}
.res-icon{height:26px;width:auto;image-rendering:pixelated;}
.res-val{font-weight:700;color:#f0d060;min-width:24px;}
#hud-sep{flex:1;}
#sell-btn{padding:4px 12px;background:transparent;border:1px solid #4a6a1a;color:#7ab04a;font-family:'Cinzel',serif;font-size:9px;cursor:pointer;border-radius:3px;transition:.15s;letter-spacing:.07em;}
#sell-btn:hover{border-color:#f0d060;color:#f0d060;}
#hud-title{font-size:12px;color:#d4af37;letter-spacing:.18em;font-weight:700;white-space:nowrap;}
#game-wrap{position:fixed;inset:52px 210px 0 0;overflow:hidden;background:#1a2a0e;}
#map-canvas{display:block;}
#sidebar{position:fixed;right:0;top:52px;bottom:0;width:210px;background:rgba(6,10,4,0.97);border-left:2px solid #2a4a0a;padding:10px 9px;overflow-y:auto;z-index:50;display:flex;flex-direction:column;gap:7px;}
#sidebar h3{font-size:8px;color:#3a4a1a;letter-spacing:.15em;text-transform:uppercase;padding-bottom:4px;border-bottom:1px solid #1a2a0a;}
.hex-info{font-family:'Crimson Text',serif;font-size:11.5px;color:#7a8a5a;line-height:1.6;}
.hex-info b{color:#b8a86a;font-family:'Cinzel',serif;font-size:9px;}
.action-btn{width:100%;padding:6px 8px;background:transparent;border:1px solid #3a5a1a;color:#7a9a5a;font-family:'Cinzel',serif;font-size:8px;cursor:pointer;border-radius:3px;transition:.15s;letter-spacing:.04em;margin-top:3px;text-align:left;}
.action-btn:hover:not(:disabled){border-color:#f0d060;color:#f0d060;}
.action-btn:disabled{opacity:0.28;cursor:not-allowed;}
.action-btn.danger{border-color:#5a2a0a;color:#9a5a2a;}
.action-btn.danger:hover:not(:disabled){border-color:#e06020;color:#e06020;}
.progress-wrap{margin-top:4px;height:3px;background:#1a2a0a;border-radius:2px;overflow:hidden;}
.progress-bar{height:100%;background:linear-gradient(90deg,#2a7a10,#f0d060);border-radius:2px;}
.prog-label{font-family:'Crimson Text',serif;font-size:9px;color:#4a5a2a;margin-top:2px;}
#music-modal{position:fixed;inset:0;z-index:500;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.82);}
#music-modal.show{display:flex;}
.music-panel{background:#020a02;border:2px solid #3a5a1a;border-radius:12px;padding:20px 22px;width:340px;max-width:96vw;display:flex;flex-direction:column;gap:10px;color:#c8b87a;}
.music-panel h2{font-size:.82rem;color:#d4af37;letter-spacing:.16em;text-align:center;}
.music-task{font-family:'Crimson Text',serif;font-size:1rem;text-align:center;color:#8a9a6a;}
.music-task b{font-size:1.5rem;color:#f0d060;font-family:'Cinzel',serif;}
.note-arrow-row{display:flex;justify-content:center;gap:14px;}
.note-arr-btn{width:38px;height:38px;background:transparent;border:1px solid #3a5a1a;color:#d4af37;font-size:20px;cursor:pointer;border-radius:4px;transition:.15s;display:flex;align-items:center;justify-content:center;}
.note-arr-btn:hover{background:rgba(212,175,55,.12);border-color:#d4af37;}
.music-controls{display:flex;justify-content:center;gap:10px;}
.mus-btn{padding:7px 16px;background:transparent;border:1px solid #3a5a1a;color:#7aaa5a;font-family:'Cinzel',serif;font-size:.62rem;cursor:pointer;border-radius:3px;transition:.15s;letter-spacing:.1em;}
.mus-btn:hover{border-color:#d4af37;color:#d4af37;}
.mus-btn.primary{border-color:#d4af37;color:#d4af37;}
.mus-btn.primary:hover{background:rgba(212,175,55,.15);}
.music-result{text-align:center;font-family:'Crimson Text',serif;font-size:.88rem;min-height:20px;}
.music-result.ok{color:#60e870;}
.music-result.fail{color:#e05050;}
#tooltip{position:fixed;pointer-events:none;background:rgba(2,8,2,0.95);border:1px solid #3a5a1a;border-radius:6px;padding:5px 9px;font-family:'Crimson Text',serif;font-size:11.5px;color:#c8b87a;z-index:200;display:none;max-width:175px;line-height:1.5;}
#win-screen{position:fixed;inset:0;z-index:999;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.92);flex-direction:column;gap:16px;}
#win-screen.show{display:flex;}
#win-screen h1{font-size:2rem;color:#f0d060;letter-spacing:.15em;text-shadow:0 0 30px rgba(240,208,60,.6);}
.win-btn{padding:10px 26px;background:transparent;border:2px solid #f0d060;color:#f0d060;font-family:'Cinzel',serif;font-size:.78rem;cursor:pointer;border-radius:4px;transition:.2s;letter-spacing:.12em;}
.win-btn:hover{background:#f0d060;color:#040c04;}
#sell-panel{position:fixed;right:220px;top:52px;background:#020a02;border:1px solid #3a5a1a;border-radius:8px;padding:12px 14px;z-index:150;display:none;min-width:165px;}
#sell-panel.show{display:block;}
#sell-panel h4{font-size:.58rem;color:#5a6a2a;letter-spacing:.1em;margin-bottom:7px;text-transform:uppercase;}
.sell-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px;}
.sell-row label{font-family:'Crimson Text',serif;font-size:.78rem;color:#8a9a6a;display:flex;align-items:center;gap:4px;}
.sell-icon{height:18px;width:auto;image-rendering:pixelated;}
.sell-row button{padding:3px 8px;background:transparent;border:1px solid #3a5a1a;color:#7aaa5a;font-family:'Cinzel',serif;font-size:8px;cursor:pointer;border-radius:3px;transition:.15s;}
.sell-row button:hover{border-color:#f0d060;color:#f0d060;}
.close-small{margin-top:5px;padding:3px 8px;background:transparent;border:1px solid #2a2a0a;color:#4a4a1a;font-family:'Cinzel',serif;font-size:8px;cursor:pointer;border-radius:3px;width:100%;}
.close-small:hover{border-color:#6a6a2a;color:#8a8a4a;}
</style>
</head>
<body>

<div id="hud">
  <span id="hud-title">⚔ AGE OF THE MUSIC</span>
  <div style="width:1px;height:24px;background:#2a3a0a;flex-shrink:0;"></div>
  <div class="res"><img id="icon-gold"  class="res-icon" src=""><span>Złoto:</span><span class="res-val" id="hud-gold">50</span></div>
  <div class="res"><img id="icon-wood"  class="res-icon" src=""><span>Drewno:</span><span class="res-val" id="hud-wood">10</span></div>
  <div class="res"><img id="icon-stone" class="res-icon" src=""><span>Kamień:</span><span class="res-val" id="hud-stone">5</span></div>

  <button id="sell-btn" onclick="toggleSellPanel()">💱 Sprzedaj</button>

  <h4>Sprzedaż surowców</h4>
  <div class="sell-row">
    <label><img class="sell-icon" id="sicon-wood" src=""> 10 → <img class="sell-icon" id="sicon-gold" src=""> 1</label>

  <div class="sell-row">
    <label><img class="sell-icon" id="sicon-stone" src=""> 10 → <img class="sell-icon" id="sicon-gold2" src=""> 3</label>

<div id="game-wrap"><canvas id="map-canvas"></canvas></div>

<div id="sidebar">
  <h3>Zaznaczone pole</h3>
  <div id="hex-info-box" class="hex-info"><span style="color:#2a3a0a;font-style:italic;">Kliknij hex…</span></div>
  <div id="action-box"></div>
</div>

<div id="tooltip"></div>

<div id="music-modal">
  <div class="music-panel">
    <h2>🎵 Wydobycie Surowca</h2>
    <div class="music-task">Zagraj nutę: <b id="music-target-note">c</b></div>
    <div style="margin:4px auto;">
      <svg id="staff-svg" width="296" height="120" viewBox="0 0 296 120" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div class="note-arrow-row">
      <button class="note-arr-btn" onclick="moveNote(1)">▲</button>
      <button class="note-arr-btn" onclick="moveNote(-1)">▼</button>
    </div>
    <div class="music-controls">
      <button class="mus-btn" onclick="closeMusicModal()">Anuluj</button>
      <button class="mus-btn primary" onclick="confirmNote()">✓ Zatwierdź</button>
    </div>
    <div id="music-result" class="music-result"></div>
  </div>
</div>

<div id="win-screen">
  <h1>🏆 Zwycięstwo!</h1>
  <p style="font-family:'Crimson Text',serif;font-size:1rem;color:#8a9a6a;">Przejąłeś ratusz wroga!</p>
  <button class="win-btn" onclick="location.reload()">🎲 Nowa gra</button>
</div>

<script>
'use strict';

/* ═══════════════════════════════════════
   ŚCIEŻKA BAZOWA
═══════════════════════════════════════ */
const BASE = '/index/gry/Age_of_Music/ilustracje/tales/';

/* ═══════════════════════════════════════
   WSZYSTKIE OBRAZKI
═══════════════════════════════════════ */
const SRC = {
  // Teren leśny (zielony) — losowany per hex
  drewno: [1,2,3,4,5].map(i => BASE+'drewno_'+i+'.png'),
  // Teren kamienny (szary) — losowany per hex
  kamien: [1,2,3,4,5].map(i => BASE+'kamień_'+i+'.png'),
  // Tartaki — losowany per hex przy budowie
  tartak: [1,2,3,4,5,6].map(i => BASE+'tartak_'+i+'.png'),
  // Kamieniołomy — losowany per hex przy budowie
  kamieniolom: [1,2,3,4,5,6,7].map(i => BASE+'kamieniołom_'+i+'.png'),
  // Ratusz gracza i wroga
  ratusz_player: BASE+'ratusz_1.png',
  ratusz_enemy:  BASE+'ratusz_2.png',
  // Rynek (jeśli będzie potrzebny w przyszłości)
  rynek: [1,2,3,4,5,6].map(i => BASE+'rynek_'+i+'.png'),
  // Tokeny w HUD
  token_drewno: BASE+'drewno_token_1.png',
  token_kamien: BASE+'kamien_token_1.png',
  token_moneta: BASE+'moneta_1.png',
};

// Cache załadowanych obrazków
const IMGS = {};
function loadImg(src){
  if(!src) return null;
  if(IMGS[src]) return IMGS[src];
  const im = new Image();
  im.src = src;
  IMGS[src] = im;
  return im;
}
// Preload wszystkiego
[...SRC.drewno,...SRC.kamien,...SRC.tartak,...SRC.kamieniolom,...SRC.rynek,
 SRC.ratusz_player,SRC.ratusz_enemy,
 SRC.token_drewno,SRC.token_kamien,SRC.token_moneta
].forEach(s=>loadImg(s));

// Ustaw tokeny w HUD po załadowaniu
window.addEventListener('load',()=>{
  ['icon-gold','sicon-gold','sicon-gold2'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.src=SRC.token_moneta;
  });
  ['icon-wood','sicon-wood'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.src=SRC.token_drewno;
  });
  ['icon-stone','sicon-stone'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.src=SRC.token_kamien;
  });
});
// Ustaw od razu (nie czekając na load)
setTimeout(()=>{
  ['icon-gold','sicon-gold','sicon-gold2'].forEach(id=>{const el=document.getElementById(id);if(el)el.src=SRC.token_moneta;});
  ['icon-wood','sicon-wood'].forEach(id=>{const el=document.getElementById(id);if(el)el.src=SRC.token_drewno;});
  ['icon-stone','sicon-stone'].forEach(id=>{const el=document.getElementById(id);if(el)el.src=SRC.token_kamien;});
},100);

function randFrom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

/* ═══════════════════════════════════════
   CONFIG
═══════════════════════════════════════ */
const CFG = {
  startGold:50, startWood:10, startStone:5,
  claimTime:4000, buildTime:4000,
  claimCostEmpty:10, claimCostEnemy:30,
  claimCostBuilding:30, claimCostMarket:50,
  buildSawmillWood:7,
  buildQuarryStone:12, buildQuarryWood:5,
  sellWoodRate:10, sellWoodGold:1,
  sellStoneRate:10, sellStoneGold:3,
  adjBonus:0.25,
  // Rynek
  marketInterval:10000,
  marketBase:0.2,
  marketGroupBonus:0.1,
  // Ratusz
  townhallInterval:15000,
  townhallGold:3,
  townhallWood:2,
  townhallStone:2,
};

/* ═══════════════════════════════════════
   ISO HEX MATH
═══════════════════════════════════════ */
const HS    = 120;
const DEPTH = 30;
const SQRT3 = Math.sqrt(3);

// Klasyczna izometria 2:1
function isoProject(wx, wy){
  return { x:(wx-wy)*0.5, y:(wx+wy)*0.25 };
}
function isoUnproject(sx, sy){
  return { wx: sx+sy*2, wy: sy*2-sx };
}
function axialToWorld(q,r){
  return { wx:HS*1.5*q, wy:HS*SQRT3*(r+q/2) };
}
function axialToScreen(q,r,ox,oy){
  const {wx,wy}=axialToWorld(q,r);
  const p=isoProject(wx,wy);
  return {sx:p.x+ox, sy:p.y+oy};
}
function screenToAxial(px,py,ox,oy){
  const {wx,wy}=isoUnproject(px-ox,py-oy);
  const q=wx/(HS*1.5);
  const r=wy/(HS*SQRT3)-q/2;
  return hexRound(q,r);
}
function hexRound(q,r){
  const s=-q-r;
  let rq=Math.round(q),rr=Math.round(r),rs=Math.round(s);
  const dq=Math.abs(rq-q),dr=Math.abs(rr-r),ds=Math.abs(rs-s);
  if(dq>dr&&dq>ds) rq=-rr-rs; else if(dr>ds) rr=-rq-rs;
  return {q:rq,r:rr};
}
function isoHexTop(sx,sy){
  const pts=[];
  for(let i=0;i<6;i++){
    const a=Math.PI/3*i;
    const lx=HS*Math.cos(a), ly=HS*Math.sin(a);
    const p=isoProject(lx,ly);
    pts.push({x:sx+p.x, y:sy+p.y});
  }
  return pts;
}
const HEX_DIRS=[{q:1,r:0},{q:1,r:-1},{q:0,r:-1},{q:-1,r:0},{q:-1,r:1},{q:0,r:1}];
function hexKey(q,r){return q+','+r;}
function getNeighbors(q,r){return HEX_DIRS.map(d=>({q:q+d.q,r:r+d.r}));}

/* ═══════════════════════════════════════
   STATE
═══════════════════════════════════════ */
let gold=CFG.startGold, wood=CFG.startWood, stone=CFG.startStone;
let goldAccum=0; // akumulator ułamkowego złota z rynków
let lastMarketTick=0, lastTownhallTick=0;
let hexes={}, drawOrder=[], selected=null;
let originX=0, originY=0;

/* ═══════════════════════════════════════
   INIT
═══════════════════════════════════════ */
function initGame(){
  hexes={};
  const COLS=10, ROWS=10;
  for(let row=0;row<ROWS;row++){
    for(let col=0;col<COLS;col++){
      const q=col-Math.floor(row/2), r=row;
      const key=hexKey(q,r);
      const terrain=Math.random()<0.55?'green':'gray';
      hexes[key]={
        q,r,terrain,owner:null,building:null,
        // Losuj PNG terenu raz na zawsze dla tego hexa
        terrainSrc: terrain==='green'
          ? randFrom(SRC.drewno)
          : randFrom(SRC.kamien),
        buildingSrc: null, // losowane przy budowie
        claimProg:null,claimStart:null,
        buildProg:null,buildStart:null,buildType:null
      };
    }
  }

  // Painter's algorithm: r rosnąco, przy równym r q rosnąco
  drawOrder=Object.keys(hexes).sort((a,b)=>{
    const ha=hexes[a],hb=hexes[b];
    if(ha.r!==hb.r) return ha.r-hb.r;
    return ha.q-hb.q;
  });

  // ── Gracz (środek lewego boku: row=5, col=0) ──
  // offset axial: q=col-floor(row/2), r=row
  const pStartR=5, pStartQ=0-Math.floor(5/2); // q=-2, r=5
  const pStartKey=hexKey(pStartQ,pStartR);
  // fallback jeśli hex nie istnieje
  const pBase=hexes[pStartKey]?pStartKey:drawOrder[0];
  let sawKey=pBase, quarryKey=null, townKey=null;
  for(const nb of getNeighbors(hexes[sawKey].q,hexes[sawKey].r)){
    const k=hexKey(nb.q,nb.r);
    if(!hexes[k]) continue;
    if(!quarryKey){quarryKey=k;continue;}
    if(!townKey){townKey=k;break;}
  }
  quarryKey=quarryKey||drawOrder[1]||sawKey;
  townKey  =townKey  ||drawOrder[2]||sawKey;

  hexes[sawKey].terrain='green';
  hexes[sawKey].terrainSrc=randFrom(SRC.drewno);
  hexes[sawKey].owner='player';
  hexes[sawKey].building='sawmill';
  hexes[sawKey].buildingSrc=randFrom(SRC.tartak);

  hexes[quarryKey].terrain='gray';
  hexes[quarryKey].terrainSrc=randFrom(SRC.kamien);
  hexes[quarryKey].owner='player';
  hexes[quarryKey].building='quarry';
  hexes[quarryKey].buildingSrc=randFrom(SRC.kamieniolom);

  hexes[townKey].owner='player';
  hexes[townKey].building='townhall';
  hexes[townKey].buildingSrc=SRC.ratusz_player;

  // ── Wróg (środek prawego boku: row=5, col=9) ──
  const eStartR=5, eStartQ=9-Math.floor(5/2); // q=7, r=5
  const eStartKey=hexKey(eStartQ,eStartR);
  let eTown=hexes[eStartKey]?eStartKey:null;
  // unikaj kolizji z graczem
  if(!eTown||eTown===sawKey||eTown===quarryKey||eTown===townKey){
    const eKeys=[...drawOrder].reverse();
    for(const k of eKeys){
      if(k===sawKey||k===quarryKey||k===townKey) continue;
      eTown=k; break;
    }
  }
  let eS=null,eQ=null;
  if(eTown){
    hexes[eTown].owner='enemy';
    hexes[eTown].building='townhall';
    hexes[eTown].buildingSrc=SRC.ratusz_enemy;

    for(const nb of getNeighbors(hexes[eTown].q,hexes[eTown].r)){
      const k=hexKey(nb.q,nb.r);
      if(!hexes[k]||k===sawKey||k===quarryKey||k===townKey) continue;
      if(!eS){eS=k;continue;}
      if(!eQ){eQ=k;break;}
    }
    eS=eS||eKeys.find(k=>k!==eTown&&k!==sawKey&&k!==quarryKey&&k!==townKey)||eTown;
    eQ=eQ||eKeys.find(k=>k!==eTown&&k!==eS&&k!==sawKey&&k!==quarryKey&&k!==townKey)||eTown;

    hexes[eS].owner='enemy'; hexes[eS].terrain='green';
    hexes[eS].terrainSrc=randFrom(SRC.drewno);
    hexes[eS].building='sawmill';
    hexes[eS].buildingSrc=randFrom(SRC.tartak);

    hexes[eQ].owner='enemy'; hexes[eQ].terrain='gray';
    hexes[eQ].terrainSrc=randFrom(SRC.kamien);
    hexes[eQ].building='quarry';
    hexes[eQ].buildingSrc=randFrom(SRC.kamieniolom);
  }

  lastMarketTick=Date.now(); lastTownhallTick=Date.now();
  fitCanvas(); updateHUD();
  requestAnimationFrame(gameLoop);
}

/* ═══════════════════════════════════════
   CANVAS
═══════════════════════════════════════ */
const canvas=document.getElementById('map-canvas');
const ctx=canvas.getContext('2d');

function fitCanvas(){
  const wrap=document.getElementById('game-wrap');
  const W=wrap.clientWidth, H=wrap.clientHeight;
  const dpr=window.devicePixelRatio||1;
  // HiDPI: canvas pixel buffer = logical * dpr
  canvas.width  = Math.round(W*dpr);
  canvas.height = Math.round(H*dpr);
  canvas.style.width  = W+'px';
  canvas.style.height = H+'px';
  // Scale context to match DPR - pixel art stays sharp
  ctx.setTransform(dpr,0,0,dpr,0,0);
  // PIXEL ART: wyłącz anti-aliasing
  ctx.imageSmoothingEnabled=false;
  // Wyśrodkuj mapę (w logicznych pikselach)
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(const k of Object.keys(hexes)){
    const h=hexes[k],{sx,sy}=axialToScreen(h.q,h.r,0,0);
    minX=Math.min(minX,sx);maxX=Math.max(maxX,sx);
    minY=Math.min(minY,sy);maxY=Math.max(maxY,sy);
  }
  originX=W/2-(minX+maxX)/2;
  originY=H/2-(minY+maxY)/2+DEPTH/2;
}

/* ═══════════════════════════════════════
   DRAW LOOP
═══════════════════════════════════════ */
function gameLoop(){ updateTimers(); draw(); requestAnimationFrame(gameLoop); }

const BG_IMG = new Image();
BG_IMG.src = '/index/gry/Age_of_Music/ilustracje/concept_art/tło_1.png';

function draw(){
  const W=canvas.width/(window.devicePixelRatio||1);
  const H=canvas.height/(window.devicePixelRatio||1);
  ctx.imageSmoothingEnabled=false;
  ctx.clearRect(0,0,W,H);
  if(BG_IMG.complete && BG_IMG.naturalWidth>0){
    const iw=BG_IMG.naturalWidth, ih=BG_IMG.naturalHeight;
    const scale=Math.max(W/iw, H/ih);
    const dw=iw*scale, dh=ih*scale;
    ctx.drawImage(BG_IMG,(W-dw)/2,(H-dh)/2,dw,dh);
    ctx.fillStyle='rgba(0,0,0,0.38)';
    ctx.fillRect(0,0,W,H);
  } else {
    const sky=ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,'#2a4a18'); sky.addColorStop(1,'#0e1e08');
    ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
  }
  for(const k of drawOrder) drawIsoHex(k);
}

/* ═══════════════════════════════════════
   DRAW HEX
═══════════════════════════════════════ */
function imgReady(im){ return im&&im.complete&&im.naturalWidth>0; }

function drawIsoHex(key){
  const h=hexes[key];
  const {sx,sy}=axialToScreen(h.q,h.r,originX,originY);
  const top=isoHexTop(sx,sy);
  const isSel=selected===key;

  // ── Boki widoczne w izometrii 2:1 (dolna połowa hexa) ──
  // narożniki 0=prawy, 1=prawy-dolny, 2=lewy-dolny, 3=lewy, 4=lewy-górny, 5=prawy-górny
  // Widoczne: prawy (0→1), prawy-dolny (1→2), lewy-dolny (2→3)
  const sideBase = h.owner==='player'?'#1a3a10':h.owner==='enemy'?'#3a1010':'#1a1a10';
  drawSide(top[0],top[1],darken(sideBase,0.45),isSel); // prawy
  drawSide(top[1],top[2],darken(sideBase,0.32),isSel); // prawy-dolny
  drawSide(top[2],top[3],darken(sideBase,0.38),isSel); // lewy-dolny

  // ── Górna powierzchnia ──
  ctx.beginPath();
  top.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.closePath();

  const terrainImg=loadImg(h.terrainSrc);
  if(imgReady(terrainImg)){
    ctx.save();
    ctx.clip(); // clip do kształtu hexa (ścieżka już narysowana wyżej)
    const xs=top.map(p=>p.x),ys=top.map(p=>p.y);
    const bx=Math.min(...xs),by=Math.min(...ys),bw=Math.max(...xs)-bx,bh=Math.max(...ys)-by;
    // Skaluj PNG tak żeby SZEROKOŚĆ pasowała do hexa - zachowuje proporcje pikseli
    const iw=terrainImg.naturalWidth, ih=terrainImg.naturalHeight;
    const scaleW=bw/iw, scaleH=bh/ih;
    const sc=Math.max(scaleW,scaleH); // cover - bez białych pasków
    const dw=iw*sc, dh=ih*sc;
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(terrainImg, bx+(bw-dw)/2, by+(bh-dh)/2, dw, dh);
    if(h.owner==='enemy'){ctx.fillStyle='rgba(80,0,0,0.28)';ctx.fillRect(bx,by,bw,bh);}
    else if(!h.owner){ctx.fillStyle='rgba(0,0,0,0.18)';ctx.fillRect(bx,by,bw,bh);}
    if(isSel){ctx.fillStyle='rgba(240,208,60,0.10)';ctx.fillRect(bx,by,bw,bh);}
    ctx.restore();
  } else {
    // Fallback kolor
    let fc=h.terrain==='green'
      ?(h.owner==='player'?'#2a6a20':h.owner==='enemy'?'#5a2510':'#1e4a14')
      :(h.owner==='player'?'#3a3a6a':h.owner==='enemy'?'#4a1a3a':'#222230');
    if(isSel) fc=blendHex(fc,'#f0d060',0.22);
    ctx.fillStyle=fc; ctx.fill();
  }

  // ── Obramowanie ──
  ctx.beginPath();
  top.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.closePath();
  ctx.strokeStyle=isSel?'#f0d060':h.owner==='player'?'rgba(60,160,40,0.8)':h.owner==='enemy'?'rgba(160,40,20,0.8)':'rgba(40,60,20,0.35)';
  ctx.lineWidth=isSel?2.5:1; ctx.stroke();

  // ── Budynek PNG ──
  if(h.building&&h.buildProg===null){
    const bim=loadImg(h.buildingSrc);
    if(imgReady(bim)){
      const xs=top.map(p=>p.x),ys=top.map(p=>p.y);
      const bx=Math.min(...xs),by=Math.min(...ys),bw=Math.max(...xs)-bx,bh=Math.max(...ys)-by;
      // Budynek: skaluj PNG do szerokości hexa, pozwól wystawać w górę (izometryczny look)
      const iw=bim.naturalWidth, ih=bim.naturalHeight;
      // Skaluj tak żeby szerokość PNG = szerokość hexa
      const sc = bw / iw;
      const dw = iw*sc, dh = ih*sc;
      ctx.imageSmoothingEnabled=false;
      // Wyśrodkuj poziomo, ustaw dół PNG na dół hexa
      ctx.drawImage(bim, bx+(bw-dw)/2, by+bh-dh, dw, dh);
    } else {
      // Fallback placeholder
      drawBuildingPlaceholder(h,sx,sy);
    }
  }

  // Fallback gdy budynek w trakcie budowania
  if(h.building&&h.buildProg!==null) drawBuildingPlaceholder(h,sx,sy);

  // ── Pierścień przejęcia ──
  if(h.claimProg!==null){
    ctx.save();
    ctx.beginPath();
    ctx.arc(sx,sy-4,HS*0.55,-Math.PI/2,-Math.PI/2+Math.PI*2*h.claimProg,false);
    ctx.strokeStyle='rgba(240,208,60,0.9)'; ctx.lineWidth=3.5; ctx.stroke();
    ctx.restore();
  }
  // ── Pierścień budowania ──
  if(h.buildProg!==null){
    ctx.save();
    ctx.beginPath();
    ctx.arc(sx,sy-4,HS*0.42,-Math.PI/2,-Math.PI/2+Math.PI*2*h.buildProg,false);
    ctx.strokeStyle='rgba(80,220,80,0.85)'; ctx.lineWidth=3; ctx.stroke();
    ctx.restore();
  }

  // ── Dot właściciela ──
  if(h.owner){
    const dp=isoProject(HS*0.52,0);
    ctx.beginPath(); ctx.arc(sx+dp.x,sy+dp.y-3,5,0,Math.PI*2);
    ctx.fillStyle=h.owner==='player'?'#50e060':'#e04040';
    ctx.fill(); ctx.strokeStyle='rgba(0,0,0,0.5)'; ctx.lineWidth=1; ctx.stroke();
  }
}

function drawSide(a,b,color,isSel){
  const quad=[a,b,{x:b.x,y:b.y+DEPTH},{x:a.x,y:a.y+DEPTH}];
  ctx.beginPath();
  quad.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.closePath();
  ctx.fillStyle=color; ctx.fill();
  if(isSel){ctx.strokeStyle='rgba(240,208,60,0.4)';ctx.lineWidth=0.8;ctx.stroke();}
}

function drawBuildingPlaceholder(h,sx,sy){
  const ph=HS*0.35,pw=HS*0.65;
  const col=h.building==='townhall'
    ?(h.owner==='enemy'?'rgba(160,40,40,0.8)':'rgba(40,80,160,0.8)')
    :h.building==='sawmill'?'rgba(120,80,30,0.8)':'rgba(80,80,100,0.8)';
  const bt=[
    {x:sx,y:sy-ph*2},{x:sx+pw*0.6,y:sy-ph*1.5},
    {x:sx,y:sy-ph},{x:sx-pw*0.6,y:sy-ph*1.5}
  ];
  ctx.beginPath();bt.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.closePath();ctx.fillStyle=col;ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=0.8;ctx.stroke();
  const wr=[bt[1],bt[2],{x:bt[2].x,y:bt[2].y+ph},{x:bt[1].x,y:bt[1].y+ph}];
  ctx.beginPath();wr.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.closePath();ctx.fillStyle=darken(col,0.55);ctx.fill();
  const wl=[bt[2],bt[3],{x:bt[3].x,y:bt[3].y+ph},{x:bt[2].x,y:bt[2].y+ph}];
  ctx.beginPath();wl.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.closePath();ctx.fillStyle=darken(col,0.42);ctx.fill();
  const lbl={sawmill:'TARTAK',quarry:'KAMIENIOŁOM',townhall:'RATUSZ'}[h.building]||'';
  ctx.font=`bold ${Math.round(HS*0.14)}px Cinzel,serif`;
  ctx.fillStyle='rgba(255,240,180,0.9)';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(lbl,sx,sy-ph*1.5-2);
}

/* ═══════════════════════════════════════
   KOLOR HELPERS
═══════════════════════════════════════ */
function darken(hex,f){
  const c=parseCol(hex);
  return toCol(c[0]*f,c[1]*f,c[2]*f,c[3]);
}
function blendHex(a,b,t){
  const ca=parseCol(a),cb=parseCol(b);
  return toCol(ca[0]+(cb[0]-ca[0])*t,ca[1]+(cb[1]-ca[1])*t,ca[2]+(cb[2]-ca[2])*t,ca[3]);
}
function parseCol(h){
  if(h.startsWith('rgba')){const m=h.match(/[\d.]+/g);return[+m[0],+m[1],+m[2],+m[3]];}
  const s=h.replace('#','');
  return[parseInt(s.slice(0,2),16),parseInt(s.slice(2,4),16),parseInt(s.slice(4,6),16),1];
}
function toCol(r,g,b,a){
  const cl=v=>Math.max(0,Math.min(255,Math.round(v)));
  if(a<1) return `rgba(${cl(r)},${cl(g)},${cl(b)},${a.toFixed(2)})`;
  return '#'+[r,g,b].map(v=>cl(v).toString(16).padStart(2,'0')).join('');
}

// Znajdź wszystkie grupy połączonych rynków gracza (flood-fill po sąsiadach)
function getMarketGroups(){
  const visited=new Set();
  const groups=[];
  for(const k of Object.keys(hexes)){
    const h=hexes[k];
    if(h.owner==='player'&&h.building==='market'&&!visited.has(k)){
      // BFS
      const group=[];
      const queue=[k];
      visited.add(k);
      while(queue.length){
        const cur=queue.shift();
        group.push(cur);
        for(const nb of getNeighbors(hexes[cur].q,hexes[cur].r)){
          const nk=hexKey(nb.q,nb.r);
          if(!visited.has(nk)&&hexes[nk]&&hexes[nk].owner==='player'&&hexes[nk].building==='market'){
            visited.add(nk); queue.push(nk);
          }
        }
      }
      groups.push(group);
    }
  }
  return groups;
}

function tickMarkets(){
  // Dla każdej grupy rynków:
  // każdy rynek w grupie generuje: bazowe + (rozmiar_grupy-1)*bonus
  const groups=getMarketGroups();
  let totalGold=0;
  for(const group of groups){
    const groupSize=group.length;
    // premia = (groupSize-1) * 0.1 na każdy rynek w grupie
    const perMarket=CFG.marketBase+(groupSize-1)*CFG.marketGroupBonus;
    totalGold+=perMarket*groupSize;
  }
  if(totalGold>0){
    goldAccum+=totalGold;
    const whole=Math.floor(goldAccum);
    if(whole>0){ gold+=whole; goldAccum-=whole; updateHUD(); }
    showIncomeNotif('rynek','+'+totalGold.toFixed(2)+'💰');
  }
}

function tickTownhall(){
  // Każdy ratusz gracza generuje zasoby
  let count=0;
  for(const k of Object.keys(hexes)){
    const h=hexes[k];
    if(h.owner==='player'&&h.building==='townhall') count++;
  }
  if(count>0){
    gold +=CFG.townhallGold *count;
    wood +=CFG.townhallWood *count;
    stone+=CFG.townhallStone*count;
    updateHUD();
    showIncomeNotif('ratusz','+'+CFG.townhallGold+'💰 +'+CFG.townhallWood+'🪵 +'+CFG.townhallStone+'🪨');
  }
}

// Pływające powiadomienie o dochodzie
function showIncomeNotif(src,text){
  const el=document.createElement('div');
  el.style.cssText='position:fixed;left:50%;top:60px;transform:translateX(-50%);'
    +'background:rgba(4,12,4,0.88);border:1px solid #3a5a1a;border-radius:6px;'
    +'padding:4px 12px;font-family:Cinzel,serif;font-size:10px;color:#f0d060;'
    +'z-index:300;pointer-events:none;letter-spacing:.08em;white-space:nowrap;'
    +'animation:fadeup 1.8s ease forwards;';
  el.textContent=src+': '+text;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1900);
}

// CSS dla animacji powiadomień
if(!document.getElementById('notif-style')){
  const st=document.createElement('style');
  st.id='notif-style';
  st.textContent='@keyframes fadeup{0%{opacity:0;top:60px;}15%{opacity:1;top:54px;}80%{opacity:1;}100%{opacity:0;top:38px;}}';
  document.head.appendChild(st);
}

function updateTimers(){
  const now=Date.now();
  for(const k of Object.keys(hexes)){
    const h=hexes[k];
    if(h.claimStart!==null){
      h.claimProg=Math.min(1,(now-h.claimStart)/CFG.claimTime);
      if(h.claimProg>=1) completeClaim(k);
    }
    if(h.buildStart!==null){
      h.buildProg=Math.min(1,(now-h.buildStart)/CFG.buildTime);
      if(h.buildProg>=1) completeBuild(k);
    }
  }
  // Dochód z rynków (co 10s)
  if(now-lastMarketTick>=CFG.marketInterval){
    lastMarketTick=now;
    tickMarkets();
  }
  // Dochód z ratusza (co 15s)
  if(now-lastTownhallTick>=CFG.townhallInterval){
    lastTownhallTick=now;
    tickTownhall();
  }
}

let clickCount={},clickTimer={};

canvas.addEventListener('click',e=>{
  const rect=canvas.getBoundingClientRect();
  const {q,r}=screenToAxial(e.clientX-rect.left,e.clientY-rect.top,originX,originY);
  const key=hexKey(q,r);
  if(!hexes[key]) return;
  if(selected!==key){selected=key;showHexInfo(key);return;}
  clickCount[key]=(clickCount[key]||0)+1;
  clearTimeout(clickTimer[key]);
  if(clickCount[key]>=2){
    clickCount[key]=0; handleDoubleClick(key);
  } else {
    clickTimer[key]=setTimeout(()=>{clickCount[key]=0;},450);
  }
  showHexInfo(key);
});

canvas.addEventListener('mousemove',e=>{
  const rect=canvas.getBoundingClientRect();
  const {q,r}=screenToAxial(e.clientX-rect.left,e.clientY-rect.top,originX,originY);
  const key=hexKey(q,r);
  const tt=document.getElementById('tooltip');
  if(hexes[key]){
    const h=hexes[key];
    const cost=getClaimCost(h);
    let txt=`<b>${h.terrain==='green'?'🌿 Las':'🪨 Kamieniołom'}</b><br>`;
    txt+=`Właściciel: ${ownerLabel(h.owner)}<br>`;
    if(h.building) txt+=`Budynek: <b>${bName(h.building)}</b><br>`;
    if(h.owner!=='player') txt+=`Przejęcie: <b>${cost}💰</b>`;
    if(!h.owner&&!isAdjPlayer(h)) txt+=`<br><span style="color:#4a4a1a">Niedostępne</span>`;
    tt.innerHTML=txt;tt.style.display='block';
    tt.style.left=(e.clientX+14)+'px';tt.style.top=(e.clientY-8)+'px';
  } else {tt.style.display='none';}
});
canvas.addEventListener('mouseleave',()=>document.getElementById('tooltip').style.display='none');
window.addEventListener('resize',()=>{fitCanvas(); ctx.imageSmoothingEnabled=false;});

function handleDoubleClick(key){
  const h=hexes[key];
  if(h.owner==='player'&&(h.building==='sawmill'||h.building==='quarry')&&h.buildProg===null)
    openMusicModal(key);
}

/* ═══════════════════════════════════════
   SIDEBAR
═══════════════════════════════════════ */
function showHexInfo(key){
  const h=hexes[key];
  const ibox=document.getElementById('hex-info-box');
  const abox=document.getElementById('action-box');
  if(!h){ibox.innerHTML='';abox.innerHTML='';return;}

  let info=`<b>Teren:</b> ${h.terrain==='green'?'🌿 Las':'🪨 Kamień'}<br>`;
  info+=`<b>Właściciel:</b> ${ownerLabel(h.owner)}<br>`;
  if(h.building) info+=`<b>Budynek:</b> ${bName(h.building)}<br>`;
  if(h.building==='market'&&h.owner==='player'){
    const groups=getMarketGroups();
    const myGroup=groups.find(g=>g.includes(key))||[key];
    const perMkt=CFG.marketBase+(myGroup.length-1)*CFG.marketGroupBonus;
    info+=`<span style="color:#90b850;font-size:10px;">💰 co 10s: +${perMkt.toFixed(2)} (grupa: ${myGroup.length})</span><br>`;
  }
  if(h.building==='townhall'&&h.owner==='player'){
    info+=`<span style="color:#90b850;font-size:10px;">co 15s: +${CFG.townhallGold}💰 +${CFG.townhallWood}🪵 +${CFG.townhallStone}🪨</span><br>`;
  }
  ibox.innerHTML=info;
  abox.innerHTML='';

  if(!h.owner&&isAdjPlayer(h)&&h.claimProg===null)
    addBtn(abox,`🚩 Przejmij (${CFG.claimCostEmpty}💰)`,'',gold<CFG.claimCostEmpty,()=>startClaim(key));

  if(!h.owner&&!isAdjPlayer(h)){
    const d=document.createElement('div');d.className='hex-info';
    d.style.cssText='color:#2a3a0a;font-size:10px;margin-top:4px;';
    d.textContent='Nie sąsiaduje z Twoim terytorium.';abox.appendChild(d);
  }

  if(h.owner==='enemy'&&isAdjPlayer(h)&&h.claimProg===null){
    const c=getClaimCost(h);
    addBtn(abox,`⚔ Przejmij (${c}💰)`,'danger',gold<c,()=>startClaim(key));
  }

  if(h.owner==='player'&&!h.building&&h.buildProg===null){
    if(h.terrain==='green')
      addBtn(abox,`🏗 Tartak (${CFG.buildSawmillWood}🪵)`,'',wood<CFG.buildSawmillWood,()=>startBuild(key,'sawmill'));
    else
      addBtn(abox,`🏗 Kamieniołom (${CFG.buildQuarryStone}🪨+${CFG.buildQuarryWood}🪵)`,'',
        stone<CFG.buildQuarryStone||wood<CFG.buildQuarryWood,()=>startBuild(key,'quarry'));
  }

  if(h.owner==='player'&&(h.building==='sawmill'||h.building==='quarry')&&h.buildProg===null){
    const bonus=getAdjBonus(key);
    addBtn(abox,`🎵 Wydobądź ${h.building==='sawmill'?'drewno':'kamień'} (×${bonus.toFixed(2)})`,'',false,()=>openMusicModal(key));
    const hint=document.createElement('div');hint.className='hex-info';
    hint.style.cssText='color:#2a4a0a;font-size:9px;margin-top:2px;';
    hint.textContent='(lub kliknij 2× na mapie)';abox.appendChild(hint);
  }

  if(h.claimProg!==null) addProgress(abox,'pclaim-'+key,h.claimProg,'Przejmowanie…');
  if(h.buildProg!==null)  addProgress(abox,'pbuild-'+key,h.buildProg,'Budowanie…');
}

function addBtn(parent,text,cls,disabled,fn){
  const b=document.createElement('button');
  b.className='action-btn'+(cls?' '+cls:'');
  b.textContent=text;b.disabled=disabled;b.onclick=fn;parent.appendChild(b);
}
function addProgress(parent,id,prog,label){
  const pw=document.createElement('div');pw.className='progress-wrap';
  const pb=document.createElement('div');pb.className='progress-bar';
  pb.id=id;pb.style.width=(prog*100)+'%';pw.appendChild(pb);parent.appendChild(pw);
  const lbl=document.createElement('div');lbl.className='prog-label';lbl.textContent=label;parent.appendChild(lbl);
}
function ownerLabel(o){
  if(o==='player') return '<span style="color:#50e060">Twoje</span>';
  if(o==='enemy')  return '<span style="color:#e04040">Wróg</span>';
  return 'Wolne';
}
function bName(b){return{sawmill:'Tartak',quarry:'Kamieniołom',townhall:'Ratusz'}[b]||b;}
function isAdjPlayer(h){
  return getNeighbors(h.q,h.r).some(nb=>{const k=hexKey(nb.q,nb.r);return hexes[k]&&hexes[k].owner==='player';});
}
function getClaimCost(h){
  if(!h.owner) return CFG.claimCostEmpty;
  if(h.owner==='enemy'){
    if(h.building==='townhall') return CFG.claimCostMarket;
    if(h.building) return CFG.claimCostBuilding;
    return CFG.claimCostEnemy;
  }
  return CFG.claimCostEmpty;
}
function getAdjBonus(key){
  const h=hexes[key];if(!h.building||h.building==='townhall') return 1;
  let b=1;
  for(const nb of getNeighbors(h.q,h.r)){
    const k=hexKey(nb.q,nb.r);
    if(hexes[k]&&hexes[k].owner==='player'&&hexes[k].building===h.building) b+=CFG.adjBonus;
  }
  return b;
}

/* ═══════════════════════════════════════
   CLAIM & BUILD
═══════════════════════════════════════ */
function startClaim(key){
  const h=hexes[key];if(h.claimProg!==null) return;
  const cost=getClaimCost(h);if(gold<cost){alert('Za mało złota!');return;}
  gold-=cost;h.claimStart=Date.now();h.claimProg=0;
  updateHUD();showHexInfo(key);
}
function completeClaim(key){
  const h=hexes[key];if(h.claimProg===null) return;
  const wasEnemyTown=h.owner==='enemy'&&h.building==='townhall';
  const wasEnemy=h.owner==='enemy';
  h.owner='player';h.claimProg=null;h.claimStart=null;
  if(wasEnemy&&!wasEnemyTown) h.building=null;
  showHexInfo(key);updateHUD();
  if(wasEnemyTown) document.getElementById('win-screen').classList.add('show');
}
function startBuild(key,type){
  const h=hexes[key];
  if(type==='sawmill'){if(wood<CFG.buildSawmillWood){alert('Za mało drewna!');return;}wood-=CFG.buildSawmillWood;}
  else{if(stone<CFG.buildQuarryStone||wood<CFG.buildQuarryWood){alert('Za mało surowców!');return;}stone-=CFG.buildQuarryStone;wood-=CFG.buildQuarryWood;}
  // Losuj PNG budynku już teraz
  h.buildingSrc=type==='sawmill'?randFrom(SRC.tartak):randFrom(SRC.kamieniolom);
  h.buildType=type;h.buildStart=Date.now();h.buildProg=0;
  updateHUD();showHexInfo(key);
}
function completeBuild(key){
  const h=hexes[key];if(h.buildProg===null) return;
  h.building=h.buildType;h.buildProg=null;h.buildStart=null;h.buildType=null;
  showHexInfo(key);
}

/* ═══════════════════════════════════════
   MUSIC MODAL
═══════════════════════════════════════ */
const NOTE_NAMES=['c','d','e','f','g','a','h'];
const STAFF_TOP_Y=22, STAFF_STEP=11;
function noteScreenY(idx){return 77-idx*(STAFF_STEP/2);}
let mCtx={key:null,target:null,idx:0};

function openMusicModal(key){
  mCtx.key=key;
  mCtx.target=NOTE_NAMES[Math.floor(Math.random()*NOTE_NAMES.length)];
  mCtx.idx=2;
  document.getElementById('music-target-note').textContent=mCtx.target+'¹';
  document.getElementById('music-result').textContent='';
  document.getElementById('music-result').className='music-result';
  renderStaff();
  document.getElementById('music-modal').classList.add('show');
}
function closeMusicModal(){document.getElementById('music-modal').classList.remove('show');}
function moveNote(dir){
  mCtx.idx=Math.max(0,Math.min(NOTE_NAMES.length-1,mCtx.idx+dir));
  renderStaff();
  document.getElementById('music-result').textContent='';
  document.getElementById('music-result').className='music-result';
}
function confirmNote(){
  const chosen=NOTE_NAMES[mCtx.idx];
  const resEl=document.getElementById('music-result');
  if(chosen===mCtx.target){
    resEl.textContent='✓ Brawo! Poprawna nuta!';resEl.className='music-result ok';
    const bonus=getAdjBonus(mCtx.key);
    const amount=Math.max(1,Math.round(bonus));
    const h=hexes[mCtx.key];
    if(h.building==='sawmill') wood+=amount; else stone+=amount;
    updateHUD();if(selected===mCtx.key) showHexInfo(mCtx.key);
    setTimeout(closeMusicModal,1100);
  } else {
    resEl.textContent=`✗ Zagrałeś ${chosen}¹, cel: ${mCtx.target}¹. Spróbuj ponownie.`;
    resEl.className='music-result fail';
  }
}
function renderStaff(){
  const svg=document.getElementById('staff-svg');
  const W=296,H=120,staffLeft=46,staffRight=W-12;
  let s='';
  s+=`<rect width="${W}" height="${H}" rx="9" fill="#020c02" stroke="#3a5a1a" stroke-width="1.5"/>`;
  for(let i=0;i<5;i++){
    const ly=STAFF_TOP_Y+i*STAFF_STEP;
    s+=`<line x1="${staffLeft}" y1="${ly}" x2="${staffRight}" y2="${ly}" stroke="#c8b87a" stroke-width="0.85" opacity="0.65"/>`;
  }
  s+=`<text x="4" y="${STAFF_TOP_Y+STAFF_STEP*4+4}" font-size="50" font-family="Georgia,'Times New Roman',serif" fill="#d4af37" opacity="0.88">𝄞</text>`;
  const nx=staffLeft+120, ny=noteScreenY(mCtx.idx);
  if(mCtx.idx===0) s+=`<line x1="${nx-11}" y1="${ny}" x2="${nx+11}" y2="${ny}" stroke="#c8b87a" stroke-width="1.2"/>`;
  s+=`<ellipse cx="${nx}" cy="${ny}" rx="7.5" ry="5" fill="#f0d060" transform="rotate(-14,${nx},${ny})"/>`;
  const stemUp=mCtx.idx<4,stemX=stemUp?nx+7:nx-7;
  s+=`<line x1="${stemX}" y1="${ny}" x2="${stemX}" y2="${ny+(stemUp?-30:30)}" stroke="#f0d060" stroke-width="1.6"/>`;
  s+=`<text x="${nx}" y="${H-5}" font-size="12" fill="#f0d060" text-anchor="middle" font-family="Cinzel,serif" font-weight="700">${NOTE_NAMES[mCtx.idx]}¹</text>`;
  s+=`<text x="${W-8}" y="${H-5}" font-size="10" fill="#5a6a2a" text-anchor="end" font-family="Cinzel,serif">cel: ${mCtx.target}¹</text>`;
  svg.innerHTML=s;
}

/* ═══════════════════════════════════════
   HUD & SELL
═══════════════════════════════════════ */
function updateHUD(){
  document.getElementById('hud-gold').textContent=gold;
  document.getElementById('hud-wood').textContent=wood;
  document.getElementById('hud-stone').textContent=stone;
}
let sellOpen=false;
function toggleSellPanel(){
  sellOpen=!sellOpen;
  document.getElementById('sell-panel').classList.toggle('show',sellOpen);
}
function sellRes(type){
  if(type==='wood'){if(wood<CFG.sellWoodRate){alert('Potrzebujesz '+CFG.sellWoodRate+' drewna.');return;}wood-=CFG.sellWoodRate;gold+=CFG.sellWoodGold;}
  else{if(stone<CFG.sellStoneRate){alert('Potrzebujesz '+CFG.sellStoneRate+' kamienia.');return;}stone-=CFG.sellStoneRate;gold+=CFG.sellStoneGold;}
  updateHUD();
}

/* ═══════════════════════════════════════
   START
═══════════════════════════════════════ */
initGame();
</script>
