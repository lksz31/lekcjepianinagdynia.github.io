<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Posprzątaj Łąkę Nutkami | Nauka Nut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700&family=Poppins:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--gold:#d4af37;--navy:#1e3a8a;--border:#f0f0f0;--text:#334155;--text-mid:#64748b;--bg:#faf9f7;--card-bg:#ffffff;--green:#16a34a;--red:#dc2626;}
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;padding:0;background:var(--bg);font-family:'Poppins',sans-serif;color:var(--text);overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column;}

  .top-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 5%;background:var(--card-bg);border-bottom:1px solid var(--border);}
  .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--navy);text-decoration:none;font-weight:700;font-size:0.85rem;}
  .back-link:hover{color:var(--gold);}
  .game-title-bar{font-family:'Playfair Display',serif;font-weight:700;color:var(--navy);font-size:1.05rem;}
  .score-box{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--navy);font-size:0.9rem;background:#fdf8ec;border:1.5px solid var(--gold);border-radius:50px;padding:6px 16px;}

  .game-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px 50px;gap:20px;}

  .instructions{text-align:center;max-width:460px;color:var(--text-mid);font-size:0.86rem;line-height:1.6;}
  .instructions strong{color:var(--navy);}

  .meadow-stage{position:relative;width:min(94vw,640px);aspect-ratio:1408/768;border-radius:20px;overflow:hidden;background:url('/index/gry/zagrajkowo/dopasuj-nutki-do-literki/grafiki/polana-mapa') center/cover no-repeat;box-shadow:0 10px 34px rgba(0,0,0,0.18);}
  .litter-scatter{position:absolute;inset:0;}
  .litter-icon{position:absolute;transform:translate(-50%,-50%) rotate(var(--rot,0deg));filter:drop-shadow(0 2px 3px rgba(0,0,0,0.35));pointer-events:none;}
  .staff-widget{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,0.95);border-radius:14px;padding:6px 8px;box-shadow:0 6px 18px rgba(0,0,0,0.28);}
  .staff-widget svg{display:block;width:150px;height:auto;}

  .flying-item{position:fixed;display:none;cursor:grab;touch-action:none;user-select:none;z-index:500;filter:drop-shadow(0 4px 6px rgba(0,0,0,0.32));transition:left 0.6s cubic-bezier(0.3,0.7,0.3,1),top 0.6s cubic-bezier(0.3,0.7,0.3,1);}
  .flying-item.dragging{transition:none;cursor:grabbing;}

  .letters-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:560px;}
  .letter-target{width:66px;height:80px;position:relative;background:url('/index/gry/zagrajkowo/dopasuj-nutki-do-literki/grafiki/kosz-na-smieci-crop.webp') center/contain no-repeat;display:flex;align-items:flex-start;justify-content:center;padding-top:15px;cursor:default;transition:0.2s;filter:drop-shadow(0 4px 5px rgba(0,0,0,0.25));}
  .letter-target::before{content:'';position:absolute;inset:6% 18%;border-radius:10px;background:rgba(220,38,38,0);transition:background 0.2s;pointer-events:none;}
  .letter-target .lt-label{position:relative;font-family:'Nunito',sans-serif;font-weight:900;font-size:1.05rem;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,0.65);}
  .letter-target.dragover{transform:scale(1.1) translateY(-3px);filter:drop-shadow(0 6px 10px rgba(212,175,55,0.45));}
  .letter-target.wrong-flash::before{background:rgba(220,38,38,0.4);}
  .letter-target.bin-happy{animation:binShake 0.55s ease;}
  @keyframes binShake{0%,100%{transform:rotate(0);}20%{transform:rotate(-7deg);}40%{transform:rotate(6deg);}60%{transform:rotate(-4deg);}80%{transform:rotate(3deg);}}

  .sparkle{position:fixed;pointer-events:none;font-size:1.1rem;z-index:600;animation:sparkleFly 0.7s ease-out forwards;}
  @keyframes sparkleFly{0%{opacity:1;transform:translate(0,0) scale(0.6);}100%{opacity:0;transform:translate(var(--sx),var(--sy)) scale(1.3);}}

  .feedback-msg{min-height:28px;font-weight:800;font-size:1rem;text-align:center;}
  .feedback-msg.ok{color:var(--green);}
  .feedback-msg.bad{color:var(--red);}

  .win-overlay{position:fixed;inset:0;background:rgba(30,58,138,0.92);display:none;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:16px;text-align:center;padding:20px;}
  .win-overlay.show{display:flex;}
  .win-overlay h2{color:var(--gold);font-family:'Playfair Display',serif;font-size:2rem;margin:0;}
  .win-overlay p{color:white;font-size:1.05rem;margin:0;}
  .win-overlay img{width:min(70vw,280px);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,0.3);}
  .win-btn{background:var(--gold);color:#1a1a2e;border:none;padding:14px 32px;border-radius:50px;font-weight:800;font-size:0.95rem;cursor:pointer;}

  @media(max-width:420px){
    .letter-target{width:52px;height:64px;}
    .staff-widget svg{width:120px;}
  }
</style>
</head>
<body>

<div class="top-bar">
  <a href="/index/gry/zagrajkowo/zagrajkowo.html" class="back-link">‹ Wróć do gier</a>
  <span class="game-title-bar">🌼 Posprzątaj łąkę</span>
  <span class="score-box">⭐ <span id="scoreVal">0</span> / <span id="totalVal">30</span></span>
</div>

<div class="game-area">
  <p class="instructions">Kolejny śmieć unosi się na pięciolinię i pokazuje dźwięk. <strong>Przeciągnij go</strong> (albo dotknij i przenieś na telefonie) do kosza z odpowiednią literą.</p>

  <div class="meadow-stage" id="meadowStage">
    <div class="litter-scatter" id="litterScatter"></div>
    <div class="staff-widget">
      <svg id="miniStaffSvg" viewBox="0 0 125 96" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>

  <img class="flying-item" id="flyingItem" alt="">

  <div class="letters-row" id="lettersRow"></div>

  <div class="feedback-msg" id="feedbackMsg"></div>
</div>

<div class="win-overlay" id="winOverlay">
  <div style="font-size:3.5rem;">🏆</div>
  <h2>Łąka jest czysta!</h2>
  <p id="winText"></p>
  <img src="/index/gry/zagrajkowo/dopasuj-nutki-do-literki/grafiki/slodkie-zwierzeta.webp" alt="Słodkie zwierzątka">
  <button class="win-btn" onclick="restartGame()">Zagraj jeszcze raz</button>
</div>

<script>
const CLEF_TREBLE_URL = '/index/fiszki/concept-art/wiolinowy-fiszki-bez-tla.png';
const CLEF_TREBLE_RATIO = 581 / 1361;
const CLEF_TREBLE_G_PCT = 0.64;

const GAME_NOTES = [
  {id:'c1', letter:'C', staffY:10},
  {id:'d1', letter:'D', staffY:9},
  {id:'e1', letter:'E', staffY:8},
  {id:'f1', letter:'F', staffY:7},
  {id:'g1', letter:'G', staffY:6},
  {id:'a1', letter:'A', staffY:5},
  {id:'h1', letter:'H', staffY:4},
];
const LETTERS_ORDER = ['C','D','E','F','G','A','H'];

const LITTER_DIR = '/index/gry/zagrajkowo/dopasuj-nutki-do-literki/grafiki/';
const LITTER_IMAGES = [
  'banan-smiec.webp','butelka-smiec.webp','klawa-smiec.webp','kubek-smiec.webp',
  'maseka-smiec.webp','ogryzek-smiec.webp','papier-smiec.webp','puszka-smiec.webp',
  'slomka_smiec.webp','szklo-smiec.webp','ubranie-smiec.webp'
];

const TOTAL_LITTER = 30;
const STAFF_VB_W = 125, STAFF_VB_H = 96, SG = 13, STAFF_TOP = 24, NOTE_X = 100;

let score = 0, currentNote = null, recentIds = [];
let litterLayout = [], landed = false, flying = false;

function pickNote(){
  let pool = GAME_NOTES.filter(n => !recentIds.includes(n.id));
  if(pool.length === 0) pool = GAME_NOTES;
  const n = pool[Math.floor(Math.random()*pool.length)];
  recentIds.push(n.id);
  if(recentIds.length > 2) recentIds.shift();
  return n;
}

function isNearCenter(lp, tp){
  return Math.abs(lp-50) < 21 && Math.abs(tp-50) < 27;
}

function buildLitterLayout(){
  const layout = [];
  for(let i=0;i<TOTAL_LITTER;i++){
    layout.push({img: LITTER_IMAGES[i % LITTER_IMAGES.length], key:i});
  }
  for(let i=layout.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [layout[i],layout[j]] = [layout[j],layout[i]];
  }
  layout.forEach(item => {
    let lp, tp;
    do{
      lp = 5 + Math.random()*90;
      tp = 8 + Math.random()*80;
    }while(isNearCenter(lp, tp));
    item.leftPct = lp;
    item.topPct = tp;
    item.rot = (Math.random()*30-15).toFixed(1);
    item.size = 30 + Math.round(Math.random()*16);
  });
  return layout;
}

function renderLitterScatter(){
  const wrap = document.getElementById('litterScatter');
  wrap.innerHTML = litterLayout.map(it =>
    '<img class="litter-icon" src="'+LITTER_DIR+it.img+'" style="left:'+it.leftPct+'%;top:'+it.topPct+'%;width:'+it.size+'px;height:'+it.size+'px;--rot:'+it.rot+'deg;">'
  ).join('');
}

function renderMiniStaff(note){
  const c = '#1e3a8a';
  const noteY = STAFF_TOP + (note.staffY * SG / 2);
  const topLine = STAFF_TOP, botLine = STAFF_TOP + 4*SG, ledW = 9;

  let s = '';
  for(let i=0;i<5;i++){
    const ly = STAFF_TOP + i*SG;
    s += '<line x1="10" y1="'+ly+'" x2="'+(STAFF_VB_W-6)+'" y2="'+ly+'" stroke="'+c+'" stroke-width="1.4" opacity="0.55"/>';
  }
  const ch = SG * 6.0, cw = ch * CLEF_TREBLE_RATIO;
  const cy = (STAFF_TOP + 3*SG) - CLEF_TREBLE_G_PCT * ch;
  s += '<image href="'+CLEF_TREBLE_URL+'" x="9" y="'+cy.toFixed(1)+'" width="'+cw.toFixed(1)+'" height="'+ch.toFixed(1)+'" preserveAspectRatio="none"/>';

  if(noteY > botLine + SG*0.5){
    let ly = botLine + SG;
    while(ly <= noteY + SG*0.3){
      s += '<line x1="'+(NOTE_X-ledW)+'" y1="'+ly+'" x2="'+(NOTE_X+ledW)+'" y2="'+ly+'" stroke="'+c+'" stroke-width="1.6"/>';
      ly += SG;
    }
  }
  if(noteY < topLine - SG*0.5){
    let ly = topLine - SG;
    while(ly >= noteY - SG*0.3){
      s += '<line x1="'+(NOTE_X-ledW)+'" y1="'+ly+'" x2="'+(NOTE_X+ledW)+'" y2="'+ly+'" stroke="'+c+'" stroke-width="1.6"/>';
      ly -= SG;
    }
  }

  document.getElementById('miniStaffSvg').innerHTML = s;
}

function getNoteScreenPos(){
  const svg = document.getElementById('miniStaffSvg');
  const rect = svg.getBoundingClientRect();
  const scale = rect.width / STAFF_VB_W;
  const noteY = STAFF_TOP + (currentNote.staffY * SG / 2);
  return {x: rect.left + NOTE_X*scale, y: rect.top + noteY*scale};
}

function renderLetters(){
  const row = document.getElementById('lettersRow');
  row.innerHTML = LETTERS_ORDER.map(l =>
    '<div class="letter-target" data-letter="'+l+'"><span class="lt-label">'+l+'</span></div>'
  ).join('');
}

/* ══ Dźwięk błędu ══ */
function playErrorBeep(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const now = ctx.currentTime;
    function tone(freq, start, dur){
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, now+start);
      gain.gain.exponentialRampToValueAtTime(0.16, now+start+0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now+start+dur);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now+start); osc.stop(now+start+dur+0.03);
    }
    tone(220, 0, 0.14);
    tone(185, 0.16, 0.20);
  }catch(e){}
}

function spawnSparkles(x, y){
  const icons = ['✨','⭐','✨','💫'];
  for(let i=0;i<6;i++){
    const el = document.createElement('div');
    el.className = 'sparkle';
    el.textContent = icons[i % icons.length];
    el.style.left = x+'px';
    el.style.top = y+'px';
    const ang = Math.random()*Math.PI*2, dist = 40+Math.random()*30;
    el.style.setProperty('--sx', (Math.cos(ang)*dist).toFixed(0)+'px');
    el.style.setProperty('--sy', (Math.sin(ang)*dist).toFixed(0)+'px');
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 750);
  }
}

/* ══ Latający śmieć — przeciąganie ══ */
let dragOffsetX = 0, dragOffsetY = 0;

function flyItemTo(x, y, sizePx){
  const el = document.getElementById('flyingItem');
  el.style.left = (x - (sizePx||el.offsetWidth)/2)+'px';
  el.style.top = (y - (sizePx||el.offsetHeight)/2)+'px';
}

function startRound(){
  currentNote = pickNote();
  renderMiniStaff(currentNote);

  if(litterLayout.length === 0){ showWin(); return; }
  const item = litterLayout.pop();
  renderLitterScatter();

  const stage = document.getElementById('meadowStage');
  const stageRect = stage.getBoundingClientRect();
  const startX = stageRect.left + stageRect.width * item.leftPct/100;
  const startY = stageRect.top + stageRect.height * item.topPct/100;

  const el = document.getElementById('flyingItem');
  el.src = LITTER_DIR + item.img;
  el.style.transition = 'none';
  el.style.width = item.size+'px';
  el.style.height = item.size+'px';
  el.style.display = 'block';
  flyItemTo(startX, startY, item.size);
  landed = false;

  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      el.style.transition = 'left 0.6s cubic-bezier(0.3,0.7,0.3,1), top 0.6s cubic-bezier(0.3,0.7,0.3,1), width 0.4s, height 0.4s';
      const target = getNoteScreenPos();
      el.style.width = '30px';
      el.style.height = '30px';
      flyItemTo(target.x, target.y, 30);
    });
  });

  setTimeout(()=>{ landed = true; }, 650);
}

function returnToStaff(){
  const el = document.getElementById('flyingItem');
  el.style.transition = 'left 0.45s ease, top 0.45s ease';
  const target = getNoteScreenPos();
  flyItemTo(target.x, target.y, el.offsetWidth);
}

function onFlyingPointerDown(e){
  if(!landed || flying) return;
  const el = document.getElementById('flyingItem');
  e.preventDefault();
  flying = true;
  const rect = el.getBoundingClientRect();
  dragOffsetX = e.clientX - rect.left;
  dragOffsetY = e.clientY - rect.top;
  el.classList.add('dragging');
  try{ el.setPointerCapture(e.pointerId); }catch(err){}
}

function onFlyingPointerMove(e){
  if(!flying) return;
  const el = document.getElementById('flyingItem');
  el.style.left = (e.clientX - dragOffsetX)+'px';
  el.style.top = (e.clientY - dragOffsetY)+'px';
  el.style.pointerEvents = 'none';
  const under = document.elementFromPoint(e.clientX, e.clientY);
  el.style.pointerEvents = '';
  document.querySelectorAll('.letter-target').forEach(t=>t.classList.remove('dragover'));
  const bin = under && under.closest ? under.closest('.letter-target') : null;
  if(bin) bin.classList.add('dragover');
}

function onFlyingPointerUp(e){
  if(!flying) return;
  flying = false;
  const el = document.getElementById('flyingItem');
  el.classList.remove('dragging');
  el.style.pointerEvents = 'none';
  const under = document.elementFromPoint(e.clientX, e.clientY);
  el.style.pointerEvents = '';
  document.querySelectorAll('.letter-target').forEach(t=>t.classList.remove('dragover'));
  const bin = under && under.closest ? under.closest('.letter-target') : null;

  if(!bin){
    returnToStaff();
    return;
  }
  checkAnswer(bin.dataset.letter, bin);
}

function checkAnswer(letter, binEl){
  const feedback = document.getElementById('feedbackMsg');
  if(letter === currentNote.letter){
    const r = binEl.getBoundingClientRect();
    spawnSparkles(r.left+r.width/2, r.top+r.height*0.3);
    binEl.classList.add('bin-happy');
    setTimeout(()=>binEl.classList.remove('bin-happy'), 550);

    const el = document.getElementById('flyingItem');
    el.style.transition = 'transform 0.35s ease, opacity 0.35s ease';
    el.style.transform = 'scale(0)';
    el.style.opacity = '0';

    feedback.textContent = '✓ Świetnie! To był dźwięk ' + currentNote.letter + '.';
    feedback.className = 'feedback-msg ok';
    score++;
    document.getElementById('scoreVal').textContent = score;

    setTimeout(()=>{
      el.style.display = 'none';
      el.style.transform = '';
      el.style.opacity = '1';
      landed = false;
      startRound();
    }, 450);
  }else{
    playErrorBeep();
    binEl.classList.add('wrong-flash');
    setTimeout(()=>binEl.classList.remove('wrong-flash'), 400);
    feedback.textContent = 'To nie ' + letter + ' — śmieć wraca na pięciolinię, spróbuj jeszcze raz.';
    feedback.className = 'feedback-msg bad';
    returnToStaff();
  }
}

function showWin(){
  document.getElementById('winText').textContent =
    'Wynik: ' + score + ' / ' + TOTAL_LITTER + ' — cała łąka jest czysta!';
  document.getElementById('winOverlay').classList.add('show');
}

function restartGame(){
  score = 0; recentIds = [];
  document.getElementById('scoreVal').textContent = '0';
  document.getElementById('feedbackMsg').textContent = '';
  document.getElementById('winOverlay').classList.remove('show');
  document.getElementById('flyingItem').style.display = 'none';
  litterLayout = buildLitterLayout();
  renderLitterScatter();
  landed = false; flying = false;
  setTimeout(startRound, 350);
}

document.getElementById('totalVal').textContent = TOTAL_LITTER;
renderLetters();
const flyingEl = document.getElementById('flyingItem');
flyingEl.addEventListener('pointerdown', onFlyingPointerDown);
flyingEl.addEventListener('pointermove', onFlyingPointerMove);
flyingEl.addEventListener('pointerup', onFlyingPointerUp);
flyingEl.addEventListener('pointercancel', onFlyingPointerUp);
restartGame();
</script>
</body>
</html>
