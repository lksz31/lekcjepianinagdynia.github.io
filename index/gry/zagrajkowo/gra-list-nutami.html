<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Napisz List Nutami | Zagrajkowo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700&family=Poppins:wght@400;500;600;700;800&family=Nunito:wght@800;900&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{--gold:#d4af37;--navy:#1e3a8a;--border:#f0f0f0;--text:#334155;--text-mid:#64748b;--bg:#faf9f7;--card-bg:#ffffff;--green:#16a34a;--red:#dc2626;}
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;padding:0;background:var(--bg);font-family:'Poppins',sans-serif;color:var(--text);overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column;}

  .top-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 5%;background:var(--card-bg);border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px;}
  .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--navy);text-decoration:none;font-weight:700;font-size:0.85rem;}
  .back-link:hover{color:var(--gold);}
  .game-title-bar{font-family:'Playfair Display',serif;font-weight:700;color:var(--navy);font-size:1.05rem;}
  .score-box{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--navy);font-size:0.9rem;background:#fdf8ec;border:1.5px solid var(--gold);border-radius:50px;padding:6px 16px;}

  .game-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 16px 50px;gap:20px;}
  .instructions{text-align:center;max-width:480px;color:var(--text-mid);font-size:0.86rem;line-height:1.6;}
  .instructions strong{color:var(--navy);}

  .clef-toggle{display:flex;gap:10px;}
  .clef-btn{background:var(--card-bg);border:2px solid var(--border);border-radius:50px;padding:8px 20px;font-weight:700;font-size:0.85rem;color:var(--navy);cursor:pointer;transition:0.2s;}
  .clef-btn:hover{border-color:var(--gold);}
  .clef-btn.active{border-color:var(--navy);background:var(--navy);color:#fff;}

  .letter-card{background:#f0e4c8 url('/index/gry/zagrajkowo/gra-list-nutami/grafiki/notatnik.webp') top center/100% auto no-repeat;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,0.22);padding:15% 11% 8% 19%;max-width:760px;width:100%;font-family:'VT323',monospace;font-size:1.35rem;line-height:1.9;color:#1e4a7a;}

  .gap{display:inline-flex;align-items:center;justify-content:center;width:40px;height:52px;vertical-align:middle;margin:0 3px;border-radius:8px;border:2px dashed #cbd5e1;background:#fafafa;transition:0.2s;}
  .gap.dragover{border-color:var(--gold);background:#fffbf0;transform:scale(1.08);}
  .gap.correct{border-style:solid;border-color:var(--green);background:#f0fdf4;}
  .gap.wrong{border-style:solid;border-color:var(--red);background:#fef2f2;}

  .tiles-tray{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:580px;width:100%;padding:16px;background:var(--card-bg);border-radius:18px;border:1px solid var(--border);min-height:76px;box-shadow:0 8px 30px rgba(0,0,0,0.06);}

  .tile{width:40px;height:52px;cursor:grab;touch-action:none;user-select:none;flex-shrink:0;}
  .tile:active{cursor:grabbing;}
  .tile.dragging{z-index:1000;cursor:grabbing;filter:drop-shadow(0 6px 10px rgba(0,0,0,0.25));}
  .tile.locked{cursor:default;opacity:0.55;}
  .tile svg{width:100%;height:100%;display:block;pointer-events:none;}

  .check-btn{background:var(--gold);color:#fff;border:none;padding:13px 32px;border-radius:50px;font-weight:800;font-size:0.9rem;cursor:pointer;transition:0.2s;}
  .check-btn:hover{transform:translateY(-2px);}

  .feedback-msg{min-height:26px;font-weight:800;font-size:0.95rem;text-align:center;}
  .feedback-msg.ok{color:var(--green);}
  .feedback-msg.bad{color:var(--red);}

  .win-overlay{position:fixed;inset:0;background:rgba(30,58,138,0.92);display:none;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:18px;text-align:center;padding:20px;}
  .win-overlay.show{display:flex;}
  .win-overlay h2{color:var(--gold);font-family:'Playfair Display',serif;font-size:2rem;margin:0;}
  .win-overlay p{color:white;font-size:1.05rem;margin:0;max-width:420px;}
  .win-btn{background:var(--gold);color:#1a1a2e;border:none;padding:14px 32px;border-radius:50px;font-weight:800;font-size:0.95rem;cursor:pointer;}
</style>
</head>
<body>

<div class="top-bar">
  <a href="/index/gry/zagrajkowo/zagrajkowo.html" class="back-link">‹ Wróć do gier</a>
  <span class="game-title-bar">✉️ Napisz list nutami</span>
  <span class="score-box">⭐ <span id="scoreVal">0</span> / <span id="totalVal">7</span></span>
</div>

<div class="game-area">
  <p class="instructions">Przeciągnij <strong>pięciolinie z nutkami</strong> z dołu do pasujących luk w liście. Możesz się pomylić — dopiero po kliknięciu <strong>Sprawdź</strong> okaże się, czy dobrze umieściłeś/aś wszystkie nuty.</p>

  <div class="clef-toggle" id="clefToggle">
    <button type="button" class="clef-btn" data-clef="treble" onclick="setClef('treble')">🎼 Klucz wiolinowy</button>
    <button type="button" class="clef-btn" data-clef="bass" onclick="setClef('bass')">𝄢 Klucz basowy</button>
  </div>

  <div class="letter-card" id="letterCard"></div>

  <div class="tiles-tray" id="tilesTray"></div>

  <button class="check-btn" onclick="checkAll()">Sprawdź</button>

  <div class="feedback-msg" id="feedbackMsg"></div>
</div>

<div class="win-overlay" id="winOverlay">
  <div style="font-size:3.5rem;">💌</div>
  <h2>List gotowy!</h2>
  <p id="winText"></p>
  <button class="win-btn" onclick="restartGame()">Zagraj jeszcze raz</button>
</div>

<script>
const CLEFS = {
  treble: {
    url:'/index/fiszki/concept-art/wiolinowy-fiszki-bez-tla.png',
    ratio: 581/1361, pct:0.64, refIdx:3,
    staffY:{C:10,D:9,E:8,F:7,G:6,A:5,H:4}
  },
  bass: {
    url:'/index/fiszki/concept-art/klucz-bez-tla.png',
    ratio: 148/231, pct:0.366, refIdx:1,
    staffY:{C:12,D:11,E:10,F:9,G:8,A:7,H:6}
  }
};
let currentClef = 'treble';

const LETTERS_ORDER = ['C','D','E','F','G','A','H'];

const LETTER_TEMPLATE = [
  {t:'Drogi Muzyku! '},
  {b:'C'}, {t:'ieszę się, że grasz na pianinie. '},
  {b:'D'}, {t:'źwięki mają swoje nazwy: '},
  {b:'E'}, {t:', '},
  {b:'F'}, {t:', '},
  {b:'G'}, {t:', '},
  {b:'A'}, {t:' i '},
  {b:'H'}, {t:'. Do zobaczenia na lekcji!'},
];

function miniStaffSVG(letter){
  const cfg = CLEFS[currentClef];
  const W=40, H=52, sg=7.6, staffTop=9;
  const c='#1e3a8a';
  let s = '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
  for(let i=0;i<5;i++){
    const ly = staffTop + i*sg;
    s += '<line x1="2" y1="'+ly+'" x2="'+(W-2)+'" y2="'+ly+'" stroke="'+c+'" stroke-width="1" opacity="0.5"/>';
  }
  const ch = sg*4.6, cw = ch*cfg.ratio;
  const cy = (staffTop + cfg.refIdx*sg) - cfg.pct*ch;
  s += '<image href="'+cfg.url+'" x="0" y="'+cy.toFixed(1)+'" width="'+cw.toFixed(1)+'" height="'+ch.toFixed(1)+'" preserveAspectRatio="none"/>';

  const noteX = W*0.74;
  const staffY = cfg.staffY[letter];
  const noteY = staffTop + (staffY*sg/2);
  const topLine = staffTop, botLine = staffTop+4*sg, ledW = 5.5;

  if(noteY > botLine + sg*0.5){
    let ly = botLine+sg;
    while(ly <= noteY+sg*0.3){
      s += '<line x1="'+(noteX-ledW)+'" y1="'+ly+'" x2="'+(noteX+ledW)+'" y2="'+ly+'" stroke="'+c+'" stroke-width="1"/>';
      ly += sg;
    }
  }
  if(noteY < topLine - sg*0.5){
    let ly = topLine-sg;
    while(ly >= noteY-sg*0.3){
      s += '<line x1="'+(noteX-ledW)+'" y1="'+ly+'" x2="'+(noteX+ledW)+'" y2="'+ly+'" stroke="'+c+'" stroke-width="1"/>';
      ly -= sg;
    }
  }

  s += '<ellipse cx="'+noteX+'" cy="'+noteY+'" rx="4.6" ry="3.5" fill="#d4af37" stroke="#8a6d1a" stroke-width="0.8" transform="rotate(-15,'+noteX+','+noteY+')"/>';
  const stemUp = noteY > staffTop+sg*2;
  const sx = stemUp ? noteX+3.8 : noteX-3.8;
  const sy2 = stemUp ? noteY-17 : noteY+17;
  s += '<line x1="'+sx+'" y1="'+noteY+'" x2="'+sx+'" y2="'+sy2+'" stroke="#8a6d1a" stroke-width="1"/>';
  s += '</svg>';
  return s;
}

function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

let blanks = [];

function setClef(clef){
  currentClef = clef;
  document.querySelectorAll('.clef-btn').forEach(function(b){
    b.classList.toggle('active', b.dataset.clef === clef);
  });
  restartGame();
}

function renderLetter(){
  const card = document.getElementById('letterCard');
  let html = '';
  let bi = 0;
  blanks = [];
  LETTER_TEMPLATE.forEach(function(part){
    if(part.t){ html += part.t; }
    else if(part.b){
      const id = bi++;
      blanks.push({id:id, letter:part.b});
      html += '<span class="gap" id="gap-'+id+'" data-id="'+id+'" data-letter="'+part.b+'"></span>';
    }
  });
  card.innerHTML = html;
}

function renderTray(){
  const tray = document.getElementById('tilesTray');
  tray.innerHTML = '';
  const order = shuffled(blanks.map(function(b){return b.letter;}));
  order.forEach(function(letter){
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.dataset.letter = letter;
    tile.dataset.gap = '';
    tile.innerHTML = miniStaffSVG(letter);
    attachDrag(tile);
    tray.appendChild(tile);
  });
}

let dragTile = null, dragOffsetX = 0, dragOffsetY = 0;

function attachDrag(tile){
  tile.addEventListener('pointerdown', function(e){
    if(tile.classList.contains('locked')) return;
    e.preventDefault();
    dragTile = tile;
    const rect = tile.getBoundingClientRect();
    dragOffsetX = e.clientX - rect.left;
    dragOffsetY = e.clientY - rect.top;
    tile.style.position = 'fixed';
    tile.style.left = rect.left+'px';
    tile.style.top = rect.top+'px';
    tile.style.width = rect.width+'px';
    tile.style.height = rect.height+'px';
    tile.classList.add('dragging');
    try{ tile.setPointerCapture(e.pointerId); }catch(err){}
    document.getElementById('feedbackMsg').textContent = '';
    document.getElementById('feedbackMsg').className = 'feedback-msg';
  });

  tile.addEventListener('pointermove', function(e){
    if(dragTile !== tile) return;
    tile.style.left = (e.clientX - dragOffsetX)+'px';
    tile.style.top = (e.clientY - dragOffsetY)+'px';
    tile.style.pointerEvents = 'none';
    const under = document.elementFromPoint(e.clientX, e.clientY);
    tile.style.pointerEvents = '';
    document.querySelectorAll('.gap.dragover').forEach(function(g){g.classList.remove('dragover');});
    const gap = under && under.closest ? under.closest('.gap') : null;
    if(gap) gap.classList.add('dragover');
  });

  tile.addEventListener('pointerup', function(e){
    if(dragTile !== tile) return;
    dropTile(tile, e.clientX, e.clientY);
  });
  tile.addEventListener('pointercancel', function(e){
    if(dragTile !== tile) return;
    dropTile(tile, e.clientX, e.clientY);
  });
}

function clearTileFixedStyle(tile){
  tile.style.position = '';
  tile.style.left = '';
  tile.style.top = '';
  tile.style.width = '';
  tile.style.height = '';
  tile.classList.remove('dragging');
}

function dropTile(tile, clientX, clientY){
  document.querySelectorAll('.gap.dragover').forEach(function(g){g.classList.remove('dragover');});
  tile.style.pointerEvents = 'none';
  const under = document.elementFromPoint(clientX, clientY);
  tile.style.pointerEvents = '';
  const gap = under && under.closest ? under.closest('.gap') : null;
  const tray = document.getElementById('tilesTray');

  if(gap){
    const occupant = gap.querySelector('.tile');
    if(occupant && occupant !== tile){
      const originGapId = tile.dataset.gap;
      if(originGapId){
        const originGap = document.getElementById('gap-'+originGapId);
        occupant.dataset.gap = originGapId;
        originGap.appendChild(occupant);
      }else{
        occupant.dataset.gap = '';
        tray.appendChild(occupant);
      }
    }
    tile.dataset.gap = gap.dataset.id;
    gap.classList.remove('correct','wrong');
    gap.appendChild(tile);
  }else{
    tile.dataset.gap = '';
    tray.appendChild(tile);
  }

  clearTileFixedStyle(tile);
  dragTile = null;
}

function checkAll(){
  const feedback = document.getElementById('feedbackMsg');
  let filled = 0, correct = 0;
  blanks.forEach(function(b){
    const gap = document.getElementById('gap-'+b.id);
    const occupant = gap.querySelector('.tile');
    gap.classList.remove('correct','wrong');
    if(!occupant) return;
    filled++;
    if(occupant.dataset.letter === b.letter){
      correct++;
      gap.classList.add('correct');
      occupant.classList.add('locked');
    }else{
      gap.classList.add('wrong');
    }
  });

  document.getElementById('scoreVal').textContent = correct;

  if(filled < blanks.length){
    feedback.textContent = 'Uzupełnij najpierw wszystkie luki, a potem sprawdź jeszcze raz.';
    feedback.className = 'feedback-msg bad';
    return;
  }

  if(correct === blanks.length){
    feedback.textContent = '';
    setTimeout(showWin, 400);
  }else{
    feedback.textContent = 'Prawie! Popraw czerwone luki i sprawdź ponownie.';
    feedback.className = 'feedback-msg bad';
  }
}

function showWin(){
  document.getElementById('winText').textContent = 'Uzupełniłeś/aś cały list poprawnie! Teraz możesz go swobodnie przeczytać.';
  document.getElementById('winOverlay').classList.add('show');
}

function restartGame(){
  document.getElementById('scoreVal').textContent = '0';
  document.getElementById('feedbackMsg').textContent = '';
  document.getElementById('feedbackMsg').className = 'feedback-msg';
  document.getElementById('winOverlay').classList.remove('show');
  renderLetter();
  renderTray();
}

document.getElementById('totalVal').textContent = LETTER_TEMPLATE.filter(function(p){return p.b;}).length;
document.querySelector('.clef-btn[data-clef="'+currentClef+'"]').classList.add('active');
restartGame();
</script>
</body>
</html>
