<style>
  :root{--gold:#d4af37;--navy:#1e3a8a;--border:#f0f0f0;--text:#334155;--text-mid:#64748b;--bg:#faf9f7;--card-bg:#ffffff;--green:#16a34a;}
  *,*::before,*::after{box-sizing:border-box;}
  html{overscroll-behavior:none;}
  body{margin:0;padding:0;background:var(--bg);font-family:'Poppins',sans-serif;color:var(--text);overflow-x:hidden;overscroll-behavior:none;min-height:100vh;display:flex;flex-direction:column;}

  .top-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 5%;background:var(--card-bg);border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px;}
  .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--navy);text-decoration:none;font-weight:700;font-size:0.85rem;}
  .back-link:hover{color:var(--gold);}
  .game-title-bar{font-family:'Playfair Display',serif;font-weight:700;color:var(--navy);font-size:1.05rem;}
  .score-box{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--navy);font-size:0.9rem;background:#fdf8ec;border:1.5px solid var(--gold);border-radius:50px;padding:6px 16px;}

  .game-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 16px 50px;gap:22px;}
  .instructions{text-align:center;max-width:460px;color:var(--text-mid);font-size:0.86rem;line-height:1.6;}
  .instructions strong{color:var(--navy);}

  .mode-toggle{display:flex;gap:4px;background:#fdf8ec;border:1.5px solid var(--gold);border-radius:50px;padding:4px;}
  .mode-btn{border:none;background:transparent;color:var(--text-mid);font-weight:700;font-size:0.78rem;padding:8px 16px;border-radius:50px;cursor:pointer;font-family:'Poppins',sans-serif;white-space:nowrap;}
  .mode-btn.active{background:var(--navy);color:#fff;}

  .memory-board{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(6px,2vw,10px);max-width:700px;}

  .card-slot{perspective:800px;width:clamp(60px,12vw,84px);aspect-ratio:84/100;}
  .card-inner{position:relative;width:100%;height:100%;transition:transform 0.45s cubic-bezier(0.4,0.1,0.2,1);transform-style:preserve-3d;cursor:pointer;}
  .card-slot.revealed .card-inner,.card-slot.matched .card-inner{transform:rotateY(180deg);}
  .card-slot.matched .card-inner{cursor:default;}
  .card-face{position:absolute;inset:0;border-radius:14px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;box-shadow:0 4px 14px rgba(0,0,0,0.08);}
  .card-back{position:relative;overflow:hidden;background:radial-gradient(circle at 30% 18%,rgba(255,255,255,0.18),transparent 55%),linear-gradient(135deg,#2a4fb0 0%,var(--navy) 45%,#16306e 75%,#0d1f4a 100%);border:2px solid var(--gold);box-shadow:inset 0 0 0 3px rgba(212,175,55,0.22),0 4px 14px rgba(0,0,0,0.08);}
  .card-back::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(212,175,55,0.22) 1.6px,transparent 1.6px);background-size:14px 14px;}
  .card-back::after{content:'♪';position:relative;z-index:1;color:var(--gold);font-size:clamp(1.4rem,5vw,1.9rem);text-shadow:0 0 10px rgba(212,175,55,0.55);}
  .card-front{background:var(--card-bg);border:2px solid var(--border);transform:rotateY(180deg);overflow:hidden;}
  .card-slot.matched .card-front{border-color:var(--green);box-shadow:0 4px 14px rgba(22,163,74,0.25);}
  .card-slot.selected .card-front{box-shadow:0 0 0 3px var(--gold),0 4px 14px rgba(0,0,0,0.08);}
  .card-letter{font-family:'Nunito',sans-serif;font-weight:900;font-size:clamp(1.5rem,6vw,2.2rem);color:var(--navy);}
  .card-slot.matched .card-letter{color:var(--green);}
  .card-staff-svg{width:82%;height:82%;}

  .memory-actions{display:flex;gap:12px;}
  .shuffle-btn{background:var(--card-bg);border:2px solid var(--border);color:var(--navy);padding:10px 22px;border-radius:50px;font-weight:700;font-size:0.82rem;cursor:pointer;}
  .shuffle-btn:hover{border-color:var(--gold);}

  .win-overlay{position:fixed;inset:0;background:rgba(30,58,138,0.92);display:none;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:18px;text-align:center;padding:20px;}
  .win-overlay.show{display:flex;}
  .win-overlay h2{color:var(--gold);font-family:'Playfair Display',serif;font-size:2rem;margin:0;}
  .win-overlay p{color:white;font-size:1.05rem;margin:0;}
  .win-btn{background:var(--gold);color:#1a1a2e;border:none;padding:14px 32px;border-radius:50px;font-weight:800;font-size:0.95rem;cursor:pointer;}

</div>

<div class="game-area">
  <p class="instructions" id="instructionsText">Zapamiętaj, gdzie leży która karta — za chwilę się odwrócą! Potem <strong>znajdź pary</strong>: literę dźwięku i jego miejsce na pięciolinii.</p>

    <button class="mode-btn" data-mode="open" onclick="setMode('open')">👀 Karty odkryte</button>
  </div>

  <button class="win-btn" onclick="restartGame()">Zagraj jeszcze raz</button>
</div>

<script>
/* ══ Klucz wiolinowy, pozycje liter na pięciolinii (jedna oktawa) ══
   Te same wartości co w pozostałych grach Zagrajkowa (dopasuj-nute),
   żeby pozycja nuty na pięciolinii była spójna w całym serwisie. */
const CLEF_URL = '/index/fiszki/concept-art/wiolinowy-fiszki-bez-tla.png';
const CLEF_RATIO = 581/1361, CLEF_CH_MUL = 6.0, CLEF_PCT = 0.64, CLEF_REF_IDX = 3;
const STAFF_Y = {C:10,D:9,E:8,F:7,G:6,A:5,H:4};
const LETTERS_ORDER = ['C','D','E','F','G','A','H'];
const STAFF_VB_W = 125, STAFF_VB_H = 96, SG = 13, STAFF_TOP = 24, NOTE_X = 100;

function buildStaffSvg(letter){
  const c = '#1e3a8a';
  const noteY = STAFF_TOP + (STAFF_Y[letter] * SG / 2);
  const topLine = STAFF_TOP, botLine = STAFF_TOP + 4*SG, ledW = 9;

  let s = '';
  for(let i=0;i<5;i++){
    const ly = STAFF_TOP + i*SG;
    s += '<line x1="10" y1="'+ly+'" x2="'+(STAFF_VB_W-6)+'" y2="'+ly+'" stroke="'+c+'" stroke-width="2.4"/>';
  }
  const ch = SG * CLEF_CH_MUL, cw = ch * CLEF_RATIO;
  const cy = (STAFF_TOP + CLEF_REF_IDX*SG) - CLEF_PCT * ch;
  s += '<image href="'+CLEF_URL+'" x="9" y="'+cy.toFixed(1)+'" width="'+cw.toFixed(1)+'" height="'+ch.toFixed(1)+'" preserveAspectRatio="none"/>';

  if(noteY > botLine + SG*0.5){
    let ly = botLine + SG;
    while(ly <= noteY + SG*0.3){
      s += '<line x1="'+(NOTE_X-ledW)+'" y1="'+ly+'" x2="'+(NOTE_X+ledW)+'" y2="'+ly+'" stroke="'+c+'" stroke-width="2.2"/>';
      ly += SG;
    }
  }
  if(noteY < topLine - SG*0.5){
    let ly = topLine - SG;
    while(ly >= noteY - SG*0.3){
      s += '<line x1="'+(NOTE_X-ledW)+'" y1="'+ly+'" x2="'+(NOTE_X+ledW)+'" y2="'+ly+'" stroke="'+c+'" stroke-width="2.2"/>';
      ly -= SG;
    }
  }
  s += '<circle cx="'+NOTE_X+'" cy="'+noteY.toFixed(1)+'" r="5.4" fill="'+c+'"/>';
  return '<svg class="card-staff-svg" viewBox="0 0 '+STAFF_VB_W+' '+STAFF_VB_H+'" xmlns="http://www.w3.org/2000/svg">'+s+'</svg>';
}

/* ══ Stan gry ══ */
let cards = [];
let revealedIds = [];
let matchedCount = 0;
let moves = 0;
let inputLocked = true;
let openMode = false;

function getAudioCtx(){
  if(!window.__memoryAudioCtx){
    window.__memoryAudioCtx = new (window.AudioContext||window.webkitAudioContext)();
  }
  if(window.__memoryAudioCtx.state === 'suspended') window.__memoryAudioCtx.resume();
  return window.__memoryAudioCtx;
}

function playClickTone(){
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = 740;
  gain.gain.setValueAtTime(0.16, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.16);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime+0.18);
}

function setMode(mode){
  openMode = (mode === 'open');
  document.querySelectorAll('.mode-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.mode===mode); });
  restartGame();
}

function updateMoves(){
  document.getElementById('movesVal').textContent = moves;
}

function buildDeck(){
  const deck = [];
  LETTERS_ORDER.forEach(function(letter){
    deck.push({id: letter+'-letter', pairId: letter, kind: 'letter'});
    deck.push({id: letter+'-staff', pairId: letter, kind: 'staff'});
  });
  for(let i=deck.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    const tmp = deck[i]; deck[i] = deck[j]; deck[j] = tmp;
  }
  return deck;
}

function cardContentHtml(card){
  return card.kind === 'letter'
    ? '<span class="card-letter">'+card.pairId+'</span>'
    : buildStaffSvg(card.pairId);
}

function renderBoard(){
  const board = document.getElementById('memoryBoard');
  board.innerHTML = cards.map(function(card){
    const revealedClass = openMode ? ' revealed' : '';
    return '<div class="card-slot'+revealedClass+'" id="slot-'+card.id+'" data-id="'+card.id+'" onclick="onCardClick(\''+card.id+'\')">'
      + '<div class="card-inner">'
      + '<div class="card-face card-back"></div>'
      + '<div class="card-face card-front">'+cardContentHtml(card)+'</div>'
      + '</div></div>';
  }).join('');
}

function onCardClick(id){
  if(inputLocked) return;
  const slot = document.getElementById('slot-'+id);
  if(!slot || slot.classList.contains('matched')) return;

  if(openMode){
    if(slot.classList.contains('selected') || revealedIds.length >= 2) return;
    playClickTone();
    slot.classList.add('selected');
    revealedIds.push(id);

    if(revealedIds.length === 2){
      inputLocked = true;
      moves++;
      updateMoves();
      const [idA, idB] = revealedIds;
      const cardA = cards.find(function(c){return c.id===idA;});
      const cardB = cards.find(function(c){return c.id===idB;});
      const slotA = document.getElementById('slot-'+idA);
      const slotB = document.getElementById('slot-'+idB);

      if(cardA.pairId === cardB.pairId && cardA.kind !== cardB.kind){
        setTimeout(function(){
          slotA.classList.remove('selected'); slotA.classList.add('matched');
          slotB.classList.remove('selected'); slotB.classList.add('matched');
          matchedCount++;
          revealedIds = [];
          inputLocked = false;
          if(matchedCount === LETTERS_ORDER.length) showWin();
        }, 350);
      }else{
        setTimeout(function(){
          slotA.classList.remove('selected');
          slotB.classList.remove('selected');
          revealedIds = [];
          inputLocked = false;
        }, 500);
      }
    }
    return;
  }

  if(slot.classList.contains('revealed')) return;
  if(revealedIds.length >= 2) return;

  playClickTone();
  slot.classList.add('revealed');
  revealedIds.push(id);

  if(revealedIds.length === 2){
    inputLocked = true;
    moves++;
    updateMoves();
    const [idA, idB] = revealedIds;
    const cardA = cards.find(function(c){return c.id===idA;});
    const cardB = cards.find(function(c){return c.id===idB;});

    if(cardA.pairId === cardB.pairId && cardA.kind !== cardB.kind){
      setTimeout(function(){
        document.getElementById('slot-'+idA).classList.add('matched');
        document.getElementById('slot-'+idB).classList.add('matched');
        matchedCount++;
        revealedIds = [];
        inputLocked = false;
        if(matchedCount === LETTERS_ORDER.length) showWin();
      }, 350);
    }else{
      setTimeout(function(){
        document.getElementById('slot-'+idA).classList.remove('revealed');
        document.getElementById('slot-'+idB).classList.remove('revealed');
        revealedIds = [];
        inputLocked = false;
      }, 900);
    }
  }
}

function showWin(){
  document.getElementById('winText').textContent = 'Znalazłeś/aś wszystkie 7 par w ' + moves + ' ruchach!';
  document.getElementById('winOverlay').classList.add('show');
}

function restartGame(){
  moves = 0;
  matchedCount = 0;
  revealedIds = [];
  updateMoves();
  document.getElementById('winOverlay').classList.remove('show');
  document.getElementById('instructionsText').innerHTML = openMode
    ? 'Karty są cały czas odkryte — kliknij dwie, które do siebie pasują: literę dźwięku i jej miejsce na pięciolinii.'
    : 'Zapamiętaj, gdzie leży która karta — za chwilę się odwrócą! Potem <strong>znajdź pary</strong>: literę dźwięku i jego miejsce na pięciolinii.';

  cards = buildDeck();
  renderBoard();

  if(openMode){
    inputLocked = false;
    return;
  }

  /* Podgląd: wszystkie karty na chwilę odkryte, potem jednoczesny obrót
     w dół i start właściwej gry — klasyczny wstęp do memory. */
  inputLocked = true;
  document.querySelectorAll('.card-slot').forEach(function(el){ el.classList.add('revealed'); });
  setTimeout(function(){
    document.querySelectorAll('.card-slot').forEach(function(el){ el.classList.remove('revealed'); });
    inputLocked = false;
  }, 1800);
}

restartGame();
</script>
