<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ułóż Klucz Wiolinowy | Zagrajkowo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--gold:#d4af37;--navy:#1e3a8a;--border:#f0f0f0;--text:#334155;--text-mid:#64748b;--bg:#faf9f7;--card-bg:#ffffff;--green:#16a34a;}
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;padding:0;background:var(--bg);font-family:'Poppins',sans-serif;color:var(--text);overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column;}

  .top-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 5%;background:var(--card-bg);border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px;}
  .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--navy);text-decoration:none;font-weight:700;font-size:0.85rem;}
  .back-link:hover{color:var(--gold);}
  .game-title-bar{font-family:'Playfair Display',serif;font-weight:700;color:var(--navy);font-size:1.05rem;}
  .score-box{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--navy);font-size:0.9rem;background:#fdf8ec;border:1.5px solid var(--gold);border-radius:50px;padding:6px 16px;}

  .game-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 16px 50px;gap:22px;}
  .instructions{text-align:center;max-width:420px;color:var(--text-mid);font-size:0.86rem;line-height:1.6;}
  .instructions strong{color:var(--navy);}

  .puzzle-card{background:var(--card-bg);border-radius:24px;border:1px solid var(--border);box-shadow:0 8px 30px rgba(0,0,0,0.08);padding:18px;}
  .puzzle-grid{display:grid;grid-template-columns:repeat(3,80px);grid-template-rows:repeat(3,175px);gap:3px;background:var(--border);border-radius:10px;overflow:hidden;}
  @media(max-width:400px){.puzzle-grid{grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,140px);}}
  .piece{background-image:url('/index/gry/piano-maze/zapis-nutowy/wiolinowy-maze-bez-tla.jpg');background-repeat:no-repeat;cursor:pointer;transition:0.2s;position:relative;filter:sepia(0.15);}
  .piece:hover{filter:brightness(1.08) sepia(0.15);}
  .piece.selected{outline:3px solid var(--gold);outline-offset:-3px;z-index:2;}
  .piece.correct{outline:2px solid var(--green);outline-offset:-2px;}

  .puzzle-actions{display:flex;gap:12px;}
  .shuffle-btn{background:var(--card-bg);border:2px solid var(--border);color:var(--navy);padding:10px 22px;border-radius:50px;font-weight:700;font-size:0.82rem;cursor:pointer;}
  .shuffle-btn:hover{border-color:var(--gold);}

  .win-overlay{position:fixed;inset:0;background:rgba(30,58,138,0.92);display:none;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:18px;text-align:center;padding:20px;}
  .win-overlay.show{display:flex;}
  .win-overlay h2{color:var(--gold);font-family:'Playfair Display',serif;font-size:2rem;margin:0;}
  .win-overlay p{color:white;font-size:1.05rem;margin:0;}
  .win-btn{background:var(--gold);color:#1a1a2e;border:none;padding:14px 32px;border-radius:50px;font-weight:800;font-size:0.95rem;cursor:pointer;}
</style>
</head>
<body>

<div class="top-bar">
  <a href="/index/gry/zagrajkowo/zagrajkowo.html" class="back-link">‹ Wróć do gier</a>
  <span class="game-title-bar">🧩 Ułóż klucz wiolinowy</span>
  <span class="score-box">🔀 <span id="movesVal">0</span> ruchów</span>
</div>

<div class="game-area">
  <p class="instructions">Klucz wiolinowy został pocięty na kawałki. Kliknij dwa kafelki, żeby je <strong>zamienić miejscami</strong> — ułóż obrazek z powrotem w całość.</p>

  <div class="puzzle-card">
    <div class="puzzle-grid" id="puzzleGrid"></div>
  </div>

  <div class="puzzle-actions">
    <button class="shuffle-btn" onclick="restartGame()">🔀 Przetasuj od nowa</button>
  </div>
</div>

<div class="win-overlay" id="winOverlay">
  <div style="font-size:3.5rem;">🏆</div>
  <h2>Ułożone!</h2>
  <p id="winText"></p>
  <button class="win-btn" onclick="restartGame()">Zagraj jeszcze raz</button>
</div>

<script>
const COLS = 3, ROWS = 3;
const TILE_W = 80, TILE_H = 175;
const IMG_W = TILE_W * COLS, IMG_H = TILE_H * ROWS;

let pieces = [];
let selected = null;
let moves = 0;

function shuffled(arr){
  const a = arr.slice();
  do{
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
  }while(a.every(function(v,i){return v===i;}));
  return a;
}

function renderGrid(){
  const grid = document.getElementById('puzzleGrid');
  grid.innerHTML = '';
  pieces.forEach(function(correctIdx, slot){
    const col = correctIdx % COLS, row = Math.floor(correctIdx / COLS);
    const bx = -(col * TILE_W), by = -(row * TILE_H);
    const div = document.createElement('div');
    div.className = 'piece';
    div.style.width = TILE_W+'px';
    div.style.height = TILE_H+'px';
    div.style.backgroundSize = IMG_W+'px '+IMG_H+'px';
    div.style.backgroundPosition = bx+'px '+by+'px';
    div.dataset.slot = slot;
    if(correctIdx === slot) div.classList.add('correct');
    div.addEventListener('click', function(){selectPiece(slot);});
    grid.appendChild(div);
  });
}

function selectPiece(slot){
  const el = document.querySelector('.piece[data-slot="'+slot+'"]');
  if(selected === null){
    selected = slot;
    el.classList.add('selected');
  }else if(selected === slot){
    el.classList.remove('selected');
    selected = null;
  }else{
    const tmp = pieces[selected];
    pieces[selected] = pieces[slot];
    pieces[slot] = tmp;
    moves++;
    document.getElementById('movesVal').textContent = moves;
    document.querySelectorAll('.piece.selected').forEach(function(e){e.classList.remove('selected');});
    selected = null;
    renderGrid();
    checkWin();
  }
}

function checkWin(){
  if(pieces.every(function(v,i){return v===i;})){
    document.getElementById('winText').textContent = 'Ułożyłeś/aś klucz wiolinowy w ' + moves + ' ruchach!';
    document.getElementById('winOverlay').classList.add('show');
  }
}

function restartGame(){
  moves = 0;
  document.getElementById('movesVal').textContent = '0';
  document.getElementById('winOverlay').classList.remove('show');
  selected = null;
  const base = [];
  for(let i=0;i<COLS*ROWS;i++) base.push(i);
  pieces = shuffled(base);
  renderGrid();
}

restartGame();
</script>
</body>
</html>
