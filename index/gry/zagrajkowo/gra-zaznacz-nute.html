<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zaznacz Właściwą Nutę | Zagrajkowo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700&family=Poppins:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--gold:#d4af37;--navy:#1e3a8a;--border:#f0f0f0;--text:#334155;--text-mid:#64748b;--bg:#faf9f7;--card-bg:#ffffff;--green:#16a34a;--red:#dc2626;}
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;padding:0;background:var(--bg);font-family:'Poppins',sans-serif;color:var(--text);overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column;}

  .top-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 5%;background:var(--card-bg);border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px;}
  .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--navy);text-decoration:none;font-weight:700;font-size:0.85rem;}
  .back-link:hover{color:var(--gold);}
  .game-title-bar{font-family:'Playfair Display',serif;font-weight:700;color:var(--navy);font-size:1.05rem;}
  .score-box{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--navy);font-size:0.9rem;background:#fdf8ec;border:1.5px solid var(--gold);border-radius:50px;padding:6px 16px;}

  .game-area{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 16px 50px;gap:24px;}

  .field-layer{position:fixed;inset:0;pointer-events:none;z-index:0;}
  .field-bee{position:fixed;pointer-events:none;z-index:50;transition:left 1.1s cubic-bezier(0.3,0.7,0.3,1),top 1.1s cubic-bezier(0.3,0.7,0.3,1);}
  .field-flower{position:fixed;pointer-events:none;transition:transform 0.5s cubic-bezier(0.34,1.56,0.64,1);}

  .wrong-watermark{position:fixed;bottom:22px;right:22px;z-index:1;width:70px;height:70px;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(0.8);transition:opacity 0.4s,transform 0.4s;pointer-events:none;}
  .wrong-watermark.show{opacity:0.3;transform:scale(1);}
  .wrong-watermark .wm-letter{font-family:'Nunito',sans-serif;font-weight:900;font-size:2.4rem;color:var(--red);}
  .wrong-watermark .wm-x{position:absolute;font-size:3.2rem;font-weight:900;color:var(--red);}

  .target-box{background:var(--navy);color:white;border-radius:16px;padding:14px 30px;text-align:center;}
  .target-box .t-label{font-size:0.68rem;text-transform:uppercase;letter-spacing:0.1em;color:rgba(255,255,255,0.6);}
  .target-box .t-letter{font-family:'Nunito',sans-serif;font-weight:900;font-size:2.2rem;color:var(--gold);line-height:1.1;}

  .staff-card{background:var(--card-bg);border-radius:24px;border:1px solid var(--border);box-shadow:0 8px 30px rgba(0,0,0,0.08);padding:16px;}
  #staffWrap{width:min(92vw,560px);}
  .note-hit{cursor:pointer;}
  .note-hit:hover ellipse{filter:brightness(1.15);}

  .feedback-msg{min-height:28px;font-weight:800;font-size:1rem;text-align:center;}
  .feedback-msg.ok{color:var(--green);}
  .feedback-msg.bad{color:var(--red);}

  .win-overlay{position:fixed;inset:0;background:rgba(30,58,138,0.92);display:none;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:18px;text-align:center;padding:20px;}
  .win-overlay.show{display:flex;}
  .win-overlay h2{color:var(--gold);font-family:'Playfair Display',serif;font-size:2rem;margin:0;}
  .win-overlay p{color:white;font-size:1.05rem;margin:0;}
  .win-btn{background:var(--gold);color:#1a1a2e;border:none;padding:14px 32px;border-radius:50px;font-weight:800;font-size:0.95rem;cursor:pointer;}
</style>
</head>
<body>

<div class="field-layer" id="fieldLayer"></div>

<div class="top-bar">
  <a href="/index/gry/zagrajkowo/zagrajkowo.html" class="back-link">‹ Wróć do gier</a>
  <span class="game-title-bar">⭕ Zaznacz właściwą nutę</span>
  <span class="score-box">⭐ <span id="scoreVal">0</span> / <span id="totalVal">10</span></span>
</div>

<div class="game-area">
  <div class="wrong-watermark" id="wrongWatermark"></div>

  <div class="target-box">
    <div class="t-label">Znajdź na pięciolinii</div>
    <div class="t-letter" id="targetLetter">C</div>
  </div>

  <div class="staff-card">
    <div id="staffWrap"></div>
  </div>

  <div class="feedback-msg" id="feedbackMsg"></div>
</div>

<div class="win-overlay" id="winOverlay">
  <div style="font-size:3.5rem;">🏆</div>
  <h2>Brawo!</h2>
  <p id="winText"></p>
  <button class="win-btn" onclick="restartGame()">Zagraj jeszcze raz</button>
</div>

<script>
const CLEF_TREBLE_URL = '/index/fiszki/concept-art/wiolinowy-fiszki-bez-tla.png';
const CLEF_TREBLE_RATIO = 581 / 1361;
const CLEF_TREBLE_G_PCT = 0.64;

const GAME_NOTES = [
  {id:'c1', letter:'C', staffY:10},
  {id:'d1', letter:'D', staffY:9},
  {id:'e1', letter:'E', staffY:8},
  {id:'f1', letter:'F', staffY:7},
  {id:'g1', letter:'G', staffY:6},
  {id:'a1', letter:'A', staffY:5},
  {id:'h1', letter:'H', staffY:4},
];

const FLOWERS = ['aster.png','dzwonek.png','frezja.png','gerbera.png','groszek-pachnacy.png','hibiskus.png','lilia.png','mak.png','ostrozen.png','piwonia.png','roza.png','slonecznik.png','stokrotka.png','szafirek.png','tulipan.png'];
const BEE_URL = '/index/fiszki/concept-art/pszczola.png';

const TOTAL_ROUNDS = 10;
let round = 0, score = 0, targetNote = null, roundOrder = [], roundLocked = false;

function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

let STAFF_W = 520, STAFF_H = 200;

function renderStaff(order, target){
  const W = 520, H = 200;
  STAFF_W = W; STAFF_H = H;
  const sg = 16;
  const staffTop = 40;
  const c = '#1e3a8a';

  let s = `<svg id="staffSvg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;

  for(let i=0;i<5;i++){
    const ly = staffTop + i*sg;
    s += `<line x1="20" y1="${ly}" x2="${W-20}" y2="${ly}" stroke="${c}" stroke-width="1.4" opacity="0.55"/>`;
  }

  const ch = sg * 6.0;
  const cw = ch * CLEF_TREBLE_RATIO;
  const cy = (staffTop + 3*sg) - CLEF_TREBLE_G_PCT * ch;
  s += `<image href="${CLEF_TREBLE_URL}" x="26" y="${cy.toFixed(1)}" width="${cw.toFixed(1)}" height="${ch.toFixed(1)}" preserveAspectRatio="none"/>`;

  const topLine = staffTop, botLine = staffTop + 4*sg;
  const startX = 120, stepX = (W - startX - 40) / (order.length - 1);
  const ledW = 12;

  order.forEach((note, i) => {
    const noteX = startX + i*stepX;
    const noteY = staffTop + (note.staffY * sg / 2);

    if(noteY > botLine + sg*0.5){
      let ly = botLine + sg;
      while(ly <= noteY + sg*0.3){
        s += `<line x1="${noteX-ledW}" y1="${ly}" x2="${noteX+ledW}" y2="${ly}" stroke="${c}" stroke-width="1.6"/>`;
        ly += sg;
      }
    }
    if(noteY < topLine - sg*0.5){
      let ly = topLine - sg;
      while(ly >= noteY - sg*0.3){
        s += `<line x1="${noteX-ledW}" y1="${ly}" x2="${noteX+ledW}" y2="${ly}" stroke="${c}" stroke-width="1.6"/>`;
        ly -= sg;
      }
    }

    const stemUp = noteY > staffTop + sg*2;
    const sx = stemUp ? noteX+9 : noteX-9;
    const sy2 = stemUp ? noteY-42 : noteY+42;

    s += `<g class="note-hit" data-letter="${note.letter}" data-idx="${i}" data-nx="${noteX}" data-ny="${noteY}">`;
    s += `<rect x="${noteX-16}" y="${Math.min(noteY,sy2)-10}" width="32" height="${Math.abs(sy2-noteY)+20}" fill="transparent"/>`;
    s += `<circle id="circleMark-${i}" cx="${noteX}" cy="${noteY}" r="16" fill="none" stroke="${'#16a34a'}" stroke-width="3" opacity="0"/>`;
    s += `<ellipse cx="${noteX}" cy="${noteY}" rx="11" ry="8" fill="#d4af37" stroke="#8a6d1a" stroke-width="1" transform="rotate(-15,${noteX},${noteY})"/>`;
    s += `<line x1="${sx}" y1="${noteY}" x2="${sx}" y2="${sy2}" stroke="#8a6d1a" stroke-width="2.4"/>`;
    s += `</g>`;
  });

  s += '</svg>';
  document.getElementById('staffWrap').innerHTML = s;

  document.querySelectorAll('.note-hit').forEach(el => {
    el.addEventListener('click', () => checkAnswer(el.dataset.letter, el.dataset.idx));
  });
}

function flyAwayAsBee(noteEl, noteX, noteY){
  noteEl.style.pointerEvents = 'none';
  noteEl.querySelectorAll('ellipse,line').forEach(function(el){
    el.style.transition = 'opacity 0.35s';
    el.style.opacity = '0';
  });

  const svg = document.getElementById('staffSvg');
  const svgRect = svg.getBoundingClientRect();
  const scale = svgRect.width / STAFF_W;
  const startX = svgRect.left + noteX*scale;
  const startY = svgRect.top + noteY*scale;

  const bw = 46, bh = 46;
  const bee = document.createElement('img');
  bee.src = BEE_URL;
  bee.className = 'field-bee';
  bee.style.width = bw+'px';
  bee.style.height = bh+'px';
  bee.style.left = (startX-bw/2)+'px';
  bee.style.top = (startY-bh/2)+'px';
  document.getElementById('fieldLayer').appendChild(bee);

  const cardRect = document.querySelector('.staff-card').getBoundingClientRect();
  const goRight = startX > (cardRect.left + cardRect.width/2);
  const edgeX = goRight
    ? cardRect.right + 30 + Math.random()*(window.innerWidth - cardRect.right - 60)
    : Math.random()*(cardRect.left - 60) + 20;
  const edgeY = Math.max(30, Math.min(window.innerHeight-30, startY + (Math.random()*160-80)));

  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      bee.style.left = (edgeX-bw/2)+'px';
      bee.style.top = (edgeY-bh/2)+'px';
    });
  });

  setTimeout(function(){
    bee.remove();
    spawnFieldFlower(edgeX, edgeY);
  }, 1100);
}

function spawnFieldFlower(x, y){
  const flower = FLOWERS[Math.floor(Math.random()*FLOWERS.length)];
  const fs = 28 + Math.round(Math.random()*12);
  const img = document.createElement('img');
  img.src = '/index/fiszki/concept-art/'+flower;
  img.className = 'field-flower';
  img.style.width = fs+'px';
  img.style.height = fs+'px';
  img.style.left = (x-fs/2)+'px';
  img.style.top = (y-fs/2)+'px';
  img.style.transform = 'scale(0)';
  document.getElementById('fieldLayer').appendChild(img);
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      img.style.transform = 'scale(1)';
    });
  });
}

function showWrongWatermark(letter){
  const wm = document.getElementById('wrongWatermark');
  wm.innerHTML = '<span class="wm-letter">'+letter+'</span><span class="wm-x">✕</span>';
  wm.classList.add('show');
}

function hideWrongWatermark(){
  const wm = document.getElementById('wrongWatermark');
  wm.classList.remove('show');
  wm.innerHTML = '';
}

function checkAnswer(letter, idx){
  if(roundLocked) return;
  roundLocked = true;
  const feedback = document.getElementById('feedbackMsg');
  const correct = (letter === targetNote.letter);

  document.querySelectorAll('.note-hit').forEach(function(el){
    if(el.dataset.letter !== targetNote.letter){
      const nx = parseFloat(el.dataset.nx), ny = parseFloat(el.dataset.ny);
      flyAwayAsBee(el, nx, ny);
    }
  });

  const targetEl = document.querySelector('.note-hit[data-letter="'+targetNote.letter+'"]');
  if(targetEl) targetEl.querySelector('circle[id^="circleMark-"]').setAttribute('opacity','1');

  if(correct){
    feedback.textContent = '✓ Dokładnie to! Dźwięk ' + letter + '.';
    feedback.className = 'feedback-msg ok';
    score++;
    document.getElementById('scoreVal').textContent = score;
  }else{
    showWrongWatermark(letter);
    feedback.textContent = 'To nie ' + letter + ' — dobra nuta to ' + targetNote.letter + '.';
    feedback.className = 'feedback-msg bad';
  }

  setTimeout(nextRound, 1500);
}

function nextRound(){
  round++;
  roundLocked = false;
  hideWrongWatermark();
  document.getElementById('feedbackMsg').textContent = '';
  document.getElementById('feedbackMsg').className = 'feedback-msg';
  if(round >= TOTAL_ROUNDS){ showWin(); return; }
  roundOrder = shuffled(GAME_NOTES);
  targetNote = roundOrder[Math.floor(Math.random()*roundOrder.length)];
  document.getElementById('targetLetter').textContent = targetNote.letter;
  renderStaff(roundOrder, targetNote);
}

function showWin(){
  document.getElementById('winText').textContent =
    'Wynik: ' + score + ' / ' + TOTAL_ROUNDS + ' — ' +
    (score === TOTAL_ROUNDS ? 'komplet! 🌟' : score >= TOTAL_ROUNDS*0.7 ? 'bardzo dobrze!' : 'ćwicz dalej!');
  document.getElementById('winOverlay').classList.add('show');
}

function restartGame(){
  round = 0; score = 0;
  document.getElementById('scoreVal').textContent = '0';
  document.getElementById('winOverlay').classList.remove('show');
  nextRound();
}

document.getElementById('totalVal').textContent = TOTAL_ROUNDS;
restartGame();
</script>
</body>
</html>
