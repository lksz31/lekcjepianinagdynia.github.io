<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Umieść Nutę | Zagrajkowo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700&family=Poppins:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--gold:#d4af37;--navy:#1e3a8a;--border:#f0f0f0;--text:#334155;--text-mid:#64748b;--bg:#faf9f7;--card-bg:#ffffff;--green:#16a34a;--red:#dc2626;}
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;padding:0;background:var(--bg);font-family:'Poppins',sans-serif;color:var(--text);overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column;}

  .top-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 5%;background:var(--card-bg);border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px;}
  .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--navy);text-decoration:none;font-weight:700;font-size:0.85rem;}
  .back-link:hover{color:var(--gold);}
  .game-title-bar{font-family:'Playfair Display',serif;font-weight:700;color:var(--navy);font-size:1.05rem;}
  .score-box{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--navy);font-size:0.9rem;background:#fdf8ec;border:1.5px solid var(--gold);border-radius:50px;padding:6px 16px;}

  .game-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px 50px;gap:18px;}

  .mode-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  .mode-btn{background:var(--card-bg);border:2px solid var(--border);border-radius:50px;padding:7px 16px;font-weight:700;font-size:0.78rem;color:var(--navy);cursor:pointer;transition:0.2s;}
  .mode-btn:hover{border-color:var(--gold);}
  .mode-btn.active{border-color:var(--navy);background:var(--navy);color:#fff;}

  .task-box{background:var(--navy);color:white;border-radius:16px;padding:14px 26px;text-align:center;max-width:440px;}
  .task-box .t-label{font-size:0.68rem;text-transform:uppercase;letter-spacing:0.1em;color:rgba(255,255,255,0.6);margin-bottom:4px;}
  .task-box .t-text{font-weight:800;font-size:1.05rem;line-height:1.6;}
  .task-box .t-text b{color:var(--gold);}

  .instructions{text-align:center;max-width:440px;color:var(--text-mid);font-size:0.82rem;line-height:1.5;}
  .instructions strong{color:var(--navy);}

  .duration-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  .dur-tile{background:var(--card-bg);border:2px solid var(--border);border-radius:14px;padding:10px 14px;cursor:grab;touch-action:none;user-select:none;transition:border-color 0.2s,transform 0.2s;}
  .dur-tile:hover{border-color:var(--gold);}
  .dur-tile svg{width:26px;height:36px;display:block;pointer-events:none;}
  .dur-tile.drag-ghost{position:fixed;z-index:1000;cursor:grabbing;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,0.25));}

  .staff-card{background:var(--card-bg);border-radius:24px;border:1px solid var(--border);box-shadow:0 8px 30px rgba(0,0,0,0.08);padding:16px;}
  #staffWrap{width:min(92vw,420px);}
  .slot-hit rect{transition:0.15s;}
  .slot-hit.slot-hover rect{stroke:#d4af37;fill:rgba(212,175,55,0.12);}
  .slot-fill{cursor:pointer;}
  .nudge-btn{cursor:pointer;}
  .nudge-btn:hover circle{fill:#dbe6ff;}

  .check-btn{background:var(--gold);color:white;border:none;padding:13px 32px;border-radius:50px;font-weight:800;font-size:0.9rem;cursor:pointer;transition:0.2s;}
  .check-btn:disabled{opacity:0.4;cursor:not-allowed;}
  .check-btn:hover:not(:disabled){transform:translateY(-2px);}

  .feedback-msg{min-height:28px;font-weight:800;font-size:0.92rem;text-align:center;line-height:1.5;}
  .feedback-msg.ok{color:var(--green);}
  .feedback-msg.bad{color:var(--red);}

  .win-overlay{position:fixed;inset:0;background:rgba(30,58,138,0.92);display:none;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:18px;text-align:center;padding:20px;}
  .win-overlay.show{display:flex;}
  .win-overlay h2{color:var(--gold);font-family:'Playfair Display',serif;font-size:2rem;margin:0;}
  .win-overlay p{color:white;font-size:1.05rem;margin:0;}
  .win-btn{background:var(--gold);color:#1a1a2e;border:none;padding:14px 32px;border-radius:50px;font-weight:800;font-size:0.95rem;cursor:pointer;}
</style>
</head>
<body>

<div class="top-bar">
  <a href="/index/gry/zagrajkowo/zagrajkowo.html" class="back-link">‹ Wróć do gier</a>
  <span class="game-title-bar">✏️ Umieść nutę</span>
  <span class="score-box">⭐ <span id="scoreVal">0</span> / <span id="totalVal">8</span></span>
</div>

<div class="game-area">
  <div class="mode-row" id="focusRow">
    <button type="button" class="mode-btn" data-focus="duration" onclick="setFocusMode('duration')">Same wartości nut</button>
    <button type="button" class="mode-btn" data-focus="pitch" onclick="setFocusMode('pitch')">Wartości i wysokości</button>
  </div>

  <div class="task-box">
    <div class="t-label">Zadanie</div>
    <div class="t-text" id="taskText"></div>
  </div>

  <p class="instructions">Przeciągnij <strong>nutkę lub pauzę</strong> z palety na pięciolinię. Wysokość dźwięku ustaw <strong>strzałkami</strong> obok nutki.</p>

  <div class="duration-row" id="durationRow"></div>

  <div class="staff-card">
    <div id="staffWrap"></div>
  </div>

  <button class="check-btn" id="checkBtn" disabled onclick="checkAnswer()">Sprawdź</button>

  <div class="feedback-msg" id="feedbackMsg"></div>
</div>

<div class="win-overlay" id="winOverlay">
  <div style="font-size:3.5rem;">🏆</div>
  <h2>Brawo!</h2>
  <p id="winText"></p>
  <button class="win-btn" onclick="restartGame()">Zagraj jeszcze raz</button>
</div>

<script>
const CLEF_TREBLE_URL = '/index/fiszki/concept-art/wiolinowy-fiszki-bez-tla.png';
const CLEF_TREBLE_RATIO = 581 / 1361;
const CLEF_TREBLE_G_PCT = 0.64;

const GAME_NOTES = [
  {id:'c1', letter:'C', staffY:10},
  {id:'d1', letter:'D', staffY:9},
  {id:'e1', letter:'E', staffY:8},
  {id:'f1', letter:'F', staffY:7},
  {id:'g1', letter:'G', staffY:6},
  {id:'a1', letter:'A', staffY:5},
  {id:'h1', letter:'H', staffY:4},
];

const DURATIONS = [
  {id:'whole'},
  {id:'half'},
  {id:'quarter'},
];
const REST_DURATIONS = [
  {id:'quarter'},
];
const NOTE_DUR_NAMES = {whole:'całą nutę', half:'półnutę', quarter:'ćwierćnutę'};
const REST_DUR_NAMES = {quarter:'pauzę ćwierćnutową'};

const W = 340, H = 210, SG = 16, STAFF_TOP = 46;

function durIcon(durId){
  const headFill = durId==='quarter' ? '#d4af37' : 'none';
  const stroke = '#8a6d1a';
  let s = '<svg viewBox="0 0 30 40">';
  s += '<ellipse cx="15" cy="30" rx="8" ry="6" fill="'+headFill+'" stroke="'+stroke+'" stroke-width="2" transform="rotate(-15,15,30)"/>';
  if(durId !== 'whole'){
    s += '<line x1="22" y1="30" x2="22" y2="4" stroke="'+stroke+'" stroke-width="2.2"/>';
  }
  s += '</svg>';
  return s;
}

function restIcon(){
  const c = '#8a6d1a';
  const inner = '<path d="M13 6 L22 14 L9 20 L22 27 L11 36" fill="none" stroke="'+c+'" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>';
  return '<svg viewBox="0 0 30 40">'+inner+'</svg>';
}

function restSVGAt(cx){
  const c = '#8a6d1a';
  const cy = STAFF_TOP + 2*SG;
  const pts = [[cx-2,cy-17],[cx+7,cy-9],[cx-6,cy-2],[cx+7,cy+7],[cx-3,cy+17]];
  const d = 'M '+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L ');
  return '<path d="'+d+'" fill="none" stroke="'+c+'" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>';
}

function noteSVGAt(cx, noteY, durId){
  let s = '';
  const topLine = STAFF_TOP, botLine = STAFF_TOP + 4*SG, ledW = 12, c = '#1e3a8a';
  if(noteY > botLine + SG*0.5){
    let ly = botLine + SG;
    while(ly <= noteY + SG*0.3){
      s += '<line x1="'+(cx-ledW)+'" y1="'+ly+'" x2="'+(cx+ledW)+'" y2="'+ly+'" stroke="'+c+'" stroke-width="1.6"/>';
      ly += SG;
    }
  }
  if(noteY < topLine - SG*0.5){
    let ly = topLine - SG;
    while(ly >= noteY - SG*0.3){
      s += '<line x1="'+(cx-ledW)+'" y1="'+ly+'" x2="'+(cx+ledW)+'" y2="'+ly+'" stroke="'+c+'" stroke-width="1.6"/>';
      ly -= SG;
    }
  }
  const fill = durId==='quarter' ? '#d4af37' : 'none';
  s += '<ellipse cx="'+cx+'" cy="'+noteY+'" rx="11" ry="8" fill="'+fill+'" stroke="#8a6d1a" stroke-width="2" transform="rotate(-15,'+cx+','+noteY+')"/>';
  if(durId !== 'whole'){
    const stemUp = noteY > STAFF_TOP + SG*2;
    const sx = stemUp ? cx+9 : cx-9;
    const sy2 = stemUp ? noteY-42 : noteY+42;
    s += '<line x1="'+sx+'" y1="'+noteY+'" x2="'+sx+'" y2="'+sy2+'" stroke="#8a6d1a" stroke-width="2.4"/>';
  }
  return s;
}

const TOTAL_ROUNDS = 8;
let round = 0, score = 0;
let focusMode = 'pitch';   /* 'duration' | 'pitch' */

let targetSlots = [];
let placedSlots = [];

function setFocusMode(m){
  focusMode = m;
  document.querySelectorAll('#focusRow .mode-btn').forEach(b=>b.classList.toggle('active', b.dataset.focus===m));
  restartGame();
}

function pickTask(){
  const slotCount = Math.random() < 0.5 ? 1 : 2;
  const slots = [];
  for(let i=0;i<slotCount;i++){
    const type = Math.random() < 0.5 ? 'note' : 'rest';
    const durId = type==='rest' ? 'quarter' : DURATIONS[Math.floor(Math.random()*DURATIONS.length)].id;
    let letter = null;
    if(type==='note' && focusMode==='pitch'){
      letter = GAME_NOTES[Math.floor(Math.random()*GAME_NOTES.length)].letter;
    }
    slots.push({type, durId, letter});
  }
  targetSlots = slots;
  placedSlots = slots.map(()=>null);
}

function buildTaskText(){
  const parts = targetSlots.map((s,i)=>{
    const name = s.type==='note' ? NOTE_DUR_NAMES[s.durId] : REST_DUR_NAMES[s.durId];
    const pitchTxt = (s.type==='note' && s.letter) ? ' na dźwięku <b>'+s.letter+'</b>' : '';
    const prefix = targetSlots.length>1 ? ('<b>'+(i===0?'Pierwsza':'Druga')+'</b>: ') : '';
    return prefix+'umieść <b>'+name+'</b>'+pitchTxt;
  });
  return parts.join('<br>');
}

function renderPalette(){
  const row = document.getElementById('durationRow');
  let html = '';
  html += DURATIONS.map(d =>
    '<div class="dur-tile" data-type="note" data-dur="'+d.id+'">'+durIcon(d.id)+'</div>'
  ).join('');
  html += REST_DURATIONS.map(d =>
    '<div class="dur-tile" data-type="rest" data-dur="'+d.id+'">'+restIcon()+'</div>'
  ).join('');
  row.innerHTML = html;
  row.querySelectorAll('.dur-tile').forEach(attachPaletteDrag);
}

function nearestLetter(staffY){
  let best = GAME_NOTES[0], bestDist = Infinity;
  GAME_NOTES.forEach(n=>{
    const d = Math.abs(n.staffY - staffY);
    if(d < bestDist){ bestDist = d; best = n; }
  });
  return best.letter;
}

function attachPaletteDrag(tile){
  tile.addEventListener('pointerdown', function(e){
    e.preventDefault();
    const type = tile.dataset.type, durId = tile.dataset.dur;
    const rect = tile.getBoundingClientRect();
    const ghost = tile.cloneNode(true);
    ghost.classList.add('drag-ghost');
    ghost.style.left = rect.left+'px';
    ghost.style.top = rect.top+'px';
    ghost.style.width = rect.width+'px';
    document.body.appendChild(ghost);
    const offX = e.clientX - rect.left, offY = e.clientY - rect.top;

    function move(ev){
      ghost.style.left = (ev.clientX - offX)+'px';
      ghost.style.top = (ev.clientY - offY)+'px';
      document.querySelectorAll('.slot-hit').forEach(s=>s.classList.remove('slot-hover'));
      ghost.style.pointerEvents = 'none';
      const under = document.elementFromPoint(ev.clientX, ev.clientY);
      const slot = under && under.closest ? under.closest('.slot-hit') : null;
      if(slot) slot.classList.add('slot-hover');
    }
    function up(ev){
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      document.querySelectorAll('.slot-hit').forEach(s=>s.classList.remove('slot-hover'));
      const under = document.elementFromPoint(ev.clientX, ev.clientY);
      const slot = under && under.closest ? under.closest('.slot-hit') : null;
      ghost.remove();
      if(slot){
        const idx = parseInt(slot.dataset.idx, 10);
        placeInSlot(idx, type, durId);
      }
    }
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  });
}

function placeInSlot(idx, type, durId){
  let letter = (type==='note' && focusMode==='pitch') ? 'H' : null;
  placedSlots[idx] = {type:type, durId:durId, letter:letter};
  renderStaff();
  updateCheckBtn();
}

function clearSlot(idx){
  placedSlots[idx] = null;
  renderStaff();
  updateCheckBtn();
}

function nudgePitch(idx, deltaStaffY){
  const p = placedSlots[idx];
  if(!p || p.type !== 'note') return;
  const curDef = GAME_NOTES.find(n => n.letter === p.letter);
  const curY = curDef ? curDef.staffY : 4;
  const newY = Math.max(4, Math.min(10, curY + deltaStaffY));
  p.letter = nearestLetter(newY);
  renderStaff();
}

function renderStaff(){
  const c = '#1e3a8a';
  let s = '<svg id="staffSvg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';

  for(let i=0;i<5;i++){
    const ly = STAFF_TOP + i*SG;
    s += '<line x1="20" y1="'+ly+'" x2="'+(W-20)+'" y2="'+ly+'" stroke="'+c+'" stroke-width="1.4" opacity="0.55"/>';
  }

  const ch = SG * 6.0;
  const cw = ch * CLEF_TREBLE_RATIO;
  const cy = (STAFF_TOP + 3*SG) - CLEF_TREBLE_G_PCT * ch;
  s += '<image href="'+CLEF_TREBLE_URL+'" x="24" y="'+cy.toFixed(1)+'" width="'+cw.toFixed(1)+'" height="'+ch.toFixed(1)+'" preserveAspectRatio="none"/>';

  const slotXs = targetSlots.length === 1 ? [W*0.68] : [W*0.5, W*0.82];
  const boxTop = STAFF_TOP - 36, boxH = 4*SG + 72;

  slotXs.forEach((sx, i) => {
    const placed = placedSlots[i];
    s += '<g class="slot-hit" data-idx="'+i+'">';
    s += '<rect x="'+(sx-19)+'" y="'+boxTop+'" width="38" height="'+boxH+'" rx="8" fill="transparent" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="4,3"/>';
    if(targetSlots.length > 1){
      s += '<text x="'+sx+'" y="'+(boxTop-6)+'" text-anchor="middle" font-size="12" font-weight="800" fill="#94a3b8" font-family="Nunito,sans-serif">'+(i+1)+'</text>';
    }
    s += '</g>';
    if(placed){
      s += '<g class="slot-fill" onclick="clearSlot('+i+')">';
      let ny = STAFF_TOP + 2*SG;
      if(placed.type === 'note'){
        const letterForY = (focusMode==='pitch' && placed.letter) ? placed.letter : 'H';
        const nDef = GAME_NOTES.find(n => n.letter === letterForY);
        ny = STAFF_TOP + (nDef.staffY * SG / 2);
        s += noteSVGAt(sx, ny, placed.durId);
      }else{
        s += restSVGAt(sx);
      }
      s += '</g>';
      if(placed.type === 'note' && focusMode === 'pitch'){
        const ax = sx + 24;
        s += '<g class="nudge-btn" onclick="event.stopPropagation();nudgePitch('+i+',-1)"><circle cx="'+ax+'" cy="'+(ny-14)+'" r="10" fill="#f0f4ff"/><polygon points="'+ax+','+(ny-19)+' '+(ax-5)+','+(ny-11)+' '+(ax+5)+','+(ny-11)+'" fill="#1e3a8a"/></g>';
        s += '<g class="nudge-btn" onclick="event.stopPropagation();nudgePitch('+i+',1)"><circle cx="'+ax+'" cy="'+(ny+14)+'" r="10" fill="#f0f4ff"/><polygon points="'+ax+','+(ny+19)+' '+(ax-5)+','+(ny+11)+' '+(ax+5)+','+(ny+11)+'" fill="#1e3a8a"/></g>';
      }
    }
  });

  s += '</svg>';
  document.getElementById('staffWrap').innerHTML = s;
}

function updateCheckBtn(){
  document.getElementById('checkBtn').disabled = placedSlots.some(p => p===null);
}

function checkAnswer(){
  const feedback = document.getElementById('feedbackMsg');
  let allCorrect = true;
  const lines = [];

  placedSlots.forEach((p, i) => {
    const t = targetSlots[i];
    const label = targetSlots.length > 1 ? (i===0 ? 'Pierwsza — ' : 'Druga — ') : '';
    const typeOk = p.type === t.type;
    const durOk = p.durId === t.durId;
    const checkPitch = t.type==='note' && focusMode==='pitch';
    const pitchOk = !checkPitch || (p.letter === t.letter);

    if(typeOk && durOk && pitchOk){
      lines.push(label + '✓ świetnie!');
      return;
    }
    allCorrect = false;
    if(!typeOk){
      lines.push(label + (p.type==='rest' ? 'tu miała być nuta, nie pauza.' : 'tu miała być pauza, nie nuta.'));
    }else if(checkPitch && durOk && !pitchOk){
      lines.push(label + 'dobra wartość rytmiczna! Ale spróbuj innej wysokości dźwięku.');
    }else if(checkPitch && pitchOk && !durOk){
      lines.push(label + 'dobra wysokość dźwięku! Ale spróbuj innej wartości rytmicznej.');
    }else{
      lines.push(label + 'jeszcze nie ta wartość rytmiczna — spróbuj ponownie.');
    }
  });

  if(allCorrect){
    feedback.textContent = lines.join('  ');
    feedback.className = 'feedback-msg ok';
    score++;
    document.getElementById('scoreVal').textContent = score;
    setTimeout(nextRound, 900);
  }else{
    feedback.innerHTML = lines.join('<br>');
    feedback.className = 'feedback-msg bad';
  }
}

function nextRound(){
  round++;
  document.getElementById('feedbackMsg').textContent = '';
  document.getElementById('feedbackMsg').className = 'feedback-msg';
  if(round >= TOTAL_ROUNDS){ showWin(); return; }
  pickTask();
  document.getElementById('taskText').innerHTML = buildTaskText();
  renderPalette();
  renderStaff();
  updateCheckBtn();
}

function showWin(){
  document.getElementById('winText').textContent =
    'Wynik: ' + score + ' / ' + TOTAL_ROUNDS + ' — ' +
    (score === TOTAL_ROUNDS ? 'komplet! 🌟' : score >= TOTAL_ROUNDS*0.7 ? 'bardzo dobrze!' : 'ćwicz dalej!');
  document.getElementById('winOverlay').classList.add('show');
}

function restartGame(){
  round = 0; score = 0;
  document.getElementById('scoreVal').textContent = '0';
  document.getElementById('winOverlay').classList.remove('show');
  nextRound();
}

document.getElementById('totalVal').textContent = TOTAL_ROUNDS;
document.querySelector('#focusRow .mode-btn[data-focus="'+focusMode+'"]').classList.add('active');
restartGame();
</script>
</body>
</html>
