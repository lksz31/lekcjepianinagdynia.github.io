<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asystent Ćwiczeń – Łukasz Ganczarek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#d4af37;--navy:#1e3a8a;--green:#16a34a;--red:#dc2626;--border:#e2e8f0;--text:#334155;--bg:#f8fafc;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);font-family:'Poppins',sans-serif;color:var(--text);min-height:100vh;}

/* NAV */
.site-nav{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,0.92);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:50px;padding:10px 30px;display:flex;gap:25px;z-index:1000;box-shadow:0 5px 20px rgba(0,0,0,0.08);font-size:0.85rem;font-weight:600;white-space:nowrap;}
.site-nav a{color:var(--navy);text-decoration:none;transition:0.3s;}
.site-nav a:hover{color:var(--gold);}
.site-nav a.nav-highlight{background:var(--navy);color:white;padding:4px 16px;border-radius:50px;font-size:0.8rem;}
@media(max-width:700px){.site-nav{display:none;}}
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,0.97);backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:8px 0 env(safe-area-inset-bottom,8px);z-index:1000;box-shadow:0 -5px 20px rgba(0,0,0,0.08);}
.mobile-nav-inner{display:flex;justify-content:space-around;align-items:center;}
.mobile-nav a{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:#94a3b8;font-size:0.57rem;font-weight:600;gap:3px;transition:0.2s;flex:1;max-width:72px;}
.mobile-nav a .mn-icon{font-size:1.15rem;}
.mobile-nav a:hover,.mobile-nav a.active{color:var(--navy);}
.mobile-nav a.mn-cta{background:var(--navy);color:white!important;padding:7px 10px;border-radius:50px;flex-direction:row;gap:4px;font-size:0.65rem;max-width:none;flex:none;}
@media(max-width:700px){.mobile-nav{display:block;}body{padding-bottom:68px;}}

/* LAYOUT */
.app{max-width:1100px;margin:0 auto;padding:100px 16px 60px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.screen{animation:fadeIn 0.35s ease;}

/* CARDS */
.card{background:white;border-radius:24px;border:1px solid var(--border);box-shadow:0 4px 24px rgba(0,0,0,0.06);padding:28px;}
.card-sm{background:white;border-radius:16px;border:1px solid var(--border);box-shadow:0 2px 12px rgba(0,0,0,0.05);padding:18px;}

/* TYPOGRAPHY */
.page-title{font-family:'Playfair Display',serif;font-size:clamp(1.6rem,4vw,2.4rem);color:var(--navy);margin-bottom:8px;}
.page-sub{color:#64748b;font-size:0.95rem;line-height:1.7;max-width:600px;}
.label{font-size:0.68rem;font-weight:800;text-transform:uppercase;letter-spacing:0.1em;color:#94a3b8;margin-bottom:6px;}
.badge{display:inline-block;padding:4px 14px;border-radius:50px;font-size:0.72rem;font-weight:800;text-transform:uppercase;letter-spacing:0.08em;}
.badge-gold{background:#fef9e7;color:#92710a;border:1px solid #fde68a;}
.badge-navy{background:#eff6ff;color:var(--navy);border:1px solid #bfdbfe;}
.badge-green{background:#dcfce7;color:#15803d;border:1px solid #86efac;}
.badge-purple{background:#faf5ff;color:#7c3aed;border:1px solid #e9d5ff;}

/* BUTTONS */
.btn{padding:12px 28px;border-radius:50px;font-family:'Poppins',sans-serif;font-weight:700;font-size:0.88rem;border:none;cursor:pointer;transition:all 0.2s;display:inline-flex;align-items:center;gap:8px;}
.btn-primary{background:var(--navy);color:white;}
.btn-primary:hover{background:#1e40af;transform:translateY(-1px);}
.btn-gold{background:var(--gold);color:#1a1a2e;}
.btn-gold:hover{background:#c9a227;transform:translateY(-1px);}
.btn-outline{background:white;color:var(--navy);border:2px solid var(--navy);}
.btn-outline:hover{background:#f0f7ff;}
.btn-ghost{background:transparent;color:#64748b;border:1px solid var(--border);}
.btn-ghost:hover{background:#f8fafc;color:var(--navy);}
.btn-green{background:#16a34a;color:white;}
.btn-green:hover{background:#15803d;transform:translateY(-1px);}
.btn-red{background:var(--red);color:white;}
.btn-red:hover{background:#b91c1c;}
.btn-big{padding:18px 40px;font-size:1rem;border-radius:60px;box-shadow:0 6px 24px rgba(30,58,138,0.25);}
.btn:disabled{opacity:0.4;cursor:not-allowed;transform:none!important;}

/* GRID */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
@media(max-width:600px){.grid-2{grid-template-columns:1fr;}.grid-3{grid-template-columns:1fr;}}

/* OPTION TILE */
.opt-tile{background:white;border:2px solid var(--border);border-radius:16px;padding:16px 20px;cursor:pointer;transition:all 0.2s;text-align:left;}
.opt-tile:hover{border-color:var(--navy);background:#f0f7ff;}
.opt-tile.selected{border-color:var(--navy);background:#f0f7ff;box-shadow:0 0 0 3px rgba(30,58,138,0.12);}
.opt-tile h4{font-family:'Playfair Display',serif;color:var(--navy);font-size:1rem;margin:4px 0 6px;}
.opt-tile p{font-size:0.8rem;color:#64748b;line-height:1.5;}

/* PROGRESS BAR */
.prog-bar-wrap{background:#e2e8f0;border-radius:20px;height:10px;overflow:hidden;margin:6px 0;}
.prog-bar-fill{height:100%;border-radius:20px;transition:width 1s linear;}

/* TIMER */
.timer-ring-wrap{position:relative;width:120px;height:120px;flex-shrink:0;}
.timer-ring-wrap svg{transform:rotate(-90deg);}
.timer-ring-wrap .timer-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.timer-mm{font-size:1.6rem;font-weight:800;color:var(--navy);line-height:1;font-family:'Playfair Display',serif;}
.timer-label{font-size:0.6rem;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:0.08em;}

/* PHASE BAR */
.phase-bar{display:flex;gap:6px;margin-bottom:24px;}
.phase-seg{flex:1;height:6px;border-radius:10px;background:#e2e8f0;transition:background 0.4s;}
.phase-seg.done{background:var(--green);}
.phase-seg.active{background:var(--navy);}

/* SESSION HEADER */
.sess-header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
.sess-title{font-family:'Playfair Display',serif;font-size:1.5rem;color:var(--navy);}
.sess-controls{display:flex;gap:8px;align-items:center;}

/* EXERCISE CARD */
.ex-card{background:white;border-radius:20px;border:1px solid var(--border);box-shadow:0 4px 20px rgba(0,0,0,0.07);padding:24px;margin-bottom:16px;}
.ex-card .ex-type{font-size:0.67rem;font-weight:800;text-transform:uppercase;letter-spacing:0.12em;color:#94a3b8;margin-bottom:6px;}
.ex-card .ex-title{font-family:'Playfair Display',serif;font-size:1.4rem;color:var(--navy);margin-bottom:8px;}
.ex-card .ex-desc{font-size:0.9rem;color:#475569;line-height:1.7;}
.ex-card .ex-repeat{display:inline-block;background:#fef9e7;color:#92710a;border:1px solid #fde68a;border-radius:50px;padding:5px 16px;font-size:0.78rem;font-weight:700;margin-top:10px;}
.ex-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}

/* IFRAME WRAP */
.iframe-wrap{border-radius:16px;overflow:hidden;border:1px solid var(--border);box-shadow:0 4px 20px rgba(0,0,0,0.08);background:white;width:100%;height:600px;}
.iframe-wrap iframe{width:100%;height:100%;border:none;display:block;}

/* NEXT PHASE BUTTON */
.next-phase-wrap{display:flex;justify-content:flex-end;margin-top:24px;}
.next-phase-btn{padding:20px 48px;font-size:1.05rem;border-radius:60px;background:var(--navy);color:white;border:none;font-family:'Poppins',sans-serif;font-weight:800;cursor:pointer;transition:all 0.25s;box-shadow:0 8px 32px rgba(30,58,138,0.28);display:flex;align-items:center;gap:10px;animation:pulsebtn 2.5s infinite;}
.next-phase-btn:hover{background:var(--gold);color:#1a1a2e;transform:translateY(-2px);}
@keyframes pulsebtn{0%{box-shadow:0 0 0 0 rgba(30,58,138,0.4);}70%{box-shadow:0 0 0 14px rgba(30,58,138,0);}100%{box-shadow:0 0 0 0 rgba(30,58,138,0);}}

/* LOGIN INFO BANNER */
.info-banner{background:linear-gradient(135deg,#0f172a,#1e3a8a);border-radius:20px;padding:22px 24px;color:white;display:flex;gap:16px;align-items:flex-start;margin-bottom:24px;}
.info-banner .ib-icon{font-size:1.8rem;flex-shrink:0;margin-top:2px;}
.info-banner h4{font-family:'Playfair Display',serif;font-size:1.05rem;color:var(--gold);margin-bottom:4px;}
.info-banner p{font-size:0.82rem;color:rgba(255,255,255,0.72);line-height:1.6;}

/* TIME PICKER */
.time-grid{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;}
.time-btn{padding:10px 20px;border-radius:50px;border:2px solid var(--border);background:white;color:var(--text);font-family:'Poppins',sans-serif;font-weight:700;font-size:0.88rem;cursor:pointer;transition:0.2s;}
.time-btn.selected{border-color:var(--navy);background:var(--navy);color:white;}
.time-custom{padding:10px 16px;border-radius:50px;border:2px solid var(--border);font-family:'Poppins',sans-serif;font-size:0.88rem;font-weight:700;width:120px;text-align:center;outline:none;}
.time-custom:focus{border-color:var(--navy);}

/* TOGGLE */
.toggle-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.toggle-sw{position:relative;width:38px;height:22px;flex-shrink:0;}
.toggle-sw input{opacity:0;width:0;height:0;}
.toggle-sl{position:absolute;cursor:pointer;inset:0;background:#cbd5e1;border-radius:20px;transition:0.3s;}
.toggle-sl:before{content:'';position:absolute;height:16px;width:16px;left:3px;bottom:3px;background:white;border-radius:50%;transition:0.3s;}
.toggle-sw input:checked+.toggle-sl{background:var(--navy);}
.toggle-sw input:checked+.toggle-sl:before{transform:translateX(16px);}
.toggle-lbl{font-size:0.82rem;font-weight:600;color:var(--text);}

/* SUMMARY */
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:20px 0;}
.summary-item{background:white;border-radius:14px;border:1px solid var(--border);padding:16px;text-align:center;}
.summary-item .si-num{font-family:'Playfair Display',serif;font-size:1.8rem;font-weight:700;color:var(--navy);}
.summary-item .si-lbl{font-size:0.72rem;color:#94a3b8;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;margin-top:2px;}

/* PHASE LIST */
.phase-list{list-style:none;padding:0;}
.phase-list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:0.88rem;color:#475569;}
.phase-list li:last-child{border-bottom:none;}
.phase-list .pl-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}

/* RANGE INPUT */
input[type=range]{accent-color:var(--navy);cursor:pointer;height:6px;}

/* CLEF PICKER */
.clef-btn{padding:8px 18px;border-radius:50px;border:2px solid var(--border);background:white;font-family:'Poppins',sans-serif;font-weight:700;font-size:0.82rem;cursor:pointer;transition:0.2s;color:var(--text);}
.clef-btn.sel{border-color:var(--navy);background:var(--navy);color:white;}
</style>
</head>

<script>
const WEBHOOK_MATERIALS = "https://hook.eu1.make.com/q71o8tfhdg3pj1nwe21t16dbkhoms4ye";
const WEBHOOK_PRACTICE  = "https://hook.eu1.make.com/PLACEHOLDER_PRACTICE_WEBHOOK";

/* ═══════════════════════════════════════════
   STATE
═══════════════════════════════════════════ */
const S = {
  mode: 'guest',       // 'guest' | 'student'
  studentPhone: '',
  studentName: '',

  totalMin: 45,
  hadWarmup: false,
  focusMode: 'balanced', // 'piece' | 'reading' | 'balanced'
  focusClef: 'both',   // 'treble' | 'bass' | 'both'

  // phase durations in seconds (recalculated)
  phases: [],          // [{id, label, color, durationSec, icon}]
  currentPhase: 0,

  // timer
  timerSec: 0,
  timerMax: 0,
  timerRunning: false,
  timerInterval: null,

  // exercise
  exSkipped: 0,
  exDone: 0,
  sessionStart: null,

  // pause
  pausedAt: null,
};

/* ═══════════════════════════════════════════
   EXERCISES DATABASE
═══════════════════════════════════════════ */
const WARMUP_EXERCISES = [
  {title:"Gamy w ruchu prostym",desc:"Zagraj gamę C-dur obiema rękami w ruchu prostym, wolnym tempem. Dbaj o równomierne uderzenia i luźne nadgarstki.",repeat:"Powtórz 3 razy w górę i w dół"},
  {title:"Palcowanie 1-2-3-1-2-3-4-5",desc:"Ćwicz samo palcowanie bez klawiszy — kolejno na stole lub kolanie. Każdy palec ląduje pewnie i niezależnie.",repeat:"Powtórz 10 razy na każdą rękę"},
  {title:"Ćwiczenie Hanona nr 1",desc:"Pierwsze ćwiczenie Hanona w tempie ♩=60. Skupiaj się na równości rytmicznej, nie na szybkości.",repeat:"Powtórz 4 razy"},
  {title:"Glissando chromantyczne",desc:"Glissando od C do C przez wszystkie półtony, prawą ręką, pianissimo. Luźny nadgarstek, dotyk opuszki.",repeat:"Powtórz 5 razy"},
  {title:"Rozciąganie interwałów",desc:"Graj tercje, kwarty, kwinty prawą ręką płynnie w górę i w dół w gamie C-dur. Nie napinaj dłoni.",repeat:"Powtórz 3 razy każdy interwał"},
  {title:"Legato–staccato",desc:"Zagraj dowolną gamę — 4 nuty legato, 4 nuty staccato, naprzemiennie. Wyraźna różnica artykulacji.",repeat:"Powtórz 5 razy"},
  {title:"Tryle na 2–3 i 3–4",desc:"Trel ćwierćnutowy na parze palców 2–3, potem 3–4 w miejscu. Równe, szybkie ruchy z nadgarstka.",repeat:"Po 30 sekund na każdą parę"},
  {title:"Akord C–F–G–C",desc:"Zagraj akord w lewej ręce: C, F, G, C kolejno, spokojnym tempem. Słuchaj brzmienia każdego akordu.",repeat:"Powtórz 6 razy"},
  {title:"Tremolo oktawowe",desc:"Tremolo lewą ręką między C i wyższym C, spokojnie i równo. Rozluźnij ramię.",repeat:"3 serie po 15 sekund"},
  {title:"Ćwiczenie artykulacyjne z metronome",desc:"Ustaw metronom na 60. Graj ósemki prawą ręką — co 4 nuty zmiana artykulacji (legato → staccato → portato).",repeat:"Powtórz przez cały czas rozgrzewki"},
];

const AVISTA_EXERCISES = [
  {title:"Melodia w kluczu wiolinowym",desc:"Na pięciolinii poniżej pojawi się krótki urywek melodyczny. Spróbuj zagrać go z pierwszego czytania, nie zatrzymując się.",repeat:"Zagraj 2 razy: raz powoli, raz w tempie"},
  {title:"Rytm z nut całych i półnut",desc:"Graj przykład zawierający tylko nuty całe i półnuty. Zwróć uwagę na metrum i miejsce kresek taktowych.",repeat:"Powtórz 3 razy"},
  {title:"Interwały melodyczne a vista",desc:"Rozpoznaj interwał między kolejnymi nutami zanim zagrasz — potem sprawdź grając.",repeat:"Zagraj wolno, rozpoznaj każdy interwał"},
  {title:"Czytanie rytmu z ósemkami",desc:"Krótki urywek z ósemkami w metrum 4/4. Przed graniem wyklaskaj rytm.",repeat:"Wyklaskaj, potem zagraj 3 razy"},
  {title:"A vista w kluczu basowym",desc:"Fragment melodyczny w kluczu basowym lewą ręką. Zidentyfikuj nuty zanim zagrasz.",repeat:"Zagraj 2 razy"},
  {title:"Dwugłos a vista",desc:"Dwa głosy jednocześnie w kluczu wiolinowym. Graj prawą ręką, traktując je jako melodię i kontrapunkt.",repeat:"Raz powoli, raz w sugerowanym tempie"},
  {title:"Fragment z znakami przypadkowymi",desc:"Melodia zawiera znaki chromatyczne — krzyżyki lub bemole. Najpierw je zidentyfikuj, potem zagraj.",repeat:"Powtórz 2 razy"},
];

const PIECE_EXERCISES = [
  {title:"Fragment techniczny — powolne tempo",desc:"Wybierz najtrudniejszy takt lub frazę z Twojego aktualnego utworu. Graj bardzo wolno — każda nuta musi być czysta.",repeat:"Powtórz 10 razy bez błędu"},
  {title:"Ćwiczenie oddzielnych rąk",desc:"Zagraj trudny fragment najpierw samą prawą, potem samą lewą ręką. Upewnij się, że każda ręka zna swoją partię.",repeat:"5 razy każda ręka"},
  {title:"Łączenie rąk — wolne tempo",desc:"Połącz obie ręce w trudnym miejscu w tempie o 30% wolniejszym od docelowego.",repeat:"Powtórz 6 razy"},
  {title:"Praca nad frazowaniem",desc:"Zagraj całą frazę skupiając się wyłącznie na dynamice i frazowaniu — crescendo, decrescendo, kulminacja.",repeat:"3 razy z pełną uwagą na dynamikę"},
  {title:"Pamięciowe granie fragmentu",desc:"Zagraj wybrany fragment z pamięci, bez nut. Jeśli się zgubisz — wróć o takt wcześniej.",repeat:"Powtórz do 3 razy bez zaglądania w nuty"},
  {title:"Całość w wolnym tempie",desc:"Zagraj cały utwór od początku do końca w tempie o 50% wolniejszym. Nie zatrzymuj się przy błędach.",repeat:"Raz w wolnym tempie"},
  {title:"Całość w docelowym tempie",desc:"Zagraj utwór w docelowym tempie. Skup się na muzycznym wyrazie, a nie na poprawności technicznej.",repeat:"Raz w pełnym tempie"},
];

/* ═══════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════ */
const app = document.getElementById('app');
function render(html){ app.innerHTML = html; }
function fmtTime(sec){
  if(sec <= 0) return '0:00';
  const m = Math.floor(sec/60), s = sec%60;
  return m+':'+(s<10?'0':'')+s;
}
function fmtMin(sec){ return Math.round(sec/60)+' min'; }
function randFrom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function pickExercise(pool, usedTitles){
  const fresh = pool.filter(e=>!usedTitles.has(e.title));
  if(fresh.length) return randFrom(fresh);
  usedTitles.clear();
  return randFrom(pool);
}

/* ═══════════════════════════════════════════
   PHASE CONFIG
═══════════════════════════════════════════ */
function buildPhases(){
  const total = S.totalMin * 60;
  let pcts;
  if(S.hadWarmup){
    // no warmup — redistribute 30% equally
    if(S.focusMode==='piece')       pcts = {warmup:0, fiszki:15, avista:10, piece:75};
    else if(S.focusMode==='reading') pcts = {warmup:0, fiszki:25, avista:30, piece:45};
    else                             pcts = {warmup:0, fiszki:20, avista:20, piece:60};
  } else {
    if(S.focusMode==='piece')       pcts = {warmup:30, fiszki:10, avista:10, piece:50};
    else if(S.focusMode==='reading') pcts = {warmup:30, fiszki:20, avista:25, piece:25};
    else                             pcts = {warmup:30, fiszki:15, avista:15, piece:40};
  }
  S.phases = [
    !S.hadWarmup && {id:'warmup',  label:'Rozgrzewka',     icon:'🎯', color:'#f59e0b', durationSec:Math.round(total*pcts.warmup/100)},
    {id:'fiszki',  label:'Fiszki — nuty',     icon:'🎼', color:getComputedStyle(document.documentElement).getPropertyValue('--navy').trim()||'#1e3a8a', durationSec:Math.round(total*pcts.fiszki/100)},
    {id:'avista',  label:'A vista',            icon:'👁', color:'#7c3aed', durationSec:Math.round(total*pcts.avista/100)},
    {id:'piece',   label:'Utwór',              icon:'🎹', color:'#16a34a', durationSec:Math.round(total*pcts.piece/100)},
  ].filter(Boolean);
}

/* ═══════════════════════════════════════════
   SCREEN 1 — LANDING
═══════════════════════════════════════════ */
function screenLanding(){
  render(`
  <div class="screen">
    <div style="text-align:center;margin-bottom:32px;">

        <button class="btn btn-primary" onclick="loginStudent()" id="login-btn">Zaloguj</button>

function chooseMode(m){
  document.querySelectorAll('.opt-tile').forEach(t=>t.classList.remove('selected'));
  document.getElementById('tile-'+m).classList.add('selected');
  S.mode = m;
  document.getElementById('login-box').style.display = m==='student' ? 'block' : 'none';
  const wrap = document.getElementById('start-btn-wrap');
  if(m==='guest'){ wrap.style.display='block'; }
  else { wrap.style.display='none'; }
}

async function loginStudent(){
  const input = document.getElementById('phone-input');
  const msg = document.getElementById('login-msg');
  const btn = document.getElementById('login-btn');
  const cleaned = input.value.trim().replace(/\D/g,'');
  let tel = cleaned;
  if(cleaned.length===11&&cleaned.startsWith('48')) tel=cleaned.slice(2);
  if(tel.length<3){ msg.textContent='Wpisz prawidłowy kod dostępu.'; msg.style.color='#dc2626'; return; }
  btn.disabled=true; btn.textContent='...'; msg.textContent='Sprawdzam...'; msg.style.color='#64748b';
  try{
    const r = await fetch(WEBHOOK_MATERIALS,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({telefon:tel})});
    const d = await r.json();
    if(d.status==='ok'){
      S.mode='student'; S.studentPhone=tel;
      S.studentName = d.name||'';
      msg.textContent='✅ Witaj'+(S.studentName?' '+S.studentName:'')+'! Zalogowano.'; msg.style.color='#16a34a';
      document.getElementById('start-btn-wrap').style.display='block';
    } else {
      msg.textContent='Nieprawidłowy kod. Korzystaj jako gość lub skontaktuj się z Łukaszem, aby otrzymać dostęp.'; msg.style.color='#dc2626';
      btn.disabled=false; btn.textContent='Zaloguj';
    }
  } catch(e){ msg.textContent='Błąd połączenia.'; msg.style.color='#dc2626'; btn.disabled=false; btn.textContent='Zaloguj'; }
}

function setFocus(f){ S.focusMode=f; ['balanced','piece','reading'].forEach(id=>document.getElementById('focus-'+id).classList.toggle('selected',id===f)); updatePlanPreview(); }

function startSession(){

/* ═══════════════════════════════════════════
   SCREEN 3 — PHASE
═══════════════════════════════════════════ */
const usedExercises = new Set();
let currentEx = null;

function startPhase(idx){
  S.currentPhase = idx;
  const phase = S.phases[idx];
  S.timerSec = phase.durationSec;
  S.timerMax = phase.durationSec;
  S.timerRunning = false;
  clearInterval(S.timerInterval);
  usedExercises.clear();
  renderPhaseScreen();
  startTimer();
}

function renderPhaseScreen(){
  const phase = S.phases[S.currentPhase];
  const isLast = S.currentPhase >= S.phases.length-1;

  // Phase bar
  const phaseDots = S.phases.map((p,i)=>`
    <div class="phase-seg ${i<S.currentPhase?'done':i===S.currentPhase?'active':''}" title="${p.label}"></div>
  `).join('');

  // Phase-specific content
  let contentHtml = '';
  if(phase.id==='warmup') contentHtml = warmupContent();
  else if(phase.id==='fiszki') contentHtml = fiszkiContent();
  else if(phase.id==='avista') contentHtml = avistaContent();
  else if(phase.id==='piece') contentHtml = pieceContent();

  render(`
  <div class="screen">
    <!-- Phase bar -->
    <div class="phase-bar">${phaseDots}</div>

    <!-- Session header -->
    <div class="sess-header">
      <div>
        <div class="badge" style="background:${PHASE_COLORS[phase.id]||'#1e3a8a'}22;color:${PHASE_COLORS[phase.id]||'#1e3a8a'};border:1px solid ${PHASE_COLORS[phase.id]||'#1e3a8a'}44;margin-bottom:6px;">${phase.icon} ${phase.label}</div>
        <div class="sess-title">${phase.label}</div>
        <div style="font-size:0.8rem;color:#94a3b8;">Faza ${S.currentPhase+1} z ${S.phases.length} · ${fmtMin(S.timerMax)}</div>

        <!-- Ring timer -->
        <div class="timer-ring-wrap" id="timer-ring-wrap">
          <svg width="120" height="120" viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="52" fill="none" stroke="#e2e8f0" stroke-width="8"/>
            <circle cx="60" cy="60" r="52" fill="none" stroke="${PHASE_COLORS[phase.id]||'#1e3a8a'}" stroke-width="8"
              stroke-dasharray="${2*Math.PI*52}" stroke-dashoffset="${2*Math.PI*52*(1 - S.timerSec/S.timerMax)}"
              id="ring-fill" stroke-linecap="round" style="transition:stroke-dashoffset 1s linear;"/>
          </svg>
          <div class="timer-text">
            <span class="timer-mm" id="timer-disp">${fmtTime(S.timerSec)}</span>
            <span class="timer-label">pozostało</span>
          </div>

        <div class="sess-controls">
          <button class="btn btn-ghost" id="pause-btn" onclick="togglePause()" style="padding:10px 18px;">⏸ Pauza</button>

        </div>
      </div>
    </div>

    <!-- Content -->
    <div id="phase-content">${contentHtml}</div>

    <!-- Next phase button (hidden until time up or manual skip) -->
    <div class="next-phase-wrap" id="next-phase-wrap" style="display:none;">
      <button class="next-phase-btn" onclick="nextPhase()">
        ${isLast ? '🏁 Zakończ sesję' : 'Przejdź do: ' + (S.phases[S.currentPhase+1]?.label||'') + ' →'}

}
function avistaContent(){

}

function pickAndShowExercise(){
  const phase = S.phases[S.currentPhase];
  let pool;
  if(phase.id==='warmup') pool = WARMUP_EXERCISES;
  else if(phase.id==='avista') pool = AVISTA_EXERCISES;
  else pool = PIECE_EXERCISES;

  currentEx = pickExercise(pool, usedExercises);
  usedExercises.add(currentEx.title);

  const area = document.getElementById('ex-area');
  if(!area) return;
  area.innerHTML = `
  <div class="ex-card">
    <div class="ex-type">${phase.icon} ${phase.label} — ćwiczenie</div>
    <div class="ex-title">${currentEx.title}</div>
    <div class="ex-desc">${currentEx.desc}</div>
    <div class="ex-repeat">🔁 ${currentEx.repeat}</div>
    <div class="ex-actions">
      <button class="btn btn-green" onclick="markDone()">✓ Zrobione</button>
      <button class="btn btn-ghost" onclick="skipExercise()">↩ Pomiń — daj inne</button>
    </div>
  </div>`;
}

function markDone(){
  S.exDone++;
  if(S.timerSec <= 0){ showNextPhaseBtn(); return; }
  pickAndShowExercise();
}

function skipExercise(){
  S.exSkipped++;
  if(S.timerSec <= 0){ showNextPhaseBtn(); return; }
  pickAndShowExercise();
}

/* ═══════════════════════════════════════════
   TIMER
═══════════════════════════════════════════ */
function startTimer(){
  S.timerRunning = true;
  clearInterval(S.timerInterval);
  S.timerInterval = setInterval(()=>{
    if(!S.timerRunning) return;
    S.timerSec--;
    updateTimerUI();
    if(S.timerSec <= 0){
      clearInterval(S.timerInterval);
      onPhaseTimeUp();
    }
  }, 1000);
}

function updateTimerUI(){
  const disp = document.getElementById('timer-disp');
  const ring = document.getElementById('ring-fill');
  if(disp) disp.textContent = fmtTime(S.timerSec);
  if(ring){
    const r = 52, circ = 2*Math.PI*r;
    const pct = Math.max(0, S.timerSec / S.timerMax);
    ring.style.strokeDashoffset = circ*(1-pct);
    if(S.timerSec<=60) ring.style.stroke='#ef4444';
  }
  if(disp&&S.timerSec<=60) disp.style.color='#ef4444';
}

function togglePause(){
  S.timerRunning = !S.timerRunning;
  const btn = document.getElementById('pause-btn');
  if(btn) btn.textContent = S.timerRunning ? '⏸ Pauza' : '▶ Wznów';
}

function onPhaseTimeUp(){
  showNextPhaseBtn();
  // Flash end message
  const area = document.getElementById('ex-area');
  if(area){
    const msg = document.createElement('div');
    msg.style.cssText='background:#dcfce7;border:1px solid #86efac;border-radius:14px;padding:14px 20px;margin-bottom:12px;font-weight:700;color:#15803d;font-size:0.9rem;';
    msg.textContent = '✅ Czas na tę fazę minął — możesz przejść dalej!';
    area.prepend(msg);
  }
}

function showNextPhaseBtn(){
  const wrap = document.getElementById('next-phase-wrap');
  if(wrap) wrap.style.display='flex';
  clearInterval(S.timerInterval);
}

function confirmEndPhase(){
  if(S.timerSec > 30){
    if(!confirm('Na pewno chcesz pominąć tę fazę? Zostało jeszcze '+fmtTime(S.timerSec)+'.')) return;
  }
  clearInterval(S.timerInterval);
  showNextPhaseBtn();
}

function nextPhase(){
  clearInterval(S.timerInterval);
  const next = S.currentPhase+1;
  if(next >= S.phases.length) screenSummary();
  else startPhase(next);
}

/* ═══════════════════════════════════════════
   SAVE TO WEBHOOK (student only)
═══════════════════════════════════════════ */
function saveSessionStart(){
  fetch(WEBHOOK_PRACTICE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    event:'session_start',telefon:S.studentPhone,totalMin:S.totalMin,
    focusMode:S.focusMode,focusClef:S.focusClef,hadWarmup:S.hadWarmup,
    timestamp:new Date().toISOString(),phases:S.phases.map(p=>({id:p.id,label:p.label,durationMin:Math.round(p.durationSec/60)}))
  })}).catch(()=>{});
}
function saveSessionEnd(totalSec){
  fetch(WEBHOOK_PRACTICE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    event:'session_end',telefon:S.studentPhone,totalSec,
    exDone:S.exDone,exSkipped:S.exSkipped,timestamp:new Date().toISOString()
  })}).catch(()=>{});
