<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiszki Nutowe – Łukasz Ganczarek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #d4af37;
    --navy: #1e3a8a;
    --blue: #3b82f6;
    --border: #f0f0f0;
    --text: #334155;
  }
 
  * { box-sizing: border-box; margin: 0; padding: 0; }
 
  body {
    background: #f8fafc;
    font-family: 'Poppins', sans-serif;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
 
  /* NAV */
  .site-nav {
    position: fixed; top: 20px; left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 10px 30px;
    display: flex; gap: 25px;
    z-index: 1000;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    font-size: 0.85rem; font-weight: 600;
    white-space: nowrap;
  }
  .site-nav a { color: var(--navy); text-decoration: none; transition: 0.3s; }
  .site-nav a:hover { color: var(--gold); }
  .site-nav a.nav-highlight {
    background: var(--navy); color: white;
    padding: 4px 16px; border-radius: 50px; font-size: 0.8rem;
  }
  @media (max-width: 700px) { .site-nav { display: none; } }
 
  /* MAIN */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 120px 20px 60px;
    gap: 32px;
  }
 
  .page-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 4vw, 2.8rem);
    color: var(--navy);
    text-align: center;
  }
  .page-title em { color: var(--gold); font-style: italic; }
 
  /* CONTROLS */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    background: white;
    padding: 16px 24px;
    border-radius: 50px;
    border: 1px solid var(--border);
    box-shadow: 0 5px 20px rgba(0,0,0,0.06);
  }
 
  .ctrl-group {
    display: flex;
    gap: 6px;
    align-items: center;
  }
 
  .ctrl-label {
    font-size: 0.75rem;
    font-weight: 700;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-right: 4px;
  }
 
  .ctrl-btn {
    padding: 8px 18px;
    border-radius: 50px;
    border: 2px solid var(--navy);
    background: white;
    color: var(--navy);
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
    font-size: 0.8rem;
    font-family: 'Poppins', sans-serif;
  }
  .ctrl-btn.active { background: var(--navy); color: white; }
  .ctrl-btn:hover:not(.active) { background: #f0f7ff; }
 
  .divider {
    width: 1px; height: 30px;
    background: #e2e8f0;
  }
 
  /* CARD */
  .card {
    background: white;
    border-radius: 32px;
    padding: 40px;
    border: 1px solid var(--border);
    box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    width: 100%;
    max-width: 560px;
    animation: fadeIn 0.4s ease;
  }
 
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
 
  /* STAFF — SVG pięciolinia */
  .staff-wrapper {
    width: 100%;
    position: relative;
  }
 
  canvas#staffCanvas {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 16px;
  }
 
  /* NOTE NAME */
  .note-reveal {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
 
  .note-name-box {
    font-family: 'Playfair Display', serif;
    font-size: 2.5rem;
    color: var(--navy);
    font-weight: 700;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.3s;
  }
 
  .note-name-box.hidden { opacity: 0; }
 
  .reveal-btn {
    background: transparent;
    border: 2px solid var(--navy);
    color: var(--navy);
    padding: 8px 24px;
    border-radius: 50px;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 0.8rem;
    cursor: pointer;
    transition: 0.2s;
  }
  .reveal-btn:hover { background: var(--navy); color: white; }
 
  /* DRAW BUTTON */
  .draw-btn {
    background: var(--navy);
    color: white;
    padding: 16px 48px;
    border-radius: 50px;
    font-family: 'Poppins', sans-serif;
    font-weight: 800;
    font-size: 1rem;
    border: none;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 8px 24px rgba(30,58,138,0.25);
    animation: pulse 2s infinite;
  }
  .draw-btn:hover { background: var(--gold); transform: translateY(-2px); }
 
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(30,58,138,0.4); }
    70%  { box-shadow: 0 0 0 12px rgba(30,58,138,0); }
    100% { box-shadow: 0 0 0 0 rgba(30,58,138,0); }
  }
 
  /* SCORE */
  .score-bar {
    display: flex;
    gap: 24px;
    font-size: 0.85rem;
    font-weight: 600;
    color: #64748b;
  }
  .score-bar span { color: var(--navy); font-weight: 800; }
 
  @media (max-width: 500px) {
    .card { padding: 24px 16px; }
    .controls { padding: 12px 16px; border-radius: 20px; }
  }
</style>
</head>
<body>
 
<nav class="site-nav">
  <a href="index.html">Strona główna</a>
  <a href="index.html#o-mnie">O mnie</a>
  <a href="index.html#oferta">Oferta</a>
  <a href="index.html#terminy">Terminy</a>
  <a href="fiszki.html" class="nav-highlight">Fiszki</a>
</nav>
 
<main class="main">
  <h1 class="page-title">Fiszki <em>nutowe</em></h1>
 
  <!-- CONTROLS -->
  <div class="controls">
    <span class="ctrl-label">Klucz</span>
    <div class="ctrl-group">
      <button class="ctrl-btn active" id="btn-treble" onclick="setClef('treble')">𝄞 Wiolinowy</button>
      <button class="ctrl-btn" id="btn-bass" onclick="setClef('bass')">𝄢 Basowy</button>
    </div>
    <div class="divider"></div>
    <span class="ctrl-label">Zakres</span>
    <div class="ctrl-group">
      <button class="ctrl-btn active" id="btn-small" onclick="setRange('small')">Mała + razkreślna</button>
      <button class="ctrl-btn" id="btn-full" onclick="setRange('full')">Pełny zakres</button>
    </div>
  </div>
 
  <!-- CARD -->
  <div class="card" id="card">
    <div class="staff-wrapper">
      <canvas id="staffCanvas" width="480" height="220"></canvas>
    </div>
    <div class="note-reveal">
      <div class="note-name-box hidden" id="noteName">—</div>
      <button class="reveal-btn" id="revealBtn" onclick="toggleReveal()">Pokaż nutę</button>
    </div>
  </div>
 
  <button class="draw-btn" onclick="drawNote()">🎲 Losuj nutę</button>
 
  <div class="score-bar">
    Wylosowanych: <span id="scoreCount">0</span>
  </div>
</main>
 
<script>
// ============================================================
// KONFIGURACJA NUT
// ============================================================
 
// Pozycje nut względem pięciolinii.
// Pozycja 0 = pierwsza linia od dołu, 1 = pierwsza przestrzeń itd.
// Każda jednostka = pół odległości między liniami (step)
 
// KLUCZ WIOLINOWY
// Linie (od dołu): E4, G4, B4, D5, F5
// Przestrzenie: F4, A4, C5, E5
const TREBLE_NOTES = [
  // 3 dodana dolna linia (C4) i poniżej
  { name: 'C4', label: 'c¹', pos: -2 }, // linia dodana dolna 1 (c razkreślne)
  { name: 'D4', label: 'd¹', pos: -1 },
  { name: 'E4', label: 'e¹', pos: 0  }, // linia 1
  { name: 'F4', label: 'f¹', pos: 1  },
  { name: 'G4', label: 'g¹', pos: 2  }, // linia 2
  { name: 'A4', label: 'a¹', pos: 3  },
  { name: 'B4', label: 'h¹', pos: 4  }, // linia 3
  { name: 'C5', label: 'c²', pos: 5  },
  { name: 'D5', label: 'd²', pos: 6  }, // linia 4
  { name: 'E5', label: 'e²', pos: 7  },
  { name: 'F5', label: 'f²', pos: 8  }, // linia 5
  { name: 'G5', label: 'g²', pos: 9  },
  { name: 'A5', label: 'a²', pos: 10 }, // linia dodana górna 1
  { name: 'B5', label: 'h²', pos: 11 },
  { name: 'C6', label: 'c³', pos: 12 }, // linia dodana górna 2
];
 
// KLUCZ BASOWY
// Linie (od dołu): G2, B2, D3, F3, A3
const BASS_NOTES = [
  { name: 'B1', label: 'H',  pos: -2 }, // linia dodana dolna 1
  { name: 'C2', label: 'c',  pos: -1 },
  { name: 'D2', label: 'd',  pos: 0  }, // linia 1
  { name: 'E2', label: 'e',  pos: 1  },
  { name: 'F2', label: 'f',  pos: 2  }, // linia 2
  { name: 'G2', label: 'g',  pos: 3  },
  { name: 'A2', label: 'a',  pos: 4  }, // linia 3
  { name: 'B2', label: 'h',  pos: 5  },
  { name: 'C3', label: 'c¹', pos: 6  }, // linia 4
  { name: 'D3', label: 'd¹', pos: 7  },
  { name: 'E3', label: 'e¹', pos: 8  }, // linia 5
  { name: 'F3', label: 'f¹', pos: 9  },
  { name: 'G3', label: 'g¹', pos: 10 }, // linia dodana górna 1
  { name: 'A3', label: 'a¹', pos: 11 },
  { name: 'B3', label: 'h¹', pos: 12 }, // linia dodana górna 2
];
 
// Zakres "mała + razkreślna" dla klucza wiolinowego: C4–C6 (pos -2 do 12)
// Zakres "mały" dla klucza wiolinowego: C4–B4 (pos -2 do 4) + C5–B5 (pos 5-11)
// Dla klucza basowego odpowiednio
 
const TREBLE_SMALL = TREBLE_NOTES; // wszystkie mieszczą się w zakresie
const TREBLE_FULL  = TREBLE_NOTES; // można rozszerzyć
 
const BASS_SMALL = BASS_NOTES;
const BASS_FULL  = BASS_NOTES;
 
// ============================================================
// STAN
// ============================================================
let clef      = 'treble';
let range     = 'small';
let revealed  = false;
let count     = 0;
let currentNote = null;
 
// ============================================================
// RYSOWANIE PIĘCIOLINII
// ============================================================
function drawStaff(note) {
  const canvas = document.getElementById('staffCanvas');
  const ctx    = canvas.getContext('2d');
  const W      = canvas.width;
  const H      = canvas.height;
 
  ctx.clearRect(0, 0, W, H);
 
  // Tło
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.roundRect(0, 0, W, H, 16);
  ctx.fill();
 
  // Parametry pięciolinii
  const step      = 18;   // odległość między liniami
  const lineStart = 60;   // x start linii
  const lineEnd   = W - 60;
  const staffTop  = H / 2 - step * 2; // y pierwszej linii od góry (linia 5)
  // Linie pięciolinii: 5 linii, linia 1 = staffTop + 4*step (najniższa)
  // Pozycja 0 = linia 1 (najniższa), pos 2 = linia 2 itd.
 
  // Funkcja: przelicz pozycję nuty na współrzędną Y
  // pos=0 → linia 1 (dół), pos=8 → linia 5 (góra)
  // każda jednostka = step/2 (pół kroku)
  const noteY = (pos) => {
    const line1Y = staffTop + 4 * step;
    return line1Y - pos * (step / 2);
  };
 
  // Rysuj 5 linii
  ctx.strokeStyle = '#1e3a8a';
  ctx.lineWidth   = 1.5;
  for (let i = 0; i < 5; i++) {
    const y = staffTop + i * step;
    ctx.beginPath();
    ctx.moveTo(lineStart, y);
    ctx.lineTo(lineEnd, y);
    ctx.stroke();
  }
 
  // Kreska na początku
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(lineStart, staffTop);
  ctx.lineTo(lineStart, staffTop + 4 * step);
  ctx.stroke();
 
  // Klucz
  ctx.font = clef === 'treble' ? '72px serif' : '60px serif';
  ctx.fillStyle = '#1e3a8a';
  ctx.textBaseline = 'middle';
 
  if (clef === 'treble') {
    ctx.fillText('𝄞', lineStart + 6, staffTop + 2.2 * step);
  } else {
    ctx.fillText('𝄢', lineStart + 6, staffTop + 1.5 * step);
  }
 
  if (!note) return;
 
  // ── Rysuj nutę ──
  const nx   = W / 2 + 20;
  const ny   = noteY(note.pos);
  const rx   = step * 0.72;
  const ry   = step * 0.52;
 
  // Linie dodane (ledger lines)
  ctx.strokeStyle = '#1e3a8a';
  ctx.lineWidth   = 1.5;
  const ledgerW   = rx * 2.4;
 
  // Dolne linie dodane (pos < 0)
  if (note.pos < 0) {
    for (let p = -2; p >= note.pos; p -= 2) {
      const ly = noteY(p);
      ctx.beginPath();
      ctx.moveTo(nx - ledgerW / 2, ly);
      ctx.lineTo(nx + ledgerW / 2, ly);
      ctx.stroke();
    }
  }
 
  // Górne linie dodane (pos > 8)
  if (note.pos > 8) {
    for (let p = 10; p <= note.pos; p += 2) {
      const ly = noteY(p);
      ctx.beginPath();
      ctx.moveTo(nx - ledgerW / 2, ly);
      ctx.lineTo(nx + ledgerW / 2, ly);
      ctx.stroke();
    }
  }
 
  // Główka nuty (elipsa, lekko pochylona)
  ctx.save();
  ctx.translate(nx, ny);
  ctx.rotate(-0.25);
  ctx.fillStyle   = '#1e3a8a';
  ctx.beginPath();
  ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
 
  // Laska nuty
  const stemX    = nx + rx - 1;
  const stemDir  = note.pos >= 4 ? 1 : -1; // w dół jeśli wysoko, w górę jeśli nisko
  const stemLen  = step * 3.5;
  ctx.strokeStyle = '#1e3a8a';
  ctx.lineWidth   = 2;
  ctx.beginPath();
  ctx.moveTo(stemDir === -1 ? nx + rx - 1 : nx - rx + 1, ny);
  ctx.lineTo(stemDir === -1 ? nx + rx - 1 : nx - rx + 1, ny - stemDir * stemLen);
  ctx.stroke();
}
 
// ============================================================
// LOSOWANIE
// ============================================================
function getNotes() {
  const arr = clef === 'treble' ? TREBLE_NOTES : BASS_NOTES;
  if (range === 'small') {
    // Mała + razkreślna: pos od -2 do 11 (bez najwyższych linii dodanych)
    return arr.filter(n => n.pos >= -2 && n.pos <= 11);
  }
  return arr; // pełny zakres
}
 
function drawNote() {
  const notes = getNotes();
  const note  = notes[Math.floor(Math.random() * notes.length)];
  currentNote = note;
  revealed    = false;
  count++;
 
  document.getElementById('noteName').textContent = note.label;
  document.getElementById('noteName').classList.add('hidden');
  document.getElementById('revealBtn').textContent = 'Pokaż nutę';
  document.getElementById('scoreCount').textContent = count;
 
  drawStaff(note);
 
  // Animacja karty
  const card = document.getElementById('card');
  card.style.animation = 'none';
  card.offsetHeight;
  card.style.animation = 'fadeIn 0.35s ease';
}
 
function toggleReveal() {
  revealed = !revealed;
  const box = document.getElementById('noteName');
  const btn = document.getElementById('revealBtn');
  if (revealed) {
    box.classList.remove('hidden');
    btn.textContent = 'Ukryj nazwę';
  } else {
    box.classList.add('hidden');
    btn.textContent = 'Pokaż nutę';
  }
}
 
// ============================================================
// USTAWIENIA
// ============================================================
function setClef(c) {
  clef = c;
  document.getElementById('btn-treble').classList.toggle('active', c === 'treble');
  document.getElementById('btn-bass').classList.toggle('active', c === 'bass');
  if (currentNote) drawNote();
  else drawStaff(null);
}
 
function setRange(r) {
  range = r;
  document.getElementById('btn-small').classList.toggle('active', r === 'small');
  document.getElementById('btn-full').classList.toggle('active', r === 'full');
  if (currentNote) drawNote();
}
 
// ============================================================
// INIT
// ============================================================
drawStaff(null);
</script>
</body>
</html>
