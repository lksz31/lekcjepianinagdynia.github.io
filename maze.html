<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Muzyczny Labirynt</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Crimson+Text:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0a120a;font-family:'Cinzel',serif;overflow:hidden;height:100vh;display:flex;flex-direction:column;}

/* ── CHARACTER SELECT SCREEN ── */
#char-screen{
  position:fixed;inset:0;z-index:100;
  background:radial-gradient(ellipse at 50% 30%,#1a2d1a,#050a05);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
}
#char-screen h1{
  font-size:clamp(1.2rem,4vw,2rem);font-weight:900;
  color:#d4af37;letter-spacing:.25em;
  text-shadow:0 0 20px rgba(212,175,55,.6),0 0 60px rgba(212,175,55,.2);
  text-align:center;
}
#char-screen .subtitle{
  font-family:'Crimson Text',serif;font-size:.9rem;
  color:#6a7a4a;letter-spacing:.15em;margin-top:-18px;
}
.char-grid{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;}
.char-card{
  width:160px;cursor:pointer;
  background:rgba(0,0,0,.4);
  border:2px solid #2a3a1a;
  border-radius:8px;padding:16px 12px 12px;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  transition:border-color .2s,box-shadow .2s,transform .2s;
  position:relative;
}
.char-card:hover{
  border-color:#d4af37;
  box-shadow:0 0 24px rgba(212,175,55,.35);
  transform:translateY(-4px);
}
.char-card.selected{
  border-color:#d4af37;
  box-shadow:0 0 32px rgba(212,175,55,.5);
}
.char-card .char-img{
  width:90px;height:120px;object-fit:contain;
  image-rendering:pixelated;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,.8));
}
.char-card .char-name{
  font-size:.75rem;font-weight:700;color:#c8b87a;letter-spacing:.1em;text-align:center;
}
.char-card .char-desc{
  font-family:'Crimson Text',serif;font-size:.7rem;color:#5a6a4a;
  text-align:center;line-height:1.4;
}
.char-card .soon-badge{
  position:absolute;top:8px;right:8px;
  background:rgba(0,0,0,.6);border:1px solid #3a3a2a;
  color:#5a5a3a;font-size:.55rem;padding:2px 6px;border-radius:10px;
  letter-spacing:.1em;
}
.char-card.locked{opacity:.4;cursor:not-allowed;}
.char-card.locked:hover{transform:none;box-shadow:none;border-color:#2a3a1a;}
.start-btn{
  padding:12px 40px;background:transparent;
  border:2px solid #d4af37;color:#d4af37;
  font-family:'Cinzel',serif;font-size:.9rem;font-weight:700;
  letter-spacing:.2em;cursor:pointer;border-radius:3px;
  transition:.2s;opacity:0;pointer-events:none;
  text-transform:uppercase;
}
.start-btn.active{opacity:1;pointer-events:all;}
.start-btn:hover{background:#d4af37;color:#050a05;}
.ornament{color:#3a4a2a;font-size:1.2rem;letter-spacing:.5em;}

/* ── HUD ── */
#hdr{display:flex;align-items:center;gap:10px;padding:6px 12px;background:rgba(0,0,0,.7);border-bottom:2px solid #3a2a0a;flex-shrink:0;flex-wrap:wrap;}
h2.title{font-size:.9rem;font-weight:900;color:#d4af37;letter-spacing:.2em;white-space:nowrap;text-shadow:0 0 10px rgba(212,175,55,.5);}
.mpill{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.4);border:1px solid #2a3a1a;border-radius:50px;padding:3px 10px;}
.mdot{width:8px;height:8px;border-radius:50%;background:#333;transition:.07s;}
.mdot.on{background:#0f0;box-shadow:0 0 6px #0f0;}
.mdot.q{background:#336633;}
#mdet{font-size:.88rem;font-weight:700;color:#d4af37;min-width:20px;text-align:center;}
.vu{width:44px;height:3px;background:#111;border-radius:2px;overflow:hidden;}
.vuf{height:100%;width:0;background:linear-gradient(90deg,#2a6,#ff0,#f40);transition:width .05s;}
.leg{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.lk{font-size:.65rem;color:#8a7a4a;display:flex;align-items:center;gap:3px;}
.lk b{color:#d4af37;background:rgba(212,175,55,.1);border:1px solid #4a3a1a;border-radius:2px;padding:1px 4px;font-size:.68rem;}
.hbtn{padding:4px 11px;background:transparent;border:1px solid #4a3a1a;color:#8a7050;font-family:'Cinzel',serif;font-size:.68rem;cursor:pointer;border-radius:2px;transition:.2s;}
.hbtn:hover{border-color:#d4af37;color:#d4af37;}

/* ── GAME AREA ── */
#ga{flex:1;position:relative;overflow:hidden;background:#0a120a;display:flex;align-items:center;justify-content:center;}
#mc{display:block;image-rendering:pixelated;}

/* ── PLAYER SPRITE ── */
#pl{
  position:absolute;
  width:1px;height:1px;
  transform:translate(-50%,-50%);
  transition:left .16s cubic-bezier(.4,0,.2,1),top .16s cubic-bezier(.4,0,.2,1);
  z-index:10;pointer-events:none;
}
#pl img{
  position:absolute;
  transform:translate(-50%,-75%);
  image-rendering:pixelated;
  filter:drop-shadow(0 2px 8px rgba(0,0,0,.9)) drop-shadow(0 0 12px rgba(255,200,50,.3));
}
@keyframes pg{0%,100%{filter:drop-shadow(0 2px 8px rgba(0,0,0,.9)) drop-shadow(0 0 8px rgba(255,200,50,.25));}50%{filter:drop-shadow(0 2px 8px rgba(0,0,0,.9)) drop-shadow(0 0 18px rgba(255,200,50,.7));}}
#pl img{animation:pg 1.8s ease-in-out infinite;}

/* ── GOAL ── */
#gm{position:absolute;font-size:1px;width:1px;height:1px;transform:translate(-50%,-50%);z-index:9;pointer-events:none;}
#gm::after{content:'⭐';font-size:20px;position:absolute;transform:translate(-50%,-50%);}
@keyframes sp{from{transform:translate(-50%,-50%) rotate(0);}to{transform:translate(-50%,-50%) rotate(360deg);}}
#gm::after{animation:sp 3s linear infinite;}

/* ── WIN OVERLAY ── */
#wo{display:none;position:absolute;inset:0;background:rgba(0,0,0,.82);align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:50;backdrop-filter:blur(4px);}
#wo.show{display:flex;}
#wo h2{font-size:1.8rem;font-weight:900;color:#d4af37;text-shadow:0 0 28px rgba(212,175,55,.8);letter-spacing:.1em;text-align:center;}
.wb{padding:8px 24px;background:transparent;border:2px solid #d4af37;color:#d4af37;font-family:'Cinzel',serif;font-size:.78rem;font-weight:700;letter-spacing:.1em;cursor:pointer;border-radius:2px;transition:.2s;}
.wb:hover{background:#d4af37;color:#050a05;}
</style>
</head>
<body>

<!-- ── CHARACTER SELECT ── -->
<div id="char-screen">
  <div class="ornament">⚔ ✦ ⚔</div>
  <h1>Muzyczny Labirynt</h1>
  <p class="subtitle">Wybierz Bohatera</p>
  <div class="char-grid">

    <!-- Character 1 — available -->
    <div class="char-card" id="card-1" onclick="selectChar(1)">
      <img class="char-img" id="char-img-1" src="" alt="Odkrywca">
      <div class="char-name">Odkrywca</div>
      <div class="char-desc">Badacz dżungli z kompasem i plecakiem</div>
    </div>

    <!-- Character 2 — coming soon -->
    <div class="char-card locked" title="Wkrótce dostępny">
      <div class="char-img" style="display:flex;align-items:center;justify-content:center;font-size:2.5rem;color:#2a3a2a;">?</div>
      <div class="char-name" style="color:#3a4a3a;">Wojownik</div>
      <div class="char-desc" style="color:#2a3a2a;">Niedługo dostępny</div>
      <div class="soon-badge">WKRÓTCE</div>
    </div>

    <!-- Character 3 — coming soon -->
    <div class="char-card locked" title="Wkrótce dostępny">
      <div class="char-img" style="display:flex;align-items:center;justify-content:center;font-size:2.5rem;color:#2a3a2a;">?</div>
      <div class="char-name" style="color:#3a4a3a;">Mag</div>
      <div class="char-desc" style="color:#2a3a2a;">Niedługo dostępny</div>
      <div class="soon-badge">WKRÓTCE</div>
    </div>

  </div>
  <button class="start-btn" id="start-btn" onclick="startGame()">Rozpocznij przygodę</button>
  <div class="ornament">✦ ✦ ✦</div>
</div>

<!-- ── GAME ── -->
<div id="hdr" style="display:none;">
  <h2 class="title">⚔ Labirynt</h2>
  <div class="mpill">
    <div class="mdot" id="mdot"></div>
    <span id="mdet">—</span>
    <div class="vu"><div class="vuf" id="vuf"></div></div>
  </div>
  <div class="leg">
    <div class="lk"><b>c</b>↑</div>
    <div class="lk"><b>d</b>↓</div>
    <div class="lk"><b>e</b>←</div>
    <div class="lk"><b>f</b>→</div>
  </div>
  <button class="hbtn" onclick="newMaze()">🎲 Nowy</button>
  <button class="hbtn" onclick="backToSelect()">👤 Postać</button>
</div>
<div id="ga" style="display:none;">
  <canvas id="mc"></canvas>
  <div id="pl"><img id="pl-img" src="" alt="" style="width:36px;height:auto;"></div>
  <div id="gm"></div>
  <div id="wo">
    <h2>🏆 Dotarłeś<br>do celu!</h2>
    <button class="wb" onclick="newMaze()">🎲 Nowy labirynt</button>
    <button class="wb" onclick="backToSelect()">👤 Zmień postać</button>
  </div>
</div>

// ── TILE RENDERING ──
// DEAD tile (13.png): you can ONLY enter from the bottom (S side of the tile),
// meaning the tile has its S side open — player arrives from below going North,
// enters the tile through its South opening, cannot exit anywhere → dead end.
// Open sides: {S} only.
function tileRender(openSet){
  const s=[...openSet].sort().join('');
  const M={
    'EW'   :{i:'H',   r:0  },
    'NS'   :{i:'V',   r:0  },
    'EN'   :{i:'TR',  r:0  },
    'NW'   :{i:'TL',  r:0  },
    'ES'   :{i:'BR',  r:0  },
    'SW'   :{i:'BL',  r:0  },
    'ENS'  :{i:'TNE', r:0  },
    'ESW'  :{i:'TNE', r:90 },
    'NSW'  :{i:'TNE', r:180},
    'ENW'  :{i:'TNE', r:270},
    'ENSW' :{i:'X',   r:0  },
    // Dead ends — DEAD tile (13.png) enter from bottom → S open only
    // Rotate for other directions:
    'S'    :{i:'DEAD',r:0  },   // enter from bottom  (S open, tile faces up)
    'N'    :{i:'DEAD',r:180},   // enter from top     (N open)
    'E'    :{i:'DEAD',r:270},   // enter from right   (E open)
    'W'    :{i:'DEAD',r:90 },   // enter from left    (W open)
  };
  return M[s]||null;
}

const ROWS=10,COLS=10;
const WALLS=['WALL1','WALL2','WALL3','WALL4'];

function generateMaze(){
  const conn=Array.from({length:ROWS},()=>Array.from({length:COLS},()=>new Set()));
  const vis=Array.from({length:ROWS},()=>Array(COLS).fill(false));
  const DIRS=[['N',-1,0,'S'],['S',1,0,'N'],['E',0,1,'W'],['W',0,-1,'E']];
  function dfs(r,c){
    vis[r][c]=true;
    const dirs=[...DIRS].sort(()=>Math.random()-.5);
    for(const[d,dr,dc,rd]of dirs){
      const nr=r+dr,nc=c+dc;
      if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&!vis[nr][nc]){
        conn[r][c].add(d);conn[nr][nc].add(rd);dfs(nr,nc);
      }
    }
  }
  const sc=2+Math.floor(Math.random()*(COLS-4));
  dfs(0,sc);
  // goal: cell near centre with most connections
  let best=0,gr=Math.floor(ROWS/2),gc=Math.floor(COLS/2);
  for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){
    const r=Math.floor(ROWS/2)+dr,c=Math.floor(COLS/2)+dc;
    if(r>=0&&r<ROWS&&c>=0&&c<COLS&&conn[r][c].size>best){best=conn[r][c].size;gr=r;gc=c;}
  }
  return{conn,startR:0,startC:sc,goalR:gr,goalC:gc};
}

const canvas=document.getElementById('mc');
const ctx=canvas.getContext('2d');
let TILE=64,mazeData=null,won=false,playerR=0,playerC=0;
const imgs={};
let loaded=0;
const imgKeys=Object.keys(TB);
function loadTiles(cb){
  imgKeys.forEach(k=>{
    const img=new Image();
    img.onload=()=>{loaded++;if(loaded===imgKeys.length)cb();};
    img.src=TB[k];imgs[k]=img;
  });
}

let wallGrid=[];
function buildWallGrid(){
  wallGrid=Array.from({length:ROWS},()=>Array.from({length:COLS},()=>WALLS[Math.floor(Math.random()*WALLS.length)]));
}

function fitCanvas(){
  const ga=document.getElementById('ga');
  const W=ga.clientWidth,H=ga.clientHeight;
  TILE=Math.floor(Math.min(W/COLS,H/ROWS,80));
  canvas.width=TILE*COLS;canvas.height=TILE*ROWS;
}

function drawMaze(){
  if(!mazeData)return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#0a120a';ctx.fillRect(0,0,canvas.width,canvas.height);
  const{conn,goalR,goalC}=mazeData;
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const x=c*TILE,y=r*TILE;
      const op=conn[r][c];
      if(op.size===0){
        const wk=wallGrid[r][c];
        if(imgs[wk])ctx.drawImage(imgs[wk],x,y,TILE,TILE);
        continue;
      }
      const tr=tileRender(op);
      if(!tr)continue;
      const img=imgs[tr.i];if(!img)continue;
      ctx.save();ctx.translate(x+TILE/2,y+TILE/2);
      if(tr.r)ctx.rotate(tr.r*Math.PI/180);
      ctx.drawImage(img,-TILE/2,-TILE/2,TILE,TILE);
      ctx.restore();
    }
  }
  // goal glow overlay
  ctx.save();
  ctx.globalAlpha=.22+.13*Math.sin(Date.now()*.004);
  ctx.fillStyle='#d4af37';
  ctx.fillRect(goalC*TILE,goalR*TILE,TILE,TILE);
  ctx.globalAlpha=1;ctx.restore();
}

function posEl(el,r,c){
  const cr=canvas.getBoundingClientRect();
  const ar=document.getElementById('ga').getBoundingClientRect();
  el.style.left=(cr.left-ar.left+c*TILE+TILE/2)+'px';
  el.style.top =(cr.top -ar.top +r*TILE+TILE/2)+'px';
}
function updatePlayer(){posEl(document.getElementById('pl'),playerR,playerC);}
function updateGoal(){if(mazeData)posEl(document.getElementById('gm'),mazeData.goalR,mazeData.goalC);}

function move(dir){
  if(won||!mazeData)return;
  const op=mazeData.conn[playerR][playerC];
  if(!op.has(dir))return;
  const D={N:[-1,0,'S'],S:[1,0,'N'],E:[0,1,'W'],W:[0,-1,'E']};
  const[dr,dc,rd]=D[dir];
  const nr=playerR+dr,nc=playerC+dc;
  if(nr<0||nr>=ROWS||nc<0||nc>=COLS)return;
  if(!mazeData.conn[nr][nc].has(rd))return;
  playerR=nr;playerC=nc;
  updatePlayer();
  if(nr===mazeData.goalR&&nc===mazeData.goalC){
    won=true;setTimeout(()=>document.getElementById('wo').classList.add('show'),500);
  }
}

function newMaze(){
  won=false;
  document.getElementById('wo').classList.remove('show');
  mazeData=generateMaze();
  playerR=mazeData.startR;playerC=mazeData.startC;
  buildWallGrid();fitCanvas();updatePlayer();updateGoal();
}

function loop(){drawMaze();requestAnimationFrame(loop);}

const MN=[
  {id:'c',freq:130.81,hd:123.47,hu:138.59,dir:'N'},
  {id:'d',freq:146.83,hd:138.59,hu:155.56,dir:'S'},
  {id:'e',freq:164.81,hd:155.56,hu:174.61,dir:'W'},
  {id:'f',freq:174.61,hd:164.81,hu:185.00,dir:'E'},
];
function closestNote(freq){
  let best=null,bd=1e9;
  for(const n of MN){const d=Math.abs(freq-n.freq);if(d<bd){bd=d;best=n;}}
  return(best&&freq>=best.hd&&freq<=best.hu)?best:null;
}

// ── MIC ──
let mAC=null,mAn=null,mReady=false,fH=[],dCD=0;
const buf=new Float32Array(4096);
async function startMic(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    mAC=new AudioContext();
    const src=mAC.createMediaStreamSource(stream);
    const g=mAC.createGain();g.gain.value=3.5;src.connect(g);
    mAn=mAC.createAnalyser();mAn.fftSize=4096;mAn.smoothingTimeConstant=0.3;
    g.connect(mAn);mReady=true;micLoop();
  }catch(e){}
}
function getRMS(){let s=0;for(let i=0;i<buf.length;i++)s+=buf[i]*buf[i];return Math.sqrt(s/buf.length);}
function micLoop(){
  if(mAn&&mReady){
    mAn.getFloatTimeDomainData(buf);
    const rms=getRMS();
    document.getElementById('vuf').style.width=Math.min(100,rms*600)+'%';
    const mdot=document.getElementById('mdot');
    if(rms<0.003){fH=[];dCD=0;mdot.className='mdot q';document.getElementById('mdet').textContent='—';}
    else{
      const freq=acorr(buf,mAC.sampleRate);
      if(freq>0){
        const note=closestNote(freq);
        document.getElementById('mdet').textContent=note?note.id:'~';
        mdot.className='mdot on';
        fH.push(freq);if(fH.length>3)fH.shift();
        if(note&&dCD===0){
          const ok=fH.filter(f=>{let bn=null,bd=1e9;for(const n of MN){const d=Math.abs(f-n.freq);if(d<bd){bd=d;bn=n;}}return bn&&bn.id===note.id&&f>=bn.hd&&f<=bn.hu;}).length;
          if(ok>=1){dCD=9;move(note.dir);}
        }
      }
    }
    if(dCD>0)dCD--;
  }
  requestAnimationFrame(micLoop);
}
function acorr(buf,sr){
  let rms=0;for(const v of buf)rms+=v*v;rms=Math.sqrt(rms/buf.length);if(rms<0.0005)return-1;
  const H=buf.length>>1;let r1=0;
  for(let i=0;i<H;i++){if(Math.abs(buf[i])<0.04){r1=i;break;}}
  const s=buf.subarray(r1,r1+H),L=s.length;
  const c=new Float32Array(L);
  for(let i=0;i<L;i++)for(let j=0;j<L-i;j++)c[i]+=s[j]*s[j+i];
  let d=0;while(d<L-1&&c[d]>c[d+1])d++;
  let mv=-1,mp=-1;for(let i=d;i<L;i++){if(c[i]>mv){mv=c[i];mp=i;}}
  if(mp<1)return-1;
  let T=mp;
  if(mp>0&&mp<L-1){const a=(c[mp-1]+c[mp+1]-2*c[mp])/2,b=(c[mp+1]-c[mp-1])/2;if(a)T-=b/(2*a);}
  const f=sr/T;return(f<80||f>600)?-1:f;
}

let selectedChar=null;
const CHARACTERS={
  1:{name:'Odkrywca',imgKey:'CHAR1'},
};

function selectChar(id){
  if(!CHARACTERS[id])return;
  selectedChar=id;
  document.querySelectorAll('.char-card:not(.locked)').forEach(c=>c.classList.remove('selected'));
  document.getElementById('card-'+id).classList.add('selected');
  document.getElementById('start-btn').classList.add('active');
}

function startGame(){
  if(!selectedChar)return;
  // Set player image
  document.getElementById('pl-img').src=TB['CHAR1'];
  // Size relative to TILE — will be updated in fitCanvas
  document.getElementById('char-screen').style.display='none';
  document.getElementById('hdr').style.display='flex';
  document.getElementById('ga').style.display='flex';
  startMic();
  loadTiles(()=>{newMaze();loop();});
}

function backToSelect(){
  document.getElementById('char-screen').style.display='flex';
  document.getElementById('hdr').style.display='none';
  document.getElementById('ga').style.display='none';
  document.getElementById('wo').classList.remove('show');
  won=false;mazeData=null;
}
