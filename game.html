<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Piano Invaders</title>
<style>
body { background:black; margin:0; overflow:hidden; }
canvas { display:block; margin:0 auto; background:black; }
</style>
</head>
<body>
<canvas id="game" width="600" height="600"></canvas>
<script>
// ------------------------------------------
// USTAWIENIA GRY
// ------------------------------------------
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const NOTES = {
  C1: {freq:261.63},
  D1: {freq:293.66},
  G:  {freq:392.00},
  A:  {freq:440.00},
  H:  {freq:493.88}
};
// MONSTERS (nuty)
const monsterRows = 3;
const monsterCols = 10;
const monsterLetters = ["A","H","G"]; 
let monsters = [];
// PLAYER
let player = {x:300, y:550, width:30, height:20};
// BULLETS
let bullets = [];
// ------------------------------------------
// TWORZENIE POTWORÓW
// ------------------------------------------
function resetMonsters(){
  monsters = [];
  for(let r=0;r<monsterRows;r++){
    for(let c=0;c<monsterCols;c++){
      monsters.push({
        x: 40 + c*50,
        y: 40 + r*50,
        letter: monsterLetters[Math.floor(Math.random()*monsterLetters.length)],
        alive:true
      });
    }
  }
}
resetMonsters();
// ------------------------------------------
// RYSOWANIE
// ------------------------------------------
function drawMonsters(){
  ctx.fillStyle = "lime";
  ctx.font = "28px monospace";
  monsters.forEach(m=>{
    if(m.alive){
      ctx.fillText(m.letter, m.x, m.y);
    }
  });
}
function drawPlayer(){
  ctx.fillStyle = "cyan";
  ctx.fillRect(player.x - 15, player.y, 30, 20);
}
function drawBullets(){
  ctx.fillStyle = "white";
  bullets.forEach(b=>{
    ctx.fillRect(b.x-2, b.y-10, 4, 10);
  });
}
// ------------------------------------------
// STRZELANIE
// ------------------------------------------
function shoot(letter){
  bullets.push({
    x: player.x,
    y: player.y - 10,
    letter: letter
  });
}
// ------------------------------------------
// KOLIZJE
// ------------------------------------------
function updateBullets(){
  bullets.forEach(b=>b.y -= 5);
  bullets = bullets.filter(b => b.y > 0);
  bullets.forEach(b=>{
    monsters.forEach(m=>{
      if(m.alive &&
         b.x > m.x - 15 &&
         b.x < m.x + 15 &&
         b.y < m.y &&
         b.letter === m.letter)
      {
        m.alive = false;
        playPop();
      }
    });
  });
}
// ------------------------------------------
// DŹWIĘK POP
// ------------------------------------------
function playPop(){
  let ac = new AudioContext();
  let osc = ac.createOscillator();
  osc.frequency.value = 600;
  osc.connect(ac.destination);
  osc.start();
  osc.stop(ac.currentTime + 0.1);
}
// ------------------------------------------
// MIKROFON + WYKRYWANIE NUT
// ------------------------------------------
let audioCtx, analyser, micStream;
async function startMic(){
  micStream = await navigator.mediaDevices.getUserMedia({audio:true});
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  const src = audioCtx.createMediaStreamSource(micStream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 4096;
  src.connect(analyser);
  listenPitch();
}
startMic();
function listenPitch(){
  const buf = new Float32Array(analyser.fftSize);
  function detect(){
    analyser.getFloatTimeDomainData(buf);
    let pitch = autoCorrelate(buf, audioCtx.sampleRate);
    if(pitch>0){
      handlePitch(pitch);
    }
    requestAnimationFrame(detect);
  }
  detect();
}
function handlePitch(freq){
  let dist = (a,b)=>Math.abs(a-b);
  // sterowanie
  if(dist(freq, NOTES.C1.freq) < 15){
    player.x -= 6;
  }
  if(dist(freq, NOTES.D1.freq) < 15){
    player.x += 6;
  }
  // strzały
  if(dist(freq, NOTES.A.freq) < 20){
    shoot("A");
  }
  if(dist(freq, NOTES.H.freq) < 20){
    shoot("H");
  }
  if(dist(freq, NOTES.G.freq) < 20){
    shoot("G");
  }
  // ograniczenia ekranu
  player.x = Math.max(20, Math.min(580, player.x));
}
// ------------------------------------------
// AUTOCORRELATION - wykrywanie częstotliwości
// ------------------------------------------
function autoCorrelate(buf, sampleRate) {
  let SIZE = buf.length;
  let MAX_SAMPLES = Math.floor(SIZE/2);
  let bestOffset = -1;
  let bestCorrelation = 0;
  let rms = 0;
  for (let i=0;i<SIZE;i++) {
    let val = buf[i];
    rms += val*val;
  }
  rms = Math.sqrt(rms/SIZE);
  if(rms < 0.01) return -1;
  let prevCorrelation = 1;
  for (let offset = 0; offset < MAX_SAMPLES; offset++) {
    let correlation = 0;
    for (let i=0; i<MAX_SAMPLES; i++){
      correlation += Math.abs( (buf[i]) - (buf[i+offset]) );
    }
    correlation = 1 - (correlation/MAX_SAMPLES);
    if(correlation>bestCorrelation){
      bestCorrelation = correlation;
      bestOffset = offset;
    }
    prevCorrelation = correlation;
  }
  if(bestCorrelation > 0.01){
    let freq = sampleRate/bestOffset;
    return freq;
  }
  return -1;
}
// ------------------------------------------
// PĘTLA GRY
// ------------------------------------------
function loop(){
  ctx.clearRect(0,0,600,600);
  drawMonsters();
  drawPlayer();
  drawBullets();
  updateBullets();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
