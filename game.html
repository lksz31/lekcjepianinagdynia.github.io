<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Piano Invaders</title>
<style>
body{margin:0;background:#000;display:flex;overflow:hidden;}
canvas{display:block;background:#000;}
#panel{width:160px;background:#050510;border-left:1px solid #111;color:#aaa;font:11px 'Courier New',monospace;padding:8px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;}
.pt{font-size:9px;color:#223;text-transform:uppercase;letter-spacing:2px;margin-bottom:4px;}
.nr{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid #0a0a0a;}
.nr span:first-child{color:#ffdd00;}
.nr.move span:first-child{color:#44aaff;}
.nr.lit{background:rgba(255,220,0,.15);}
/* mic */
.mdot{width:9px;height:9px;border-radius:50%;background:#111;display:inline-block;margin-right:5px;vertical-align:middle;}
.mdot.on{background:#0f0;box-shadow:0 0 6px #0f0;}
#mdet{font-size:18px;color:#ffdd00;font-weight:bold;display:block;min-height:22px;}
.vu{height:3px;background:#111;margin:3px 0;}
.vuf{height:100%;width:0;background:linear-gradient(90deg,#0a0,#ff0,#f00);transition:width .04s;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <div>
    <div class="pt">Mikrofon</div>
    <span class="mdot" id="mdot"></span><span id="mst">—</span><br>
    <span id="mdet">—</span>
    <div class="vu"><div class="vuf" id="vuf"></div></div>
  </div>
  <div>
    <div class="pt">Ruch (mała)</div>
    <div class="nr move" id="nr-c">  <span>c</span><span>kol 1</span></div>
    <div class="nr move" id="nr-d">  <span>d</span><span>kol 2</span></div>
    <div class="nr move" id="nr-e">  <span>e</span><span>kol 3</span></div>
    <div class="nr move" id="nr-f">  <span>f</span><span>kol 4</span></div>
    <div class="nr move" id="nr-g">  <span>g</span><span>kol 5</span></div>
    <div class="nr move" id="nr-a">  <span>a</span><span>kol 6</span></div>
    <div class="nr move" id="nr-h">  <span>h</span><span>kol 7</span></div>
  </div>
  <div>
    <div class="pt">Strzał (razkreślna)</div>
    <div class="nr" id="nr-C1"><span>c¹</span><span>strzel C</span></div>
    <div class="nr" id="nr-D1"><span>d¹</span><span>strzel D</span></div>
    <div class="nr" id="nr-E1"><span>e¹</span><span>strzel E</span></div>
    <div class="nr" id="nr-F1"><span>f¹</span><span>strzel F</span></div>
    <div class="nr" id="nr-G1"><span>g¹</span><span>strzel G</span></div>
    <div class="nr" id="nr-A1"><span>a¹</span><span>strzel A</span></div>
    <div class="nr" id="nr-H1"><span>h¹</span><span>strzel H</span></div>
  </div>
</div>
<script>
'use strict';
const cv=document.getElementById('c'), cx=cv.getContext('2d');
const PW=window.innerWidth-160, PH=window.innerHeight;
cv.width=PW; cv.height=PH;
 
// 7 columns
const COLS=7;
const COL_W=PW/COLS;
// column centers
const colX=i=>COL_W*i+COL_W/2;
 
// Notes — small octave → move (C=130Hz range)
// C=130.81 D=146.83 E=164.81 F=174.61 G=196.00 A=220.00 H=246.94
// Notes — one-line octave → shoot (C1=261.63 ... H1=493.88)
const MOVE_NOTES=[
  {id:'c', freq:130.81, col:0},
  {id:'d', freq:146.83, col:1},
  {id:'e', freq:164.81, col:2},
  {id:'f', freq:174.61, col:3},
  {id:'g', freq:196.00, col:4},
  {id:'a', freq:220.00, col:5},
  {id:'h', freq:246.94, col:6},
];
const SHOOT_NOTES=[
  {id:'C1', freq:261.63, letter:'C'},
  {id:'D1', freq:293.66, letter:'D'},
  {id:'E1', freq:329.63, letter:'E'},
  {id:'F1', freq:349.23, letter:'F'},
  {id:'G1', freq:392.00, letter:'G'},
  {id:'A1', freq:440.00, letter:'A'},
  {id:'H1', freq:493.88, letter:'H'},
];
const ALL_NOTES=[...MOVE_NOTES,...SHOOT_NOTES];
const TOL=0.18; // 18% tolerance
 
function closest(freq){
  let best=null,bd=1e9;
  for(const n of ALL_NOTES){const d=Math.abs(freq-n.freq)/n.freq;if(d<bd){bd=d;best=n;}}
  return bd<=TOL?best:null;
}
 
// MONSTERS — 3 rows × 7 cols, each col has letter matching col index mod 7
// monster letter = one of C D E F G A H (shoot note letters)
const SHOOT_LETTERS=['C','D','E','F','G','A','H'];
const MCOL=['#f44','#f84','#ff4','#4f4','#4ff','#48f','#a4f'];
let monsters=[];
function resetMonsters(){
  monsters=[];
  const rows=3;
  const my=[80,130,180];
  for(let r=0;r<rows;r++){
    for(let col=0;col<COLS;col++){
      monsters.push({
        col, x:colX(col), y:my[r],
        letter:SHOOT_LETTERS[Math.floor(Math.random()*SHOOT_LETTERS.length)],
        alive:true
      });
    }
  }
}
resetMonsters();
 
// PLAYER
let playerCol=3; // start center
const PLAYER_Y=PH-40;
const PLAYER_W=40, PLAYER_H=14;
 
// BULLETS
let bullets=[];
const BULLET_SPEED=9;
const SHOT_CD=300; // ms per letter
const lastShot={};
 
function shoot(letter){
  const now=performance.now();
  if(now-(lastShot[letter]||0)<SHOT_CD) return;
  lastShot[letter]=now;
  bullets.push({x:colX(playerCol), y:PLAYER_Y-PLAYER_H, letter});
}
 
// DRAW
function draw(){
  cx.clearRect(0,0,PW,PH);
 
  // column grid (faint)
  cx.strokeStyle='#0a0a0a'; cx.lineWidth=1;
  for(let i=1;i<COLS;i++){cx.beginPath();cx.moveTo(i*COL_W,0);cx.lineTo(i*COL_W,PH);cx.stroke();}
 
  // monsters
  cx.textAlign='center'; cx.textBaseline='middle'; cx.font='bold 13px Courier New';
  for(const m of monsters){
    if(!m.alive) continue;
    cx.fillStyle=MCOL[m.col];
    cx.fillRect(m.x-18,m.y-12,36,20);
    cx.fillStyle='#000';
    cx.fillText(m.letter,m.x,m.y);
  }
 
  // bullets
  cx.font='bold 9px Courier New';
  for(const b of bullets){
    cx.fillStyle='#fff';
    cx.fillRect(b.x-2,b.y,4,10);
    cx.fillStyle='#ff8';
    cx.fillText(b.letter,b.x,b.y-6);
  }
 
  // player
  const px=colX(playerCol);
  cx.fillStyle='#0cf';
  cx.fillRect(px-PLAYER_W/2, PLAYER_Y-PLAYER_H, PLAYER_W, PLAYER_H);
 
  // column labels at bottom
  cx.fillStyle='#222'; cx.font='10px Courier New'; cx.textAlign='center';
  for(let i=0;i<COLS;i++){
    cx.fillText(SHOOT_LETTERS[i],colX(i),PH-8);
  }
}
 
// UPDATE
function update(){
  // move bullets up
  for(const b of bullets) b.y-=BULLET_SPEED;
 
  // collision
  for(const b of bullets){
    if(b.y<-20){b.dead=true;continue;}
    for(const m of monsters){
      if(!m.alive) continue;
      if(Math.abs(b.x-m.x)<22 && b.y<m.y+14 && b.y>m.y-20){
        // always remove bullet
        b.dead=true;
        // only kill monster if letters match
        if(b.letter===m.letter) m.alive=false;
        break;
      }
    }
  }
  bullets=bullets.filter(b=>!b.dead);
 
  // win check
  if(monsters.every(m=>!m.alive)) setTimeout(()=>resetMonsters(),600);
}
 
// MAIN LOOP — single RAF, no extra intervals
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
 
// ─── MICROPHONE ───────────────────────────────
let mAC=null, mAn=null, fH=[], dCD=0, mReady=false;
 
async function startMic(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia(
      {audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    mAC=new AudioContext();
    const src=mAC.createMediaStreamSource(stream);
    const gain=mAC.createGain(); gain.gain.value=2;
    src.connect(gain);
    mAn=mAC.createAnalyser(); mAn.fftSize=4096; mAn.smoothingTimeConstant=0.4;
    gain.connect(mAn);
    mReady=true;
    document.getElementById('mst').textContent='ON';
    document.getElementById('mst').style.color='#0f0';
    detect();
  }catch(e){document.getElementById('mst').textContent='brak';}
}
startMic();
 
const buf=new Float32Array(4096);
function detect(){
  if(!mReady){requestAnimationFrame(detect);return;}
  mAn.getFloatTimeDomainData(buf);
 
  // RMS
  let rms=0; for(let i=0;i<buf.length;i++) rms+=buf[i]*buf[i]; rms=Math.sqrt(rms/buf.length);
  document.getElementById('vuf').style.width=Math.min(100,rms*600)+'%';
 
  const mdot=document.getElementById('mdot');
  if(rms<0.006){fH=[];dCD=0;mdot.className='mdot';document.getElementById('mdet').textContent='—';clearLit();requestAnimationFrame(detect);return;}
 
  const freq=acorr(buf,mAC.sampleRate);
  if(freq<0){requestAnimationFrame(detect);return;}
 
  mdot.className='mdot on';
  fH.push(freq); if(fH.length>3) fH.shift();
 
  const note=closest(freq);
  document.getElementById('mdet').textContent=note?note.id+'  '+Math.round(freq)+'Hz':'~'+Math.round(freq)+'Hz';
 
  if(note){
    litRow(note.id);
    // stability: 1 of 3
    const ok=fH.filter(f=>{const n=closest(f);return n&&n.id===note.id;}).length;
    if(ok>=1&&dCD===0){
      dCD=7;
      if(note.col!==undefined) playerCol=note.col;       // move
      else shoot(note.letter);                            // shoot
    }
  } else clearLit();
  if(dCD>0) dCD--;
  requestAnimationFrame(detect);
}
 
function acorr(buf,sr){
  let rms=0; for(const v of buf) rms+=v*v; rms=Math.sqrt(rms/buf.length);
  if(rms<0.0005) return -1;
  const N=buf.length, H=N>>1;
  // find first zero crossing
  let r1=0;
  for(let i=0;i<H;i++){if(Math.abs(buf[i])<0.04){r1=i;break;}}
  const s=buf.subarray(r1,r1+H);
  const L=s.length;
  // autocorrelation
  const c=new Float32Array(L);
  for(let i=0;i<L;i++) for(let j=0;j<L-i;j++) c[i]+=s[j]*s[j+i];
  let d=0; while(d<L-1&&c[d]>c[d+1]) d++;
  let mv=-1,mp=-1; for(let i=d;i<L;i++){if(c[i]>mv){mv=c[i];mp=i;}}
  if(mp<1) return -1;
  // parabolic interpolation
  let T=mp;
  if(mp>0&&mp<L-1){const a=(c[mp-1]+c[mp+1]-2*c[mp])/2,b=(c[mp+1]-c[mp-1])/2;if(a)T-=b/(2*a);}
  const f=sr/T;
  return (f<80||f>2000)?-1:f;
}
 
function clearLit(){document.querySelectorAll('.nr').forEach(r=>r.classList.remove('lit'));}
function litRow(id){clearLit();const el=document.getElementById('nr-'+id);if(el)el.classList.add('lit');}
</script>
</body>
</html>
