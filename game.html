<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Music Hex Garden</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    background-color: #f0f8ff;
  }

  #game {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 20px;
  }

  #hexMap {
    display: grid;
    grid-template-columns: repeat(10, 50px);
    grid-gap: 5px;
  }

  .hex {
    width: 50px;
    height: 50px;
    background-color: #88cc88;
    clip-path: polygon(
      25% 0%,
      75% 0%,
      100% 50%,
      75% 100%,
      25% 100%,
      0% 50%
    );
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    cursor: pointer;
    position: relative;
  }

  .player {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 20px;
    height: 20px;
    background: red;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  #status {
    margin-top: 10px;
  }
</style>
</head>
<body>
<div id="game">
  <h1>Music Hex Garden</h1>
  <div id="hexMap"></div>
  <button id="startMic">Start Microphone</button>
  <div id="status">Microphone not started</div>
  <p>Use singing to move (C=Up, D=Right, E=Down, F=Left).</p>
</div>

<script>
const mapSize = 10; // 10x10 grid
const hexMapDiv = document.getElementById('hexMap');
const statusDiv = document.getElementById('status');

let playerPosition = {x: 0, y: 0};
let microphoneActive = false;
let audioContext;
let analyser;
let microphoneStream;
let pitchDetectionInterval;

// Game state for tiles
// Each tile: {hasSeed: bool, isGrowing: bool, watered: bool}
const mapTiles = Array.from({ length: mapSize }, () => 
  Array.from({ length: mapSize }, () => ({hasSeed: false, isGrowing: false, watered: false}))
);

// Generate hex map
for (let y = 0; y < mapSize; y++) {
  for (let x = 0; x < mapSize; x++) {
    const hex = document.createElement('div');
    hex.className = 'hex';
    hex.dataset.x = x;
    hex.dataset.y = y;
    hex.innerText = '';
    hexMapDiv.appendChild(hex);
  }
}

// Draw player
function drawPlayer() {
  document.querySelectorAll('.hex').forEach(hex => {
    hex.innerHTML = '';
    hex.style.border = 'none';
  });
  const currentHex = getHex(playerPosition.x, playerPosition.y);
  const playerDot = document.createElement('div');
  playerDot.className = 'player';
  currentHex.appendChild(playerDot);
}
drawPlayer();

function getHex(x, y) {
  return document.querySelector(`.hex[data-x='${x}'][data-y='${y}']`);
}

// Microphone setup
document.getElementById('startMic').addEventListener('click', () => {
  startMicrophone();
});

function startMicrophone() {
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      microphoneStream = audioContext.createMediaStreamSource(stream);
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 2048;
      microphoneStream.connect(analyser);
      statusDiv.innerText = 'Microphone started. Sing a note!';
      microphoneActive = true;
      detectPitch();
    }).catch(err => {
      statusDiv.innerText = 'Microphone access denied.';
    });
  } else {
    statusDiv.innerText = 'Microphone not supported in this browser.';
  }
}

// Pitch detection using auto-correlation
function detectPitch() {
  const bufferLength = analyser.fftSize;
  const buffer = new Float32Array(bufferLength);

  setInterval(() => {
    analyser.getFloatTimeDomainData(buffer);
    const pitchFreq = autoCorrelate(buffer, audioContext.sampleRate);
    if (pitchFreq !== -1) {
      const note = getNoteFromFrequency(pitchFreq);
      statusDiv.innerText = 'Detected note: ' + note;
      handleNoteInput(note);
    }
  }, 500);
}

// Auto-correlation pitch detection
function autoCorrelate(buf, sampleRate) {
  let SIZE = buf.length;
  let MAX_SAMPLES = Math.floor(SIZE/2);
  let bestOffset = -1;
  let bestCorrelation = 0;
  let rms = 0;
  for (let i=0; i < SIZE; i++) {
    let val = buf[i];
    rms += val*val;
  }
  rms = Math.sqrt(rms/SIZE);
  if (rms < 0.01) // too quiet
    return -1;

  let correlations = new Array(MAX_SAMPLES);
  for (let offset=0; offset < MAX_SAMPLES; offset++) {
    let correlation = 0;

    for (let i=0; i < MAX_SAMPLES; i++) {
      correlation += buf[i] * buf[i+offset];
    }
    correlations[offset] = correlation;
    if (correlation > bestCorrelation) {
      bestCorrelation = correlation;
      bestOffset = offset;
    }
  }

  if (bestCorrelation > 0.01) {
    let freq = sampleRate / bestOffset;
    return freq;
  }
  return -1;
}

// Map frequency to note
function getNoteFromFrequency(freq) {
  const noteFreqs = {
    'C': 261.63,
    'D': 293.66,
    'E': 329.63,
    'F': 349.23,
    'G': 392.00,
    'A': 440.00,
    'B': 493.88
  };
  let closestNote = null;
  let minDiff = Infinity;
  for (const [note, noteFreq] of Object.entries(noteFreqs)) {
    const diff = Math.abs(freq - noteFreq);
    if (diff < minDiff) {
      minDiff = diff;
      closestNote = note;
    }
  }
  return closestNote;
}

// Handle singing notes for movement and actions
let lastNote = null;
function handleNoteInput(note) {
  // Prevent repeated triggers
  if (note === lastNote) return;
  lastNote = note;

  // Movement
  if (note === 'C') movePlayer(0, -1); // up
  if (note === 'D') movePlayer(1, 0); // right
  if (note === 'E') movePlayer(0, 1); // down
  if (note === 'F') movePlayer(-1, 0); // left

  // Plant seed with G
  if (note === 'G') {
    plantSeed();
  }

  // Harvest with A
  if (note === 'A') {
    harvestPlant();
  }

  // Water with B (if a seed is present)
  if (note === 'B') {
    waterPlant();
  }
}

// Movement
function movePlayer(dx, dy) {
  const newX = playerPosition.x + dx;
  const newY = playerPosition.y + dy;
  if (newX >= 0 && newX < mapSize && newY >= 0 && newY < mapSize) {
    playerPosition.x = newX;
    playerPosition.y = newY;
    drawPlayer();
    updateTileStatus();
  }
}

// Plant seed
function plantSeed() {
  const tile = mapTiles[playerPosition.x][playerPosition.y];
  if (!tile.hasSeed) {
    tile.hasSeed = true;
    tile.isGrowing = true;
    tile.watered = false;
    updateTileVisual(playerPosition.x, playerPosition.y);
  }
}

// Harvest plant
function harvestPlant() {
  const tile = mapTiles[playerPosition.x][playerPosition.y];
  if (tile.hasSeed && !tile.isGrowing) {
    tile.hasSeed = false;
    tile.watered = false;
    updateTileVisual(playerPosition.x, playerPosition.y, true);
  } else {
    alert('Nothing to harvest here!');
  }
}

// Water plant
function waterPlant() {
  const tile = mapTiles[playerPosition.x][playerPosition.y];
  if (tile.hasSeed && tile.isGrowing) {
    tile.watered = true;
    updateTileVisual(playerPosition.x, playerPosition.y);
  }
}

// Update tile visual
function updateTileVisual(x, y, harvested=false) {
  const hex = getHex(x, y);
  const tile = mapTiles[x][y];
  hex.innerHTML = '';
  if (tile.hasSeed) {
    const seedDiv = document.createElement('div');
    seedDiv.innerText = tile.isGrowing ? '🌱' : '🌳';
    if (tile.watered) seedDiv.innerText = '💧' + seedDiv.innerText;
    hex.appendChild(seedDiv);
  } else {
    hex.innerText = '';
  }
}

// Update tile state when player moves
function updateTileStatus() {
  const tile = mapTiles[playerPosition.x][playerPosition.y];
  if (tile.hasSeed && tile.isGrowing && tile.watered) {
    // Grow seed over time
    setTimeout(() => {
      tile.isGrowing = false; // plant is ready
      updateTileVisual(playerPosition.x, playerPosition.y);
    }, 3000); // 3 seconds to grow
  }
}

</script>
</body>
</html>
